{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common.fullname" . }}-ingress
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- .Values.ingress.tls | toYaml | nindent 4 }}
  {{- end }}
  rules:
  - host: {{ quote .Values.ingress.host }}
    http:
      paths:
      {{- range .Values.ingress.extraPaths }}
      - path: {{ .path }}
        pathType: {{ .pathType | default "Prefix" }}
        backend:
          service:
            name: {{ .serviceName | default (printf "%s-%s-service" $.Release.Name .service) }}
            port:
              name: {{ .portName | default "http" }}
      {{- end }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: '{{ include "common.fullname" . }}-service'
            port:
              name: http
{{- end }}
