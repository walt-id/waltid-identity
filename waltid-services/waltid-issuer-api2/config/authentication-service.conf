name = "keycloak"
authorizeUrl = "https://keycloak.demo.walt.id/realms/mynewrealm/protocol/openid-connect/auth"
accessTokenUrl = "https://keycloak.demo.walt.id/realms/mynewrealm/protocol/openid-connect/token"
clientId = "issuer_api"
# Keep the placeholder when the environment variable is unset.
clientSecret = "KEYCLOAK_CLIENT_SECRET_REQUIRED"
clientSecret = ${?KEYCLOAK_CLIENT_SECRET}
defaultScopes = ["openid", "profile"]
forwardIssuerStateToAuthorizationServer = false

# Test users:
# jane@walt.id; jane
# Claims:
# given_name, family_name

# max@walt.id; password
# Claims:
# clearanceLevel, employeeId, position, department, startDate
