# Destinations for this service's outbound requests to URLs that callers, offers, or requests supply,
# including session webhooks. Loopback and private networks are refused unless opted in.
# Link-local and cloud-metadata addresses cannot be allowed. trustedHostSuffixes skips only the
# loopback and private-network checks for that hostname and its subdomains.
allowLoopback = false
allowPrivateNetworks = false
trustedHostSuffixes = []
