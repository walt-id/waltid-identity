# Omitted per-session and service clientId is generated as redirect_uri:<response_uri>
# for unsigned sessions. A configured service clientId is used when the session omits one.
# Signed requests still need an explicit clientId (for example x509_san_dns or DID).
# clientId: "verifier2"
#clientId: "x509_san_dns:verifier.example.com"
clientId: "x509_hash:OPpTDyXlg6WRu2-Qn4rpQcA9uVqSrNExCS8kCYUe09A"

clientMetadata: {
    # client_name/logo_uri/tos_uri/policy_uri/client_uri (and their RFC 7591 "#lang" i18n variants)
    # are deliberately left out here: they're OIDC dynamic-client-registration vocabulary, not part
    # of the OpenID4VP 1.0 Final client_metadata object (only vp_formats_supported is - see
    # https://github.com/openid/OpenID4VP/pull/233). The conformance suite's
    # VP1FinalCheckForUnexpectedParametersInVpClientMetadata flags them on every request, which caps
    # every negative/REJECT test module below the suite's PASSED verdict regardless of whether the
    # verifier's rejection logic is correct - see docs/VP-VERIFIER.md Open Issues in
    # waltid-openid4vp-conformance-runners. ClientMetadata still supports these fields (see
    # ClientMetadata.kt) for deployments that want wallet-facing branding and don't need strict
    # OpenID4VP 1.0 Final conformance; re-add them here if this config is reused for that purpose.
}

urlPrefix: "http://localhost:7004/verification-session"
# urlPrefix: "https://verifier2.localhost/verification-session"

urlHost: "openid4vp://authorize"
#urlHost: "https://localhost.emobix.co.uk:8443/test/1y67TyvenXrIO5s/authorize"

# Optional. Used when the session omits clientId. Unsigned sessions without a
# configured or per-session clientId use redirect_uri:<response_uri>.
# clientId: "x509_san_dns:verifier.example.com"
# or: clientId: "x509_hash:QAVowbR8GDNBgQT-CO-vBeg6D2H_kWeMqVRJPNqmiJU"

