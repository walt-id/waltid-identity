x5c: [""]

# Bounds on the in-memory verification session store. Both are optional; omitted means the built-in defaults of
# 2000 sessions and 256 MiB. Only the in-memory store is affected - with a persistent repository the database
# bounds the store instead.
#
# maxInMemoryBytes is the one to change after an out-of-memory incident. A session's cost is set by the
# credential presented to it: an mdoc carrying a 230 KB portrait measured 1.64 MiB retained, so 2000 such
# sessions would be 3.3 GB while 2000 small ones are about 16 MB. Keep the budget well below the heap.
# maxInMemorySessions: 2000
# maxInMemoryBytes: 268435456
