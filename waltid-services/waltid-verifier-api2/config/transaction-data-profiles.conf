transactionDataProfiles = [
  {
    type = "org.waltid.transaction-data.payment-authorization"
    displayName = "Payment Authorization"
    fields = ["amount", "currency", "payee"]
  },
  {
    type = "org.waltid.transaction-data.account-access"
    displayName = "Account Access"
    fields = ["account_identifier", "access_scope"]
  },
  # The payment type Android's Credential Manager understands, so a payment transaction_data item
  # survives the platform matcher. Neither the type nor the field names are ours to choose:
  # AndroidX's default OpenID4VP matcher switches on `type` and reads exactly `payee_name`,
  # `payment_amount` and `payment_currency` for this one. A payment type it does not recognise
  # falls through to reading `merchant_name`, which Credential Manager rejects when absent by
  # producing no candidate at all - so on Android this profile is what makes the two sides agree.
  #
  # The other type it recognises, `urn:eudi:sca:payment:1`, is deliberately not declared here: it
  # reads a nested `payload.payee.name` / `payload.amount_display` / `payload.currency` structure,
  # which a flat `fields` list cannot describe.
  {
    type = "payment_details"
    displayName = "Payment Authorization"
    fields = ["payee_name", "payment_amount", "payment_currency"]
  }
]
