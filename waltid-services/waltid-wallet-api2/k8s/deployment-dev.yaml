apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet2-web-config
data:
  web.conf: |
    webHost = "0.0.0.0"
    webPort = 3000
  _features.conf: |
    enabledFeatures = [
        auth
        dev-mode
        wallet2-persistence
    ]
  wallet2-persistence.conf: |
    jdbcUrl = "jdbc:sqlite:/waltid-wallet-api2/data/wallet2.db"
    driverClassName = "org.sqlite.JDBC"
  wallet-service.conf: |
    publicBaseUrl = "https://wallet2.test.waltid.cloud"
    attestationConfig {
      attesterUrl = "https://wallet-provider.eudiw.dev/wallet-instance-attestation/jwk"
      requestBody {
        jwk = "{{public_jwk}}"
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallet-api2-data-volume-claim
spec:
  storageClassName: gp3-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: wallet-api2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-api2
  template:
    metadata:
      labels:
        app: wallet-api2
      annotations:
        deployment/id: "_DEFAULT_DEPLOYMENT_"
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wallet-api2
          image: waltid/wallet-api2:__DEFAULT_IMAGE_TAG__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: wallet2-web-config
              mountPath: "/waltid-wallet-api2/config/web.conf"
              subPath: web.conf
              readOnly: true
            - name: wallet2-web-config
              mountPath: "/waltid-wallet-api2/config/_features.conf"
              subPath: _features.conf
              readOnly: true
            - name: wallet2-auth-config
              mountPath: "/waltid-wallet-api2/config/auth.conf"
              subPath: auth.conf
              readOnly: true
            - name: wallet2-web-config
              mountPath: "/waltid-wallet-api2/config/wallet2-persistence.conf"
              subPath: wallet2-persistence.conf
              readOnly: true
            - name: wallet2-web-config
              mountPath: "/waltid-wallet-api2/config/wallet-service.conf"
              subPath: wallet-service.conf
              readOnly: true
            - mountPath: "/waltid-wallet-api2/data/"
              name: wallet-data
          ports:
            - containerPort: 3000
              name: http-api
      volumes:
        - name: wallet2-web-config
          configMap:
            name: wallet2-web-config
        - name: wallet2-auth-config
          secret:
            secretName: wallet2-auth-secret
        - name: wallet-data
          persistentVolumeClaim:
            claimName: wallet-api2-data-volume-claim
---
kind: Service
apiVersion: v1
metadata:
  name: wallet-api2
spec:
  ports:
    - name: http
      port: 80
      targetPort: http-api
      protocol: TCP
  selector:
    app: wallet-api2
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: wallet-demo-compose-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-demo-compose-web
  template:
    metadata:
      labels:
        app: wallet-demo-compose-web
      annotations:
        deployment/id: "_DEFAULT_DEPLOYMENT_"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wallet-demo-compose-web
          image: waltid/wallet-demo-compose-web:__DEFAULT_IMAGE_TAG__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: WALLET_API2_PUBLIC_URL
              value: "https://wallet2.test.waltid.cloud"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /branding.json
              port: http
          livenessProbe:
            httpGet:
              path: /branding.json
              port: http
---
kind: Service
apiVersion: v1
metadata:
  name: wallet-demo-compose-web
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: wallet-demo-compose-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallet2-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wallet2.test.waltid.cloud
      secretName: wallet2-tls-secret
  rules:
    - host: wallet2.test.waltid.cloud
      http:
        paths:
          # No trailing slashes: the SPA calls `GET /wallet` and `POST /wallet` as well as
          # /wallet/<id>/..., and a `/wallet/` prefix would not match the bare path.
          - path: /wallet
            pathType: Prefix
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /transaction-data-profiles
            pathType: Prefix
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /api.json
            pathType: ImplementationSpecific
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /livez
            pathType: Prefix
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /features
            pathType: Prefix
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /debug
            pathType: Prefix
            backend:
              service:
                name: wallet-api2
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallet-demo-compose-web
                port:
                  name: http
