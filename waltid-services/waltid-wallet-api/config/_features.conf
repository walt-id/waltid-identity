enabledFeatures = [
    # ktor-authnz, # New waltid-ktor-authnz backed authentication system.
                   # This requires enabling environment variable NUXT_PUBLIC_AUTH_USE_KTORAUTHNZ=true in the frontend.
                   # Configured in `ktor-authnz.conf`
                   # Disable legacy auth for this (add "auth" in disabledFeatures list).

    # external-signature-endpoints,
    trusted-ca, # PTRID-753: required for x509_san_dns signed-Request-Object validation against
                # the RedGealc broker's Root CA -- see trusted-ca.conf. Commented out by default
                # upstream, which is why MissingX509TrustAnchors fires even with a correct
                # trusted-ca.conf present.
    # entra,
    # dev-mode # Enabling developer config from file `dev-mode.conf`
    # ...
]
disabledFeatures = [
    # auth   # Legacy auth, configured in `auth.conf`
             # Not recommended to use in parallel with new authentication backend (ktor-authnz feature), please enable only one at the same time.
]
