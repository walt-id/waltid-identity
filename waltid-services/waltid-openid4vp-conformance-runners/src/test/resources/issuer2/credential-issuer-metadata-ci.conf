# CI-only catalog: the eight configurations exercised by the combined issuer matrix.
issuerDisplay = [{ name = "walt.id Conformance Test Issuer", locale = "en-US" }]

credentialConfigurations {
  identity_credential {
    format = "dc+sd-jwt"
    scope = "identity_credential"
    vct = "vctBaseUrl"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk"]
    proof_types_supported.jwt.proof_signing_alg_values_supported = ["ES256"]
    proof_types_supported.jwt.key_attestations_required = {}
  }
  "org.iso.18013.5.1.mDL" {
    format = "mso_mdoc"
    scope = "org.iso.18013.5.1.mDL"
    doctype = "org.iso.18013.5.1.mDL"
    credential_signing_alg_values_supported = [-7, -9]
    cryptographic_binding_methods_supported = ["cose_key"]
    proof_types_supported.jwt.proof_signing_alg_values_supported = ["ES256"]
    proof_types_supported.jwt.key_attestations_required = {}
  }
  identity_credential_haip = ${credentialConfigurations.identity_credential}
  identity_credential_haip.scope = "identity_credential_haip"
  "org.iso.18013.5.1.mDL.haip" = ${credentialConfigurations."org.iso.18013.5.1.mDL"}
  "org.iso.18013.5.1.mDL.haip".scope = "org.iso.18013.5.1.mDL.haip"
}

credentialConfigurations."identity_credential.attestation" = ${credentialConfigurations."identity_credential"}
credentialConfigurations."identity_credential.attestation" {
  scope = "identity_credential.attestation"
  proof_types_supported = null
  proof_types_supported = { attestation { proof_signing_alg_values_supported = ["ES256"] } }
}

credentialConfigurations."org.iso.18013.5.1.mDL.attestation" = ${credentialConfigurations."org.iso.18013.5.1.mDL"}
credentialConfigurations."org.iso.18013.5.1.mDL.attestation" {
  scope = "org.iso.18013.5.1.mDL.attestation"
  proof_types_supported = null
  proof_types_supported = { attestation { proof_signing_alg_values_supported = ["ES256"] } }
}

credentialConfigurations."identity_credential_haip.attestation" = ${credentialConfigurations."identity_credential_haip"}
credentialConfigurations."identity_credential_haip.attestation" {
  scope = "identity_credential_haip.attestation"
  proof_types_supported = null
  proof_types_supported = { attestation { proof_signing_alg_values_supported = ["ES256"] } }
}

credentialConfigurations."org.iso.18013.5.1.mDL.haip.attestation" = ${credentialConfigurations."org.iso.18013.5.1.mDL.haip"}
credentialConfigurations."org.iso.18013.5.1.mDL.haip.attestation" {
  scope = "org.iso.18013.5.1.mDL.haip.attestation"
  proof_types_supported = null
  proof_types_supported = { attestation { proof_signing_alg_values_supported = ["ES256"] } }
}
