worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;
    # Behind the ingress, absolute redirects would leak the internal :8080 port.
    absolute_redirect off;

    # Kotlin (Dokka) docs: sdk.docs.walt.id and any unmatched host.
    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }
    }

    # Swift WalletSDK (DocC) docs.
    server {
        listen 8080;
        server_name ios-sdk.docs.walt.id ios-sdk-docs.test.waltid.cloud;
        root /usr/share/nginx/ios-html;
        index index.html;

        # DocC has no landing page at the site root.
        location = / {
            return 302 /documentation/walletsdk;
        }

        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }
    }
}
