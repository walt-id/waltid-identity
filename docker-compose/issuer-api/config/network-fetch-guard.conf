# Docker Compose: the services reach each other through host.docker.internal, which resolves to a
# private host-gateway address, and webhooks may target other containers on the Compose network.
# Private networks are allowed here. Loopback, link-local, and cloud-metadata addresses stay refused.
# Keep allowPrivateNetworks false on an internet-facing deployment unless it needs private targets.
allowLoopback = false
allowPrivateNetworks = true
trustedHostSuffixes = []
