services:
  issuer-api2:
    image: ${IMAGE_PREFIX}waltid/issuer-api2:${VERSION_TAG:-latest}
    profiles:
      - services
      - identity
      - all
    pull_policy: missing
    depends_on:
      - caddy
    env_file:
      - .env
    extra_hosts:
      - "$SERVICE_HOST:host-gateway"
    volumes:
      - ./issuer-api2/config:/waltid-issuer-api2/config

  verifier-api2:
    image: ${IMAGE_PREFIX}waltid/verifier-api2:${VERSION_TAG:-latest}
    profiles:
      - services
      - identity
      - all
    pull_policy: missing
    depends_on:
      - caddy
    env_file:
      - .env
    extra_hosts:
      - "$SERVICE_HOST:host-gateway"
    volumes:
      - ./verifier-api2/config:/waltid-verifier-api2/config

  wallet-api2:
    image: ${IMAGE_PREFIX}waltid/wallet-api2:${VERSION_TAG:-latest}
    profiles:
      - services
      - identity
      - all
    pull_policy: missing
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./wallet-api2/config:/waltid-wallet-api2/config

  web-portal2:
    image: ${IMAGE_PREFIX}waltid/portal2:${VERSION_TAG:-latest}
    profiles:
      - apps
      - identity
      - all
    pull_policy: missing
    build:
      context: ../
      dockerfile: waltid-applications/waltid-web-portal2/Dockerfile
    depends_on:
      # The api2 services are not part of the apps profile, so they may not be enabled
      issuer-api2:
        condition: service_started
        required: false
      verifier-api2:
        condition: service_started
        required: false
      caddy:
        condition: service_started
    environment:
      NUXT_PUBLIC_ISSUER_BASE: "http://$PUBLIC_SERVICE_HOST:$ISSUER_API2_PORT"
      NUXT_PUBLIC_VERIFIER_BASE: "http://$PUBLIC_SERVICE_HOST:$VERIFIER_API2_PORT"
      NUXT_PUBLIC_WALLET_URL: "http://$PUBLIC_SERVICE_HOST:$WALLET_DEMO_COMPOSE_WEB_PORT"
      NUXT_PUBLIC_VERIFIER_KEY_JWK: "$WEB_PORTAL2_VERIFIER_KEY_JWK"
      NUXT_PUBLIC_VERIFIER_X5C: "$WEB_PORTAL2_VERIFIER_X5C"
      NUXT_PUBLIC_VERIFIER_CLIENT_ID: "$WEB_PORTAL2_VERIFIER_CLIENT_ID"
      NUXT_ES_BASE_URL: "${WEB_PORTAL2_ES_BASE_URL:-}"
      NUXT_ES_EMAIL: "${WEB_PORTAL2_ES_EMAIL:-}"
      NUXT_ES_PASSWORD: "${WEB_PORTAL2_ES_PASSWORD:-}"
      NUXT_ES_EUDI_REF_ISSUER_TARGET: "${WEB_PORTAL2_ES_EUDI_REF_ISSUER_TARGET:-}"
      NUXT_ES_FRANCE_IDENTITE_ISSUER_TARGET: "${WEB_PORTAL2_ES_FRANCE_IDENTITE_ISSUER_TARGET:-}"
      NUXT_ES_DYOU_ISSUER_TARGET: "${WEB_PORTAL2_ES_DYOU_ISSUER_TARGET:-}"
      PORT: $WEB_PORTAL2_PORT

  wallet-demo-compose-web:
    image: ${IMAGE_PREFIX}waltid/wallet-demo-compose-web:${VERSION_TAG:-latest}
    profiles:
      - apps
      - identity
      - all
    pull_policy: missing
    build:
      context: ../
      dockerfile: waltid-applications/waltid-wallet-demo-compose/webApp/Dockerfile
    depends_on:
      wallet-api2:
        condition: service_started
        required: false
      caddy:
        condition: service_started
    environment:
      WALLET_API2_PUBLIC_URL: "http://$PUBLIC_SERVICE_HOST:$WALLET_API2_PORT"
      WALLET_BRAND_APP_TITLE: "$WALLET_BRAND_APP_TITLE"
      WALLET_BRAND_PRIMARY: "$WALLET_BRAND_PRIMARY"
      WALLET_BRAND_ON_PRIMARY: "$WALLET_BRAND_ON_PRIMARY"
      WALLET_BRAND_SECONDARY: "$WALLET_BRAND_SECONDARY"
      WALLET_BRAND_ON_SECONDARY: "$WALLET_BRAND_ON_SECONDARY"
      WALLET_BRAND_PRIMARY_CONTAINER: "$WALLET_BRAND_PRIMARY_CONTAINER"
      WALLET_BRAND_ON_PRIMARY_CONTAINER: "$WALLET_BRAND_ON_PRIMARY_CONTAINER"

  vc-repo:
    platform: linux/amd64
    image: ${IMAGE_PREFIX}waltid/vc-repository:${VERSION_VC_REPO:-latest}
    profiles:
      - services
      - all
    pull_policy: missing
    build:
      context: ../waltid-applications/waltid-credentials/.
    depends_on:
      - caddy
    environment:
      PORT: $VC_REPO_PORT

  valkey:
    image: valkey/valkey:${VERSION_VALKEY:-7.2}
    profiles:
      - valkey
      - all
    container_name: valkey
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always
    command: ["valkey-server", "--bind", "0.0.0.0", "--port", "6379"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data

  postgres:
    image: postgres
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-U", "$DB_USERNAME" ]
      interval: 5s
      timeout: 1s
      retries: 5
    restart: always
    environment:
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USERNAME
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - wallet-api-db:/waltid-wallet-api/data
    ports:
      - $POSTGRES_DB_PORT:5432 #TODO: tcp/udp proxy with caddy

  vault:
    image: hashicorp/vault:${VERSION_VAULT:-latest}
    profiles:
      - tse
      - all
    container_name: vault
    healthcheck:
      test: ["CMD-SHELL", "vault status || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl
      - vault_data:/vault/file
    ports:
      - "$VAULT_PORT:8200"
    environment:
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:$VAULT_PORT"
      VAULT_ADDR: "http://127.0.0.1:$VAULT_PORT"
    command: server -config=/vault/config/config.hcl -dev -dev-root-token-id="dev-only-token"
    restart: always

  vault-init:
    image: hashicorp/vault:${VERSION_VAULT:-latest}
    profiles:
      - tse
      - all
    container_name: vault-init
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-only-token"
      VAULT_ADDR: "http://vault:$VAULT_PORT"
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "/vault/scripts/init.sh"]
    volumes:
      - ./vault/init.sh:/vault/scripts/init.sh

  opa-server:
    platform: linux/amd64
    image: openpolicyagent/opa:${VERSION_OPA:-latest}
    container_name: opa-server
    profiles:
      - opa
      - all
    ports:
      - "$OPA_SERVER_PORT:8181"
    command: [ "run", "--server", "--addr", ":8181" ]
    extra_hosts:
      - "$SERVICE_HOST:host-gateway"

  caddy:
    image: docker.io/caddy:2
    restart: unless-stopped
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
    ports:

      - target: "$ISSUER_API2_PORT"
        published: $ISSUER_API2_PORT # issuer-api2
        protocol: tcp
        mode: host

      - target: "$VERIFIER_API2_PORT"
        published: $VERIFIER_API2_PORT # verifier-api2
        protocol: tcp
        mode: host

      - target: "$WALLET_API2_PORT"
        published: $WALLET_API2_PORT # wallet-api2
        protocol: tcp
        mode: host

      - target: "$WEB_PORTAL2_PORT"
        published: $WEB_PORTAL2_PORT # web-portal2
        protocol: tcp
        mode: host

      - target: "$WALLET_DEMO_COMPOSE_WEB_PORT"
        published: $WALLET_DEMO_COMPOSE_WEB_PORT # wallet-demo-compose-web
        protocol: tcp
        mode: host

      - target: "$VC_REPO_PORT"
        published: $VC_REPO_PORT # vc-repo
        protocol: tcp
        mode: host

      - target: "$PG_ADMIN_PORT"
        published: $PG_ADMIN_PORT # pg-admin
        protocol: tcp
        mode: host

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
volumes:
  wallet-api-db:
  vault_data:
  valkey_data:
