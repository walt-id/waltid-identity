# SonarCloud runs automatic analysis for this repository; this file carries the few settings that have to
# live in version control rather than in the project's server-side configuration.

# S5332 flags http:// URLs as insecure communication. The licence allow-list in build-logic is not
# communication: the strings are identifiers compared against the <licenses> URLs that dependency POMs
# literally declare, and many of those declare http. Rewriting them to https would stop them matching and
# would silently turn an allowed licence into a build failure, so the protocol has to stay as published.
sonar.issue.ignore.multicriteria=licenceallowlist
sonar.issue.ignore.multicriteria.licenceallowlist.ruleKey=kotlin:S5332
sonar.issue.ignore.multicriteria.licenceallowlist.resourceKey=**/gradle/licensee/LicenseePolicies.kt
