name: iOS build and test

on:
  workflow_dispatch:
    inputs:
      run-ios-simulator:
        description: 'Run Kotlin simulator tests'
        type: boolean
        default: true
      run-native:
        description: 'Run native Swift consumers'
        type: boolean
        default: true
      run-compose:
        description: 'Run Compose consumers'
        type: boolean
        default: true
      run-enterprise:
        description: 'Run Enterprise mobile tests'
        type: boolean
        default: true
      run-sdk-docs:
        description: 'Run macOS SDK docs and ABI checks'
        type: boolean
        default: true
  workflow_call:
    inputs:
      job_name_prefix:
        description: 'Caller job id, used to build the check job name (empty when run standalone).'
        type: string
        required: false
        default: ''
      run-ios-simulator:
        description: 'Run Kotlin iOS simulator compilation and tests'
        type: boolean
        required: false
        default: false
      run-native:
        description: 'Run native WalletCore / Xcode demo tests'
        type: boolean
        required: false
        default: false
      run-compose:
        description: 'Run Compose iOS demo tests'
        type: boolean
        required: false
        default: false
      run-sdk-docs:
        description: 'Run macOS SDK ABI checks and Swift documentation'
        type: boolean
        required: false
        default: false
      run-enterprise:
        description: 'Run Enterprise iOS mobile tests'
        type: boolean
        required: false
        default: false

env:
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=latest
  JOB_NAME_PREFIX: ${{ inputs.job_name_prefix != '' && format('{0} / ', inputs.job_name_prefix) || '' }}

jobs:
  ios-simulator-tests:
    if: ${{ inputs.run-ios-simulator }}
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@6cf69001d859d67687353466f1ad2fb006f574e0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          ref: ${{ github.head_ref || github.ref_name }}
          identity-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@c95b601fc5095d5668eb8c906af992d8e00ed513

      - name: Compile iOS targets and run Kotlin iOS simulator tests
        timeout-minutes: 40
        uses: ./waltid-identity/.github/actions/gradle-ios
        with:
          waltid-directory: 'waltid-identity'
          xcode-developer-dir: ${{ env.XCODE_DEVELOPER_DIR }}
          simulator-destination: ${{ env.IOS_SIMULATOR_DESTINATION }}
          run-compile-smoke: 'true'
          run-ios-simulator-tests: 'true'
          run-wallet-core-xcframework: 'false'
          run-native-demo-tests: 'false'
          run-compose-demo-tests: 'false'
          test-report-job-name: ${{ env.JOB_NAME_PREFIX }}ios-simulator-tests
          test-report-check-name: iOS Simulator Test Report
          test-result-artifact-name: ios-simulator-test-results

  wallet-core-framework:
    if: ${{ inputs.run-native || inputs.run-compose || inputs.run-enterprise || inputs.run-sdk-docs }}
    runs-on: macos-26
    timeout-minutes: 50
    outputs:
      checkout-refs: ${{ steps.revisions.outputs.refs }}
      artifact-name: wallet-core-release-${{ github.run_attempt }}
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@6cf69001d859d67687353466f1ad2fb006f574e0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          ref: ${{ github.head_ref || github.ref_name }}
          identity-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the resolved source revisions
        id: revisions
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          paths = {"unified": ".", "identity": "waltid-identity", "enterprise": "waltid-identity-enterprise", "enterprise_license": "waltid-identity-enterprise-license"}
          refs = {key: subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip() for key, path in paths.items()}
          print(json.dumps(refs, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("refs=" + json.dumps(refs) + "\n")
          PYTHON
      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@c95b601fc5095d5668eb8c906af992d8e00ed513
      - name: Select Xcode toolchain
        run: |
          test -d "$XCODE_DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$XCODE_DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Cache Kotlin Native dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-
      # Concurrent device/simulator links cause heavy swapping on the hosted runner.
      - name: Build the full release WalletCore
        timeout-minutes: 40
        working-directory: waltid-identity
        run: |
          exec python3 .github/scripts/mobile-ci/run-ios-phase.py \
            --output-dir "$RUNNER_TEMP/wallet-core-build" wallet-core-framework \
            ./gradlew :waltid-libraries:protocols:waltid-openid4vc-wallet-mobile:assembleWalletCoreReleaseXCFramework -PenableIosBuild=true --max-workers=1
      - name: Package the framework and its build identity
        working-directory: waltid-identity
        run: python3 .github/scripts/mobile-ci/wallet-core-artifact.py pack --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
      - name: Publish the full release framework
        uses: actions/upload-artifact@v4
        with:
          name: wallet-core-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wallet-core-artifact/
          if-no-files-found: error
          retention-days: 1
      - name: Retain failed framework build logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-core-framework-failure-logs
          path: |
            ${{ runner.temp }}/wallet-core-build/
          retention-days: 7

  wallet-core-consumer-tests:
    needs: wallet-core-framework
    if: ${{ inputs.run-native || inputs.run-compose }}
    runs-on: macos-26
    timeout-minutes: 110
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@6cf69001d859d67687353466f1ad2fb006f574e0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: ${{ needs.wallet-core-framework.outputs.checkout-refs }}

      - name: Restore the shared release framework
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.wallet-core-framework.outputs.artifact-name }}
          path: ${{ runner.temp }}/wallet-core-artifact
      - name: Verify the shared release framework
        working-directory: waltid-identity
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@c95b601fc5095d5668eb8c906af992d8e00ed513

      - name: Run selected WalletCore consumer tests
        # Main budgets 60 minutes for demos/providers; allow 40 more for the isolated bridge fixture and tests.
        timeout-minutes: 100
        uses: ./waltid-identity/.github/actions/gradle-ios
        with:
          waltid-directory: 'waltid-identity'
          xcode-developer-dir: ${{ env.XCODE_DEVELOPER_DIR }}
          simulator-destination: ${{ env.IOS_SIMULATOR_DESTINATION }}
          run-compile-smoke: 'false'
          run-ios-simulator-tests: 'false'
          run-wallet-core-xcframework: 'false'
          run-wallet-sdk-tests: 'true'
          wallet-core-artifact: ${{ runner.temp }}/wallet-core-artifact
          run-native-demo-tests: ${{ (inputs.run-native) && 'true' || 'false' }}
          run-native-identity-document-provider-checks: ${{ (inputs.run-native) && 'true' || 'false' }}
          run-compose-demo-tests: ${{ (inputs.run-compose) && 'true' || 'false' }}
          run-compose-identity-document-provider-checks: ${{ (inputs.run-compose) && 'true' || 'false' }}
          test-report-job-name: ${{ env.JOB_NAME_PREFIX }}wallet-core-consumer-tests
          test-report-check-name: WalletCore Consumer Test Report
          test-report-require-tests: ${{ (inputs.run-native) && 'true' || 'false' }}
          test-result-artifact-name: wallet-core-consumer-test-results

      # Outside the timed composite action so logs survive its deadline.
      - name: Retain failed WalletCore consumer logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-core-consumer-failure-logs
          path: |
            ios-ci-logs/**
          retention-days: 7

      - name: Retain incomplete WalletCore test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-core-incomplete-test-results
          path: |
            waltid-identity/waltid-applications/**/TestResults*
            waltid-identity/build/proximity-tests/**
          retention-days: 7

  enterprise-ios-mobile-tests:
    needs: wallet-core-framework
    timeout-minutes: 60
    if: ${{ inputs.run-enterprise }}
    runs-on: macos-26
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@6cf69001d859d67687353466f1ad2fb006f574e0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: ${{ needs.wallet-core-framework.outputs.checkout-refs }}

      - name: Restore the shared release framework
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.wallet-core-framework.outputs.artifact-name }}
          path: ${{ runner.temp }}/wallet-core-artifact
      - name: Verify the shared release framework
        working-directory: waltid-identity
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@c95b601fc5095d5668eb8c906af992d8e00ed513

      - name: Select Enterprise Xcode toolchain
        run: |
          test -d "$XCODE_DEVELOPER_DIR"
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$XCODE_DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Execute Enterprise iOS mobile platform tests
        id: enterprise_ios_mobile_tests
        continue-on-error: true
        timeout-minutes: 45
        run: |
          exec python3 waltid-identity/.github/scripts/mobile-ci/run-ios-phase.py \
            --output-dir "$GITHUB_WORKSPACE/ios-ci-logs" enterprise \
            ./gradlew :waltid-enterprise-integration-tests:enterpriseIosMobileIntegrationTest \
            --no-configuration-cache \
            -Penterprise.ios.destination="${IOS_SIMULATOR_DESTINATION}" \
            -Penterprise.ios.walletCoreArtifact="$RUNNER_TEMP/wallet-core-artifact"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Collect Enterprise iOS mobile test reports
        if: always() && steps.enterprise_ios_mobile_tests.outcome != 'skipped'
        id: enterprise_ios_test_report
        run: |
          REPORT_ROOT="waltid-identity-enterprise/waltid-enterprise-integration-tests/build/ios-test-reports"
          XCODE_REPORT_DIR="$REPORT_ROOT/xcresult"
          SOURCE_ROOT="waltid-identity-enterprise/waltid-enterprise-integration-tests/build/ios-test-results"

          rm -rf "$REPORT_ROOT"
          mkdir -p "$XCODE_REPORT_DIR"

          xcode_report_count=0
          while IFS= read -r -d '' bundle; do
            if ! command -v xcresultparser >/dev/null 2>&1; then
              brew install xcresultparser
            fi

            relative_bundle="${bundle#"$SOURCE_ROOT"/}"
            safe_name=$(printf '%s' "$relative_bundle" | tr '/ ' '__' | LC_ALL=C tr -c '[:alnum:]_.-' '_')
            report_file="$XCODE_REPORT_DIR/${xcode_report_count}-${safe_name}.xml"

            if xcresultparser "$bundle" --output-format=junit > "$report_file"; then
              echo "Converted Enterprise iOS xcresult bundle to JUnit: $relative_bundle"
              xcode_report_count=$((xcode_report_count + 1))
            else
              echo "::warning::Failed to convert Enterprise iOS xcresult bundle at $bundle"
              rm -f "$report_file"
            fi
          done < <(find "$SOURCE_ROOT" -name '*.xcresult' -prune -print0 2>/dev/null || true)

          {
            echo "## Enterprise iOS Mobile Test Report Collection"
            echo "- Xcode result bundles converted: $xcode_report_count"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( xcode_report_count == 0 )); then
            echo "::warning::No Enterprise iOS mobile test reports found under $SOURCE_ROOT"
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_report=true" >> "$GITHUB_OUTPUT"

      - name: Publish Enterprise iOS mobile test report
        if: always() && steps.enterprise_ios_test_report.outputs.has_report == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          update_check: true
          job_name: ${{ env.JOB_NAME_PREFIX }}enterprise-ios-mobile-tests
          check_name: Enterprise iOS Mobile Test Report
          report_paths: waltid-identity-enterprise/waltid-enterprise-integration-tests/build/ios-test-reports/**/*.xml
          detailed_summary: true
          include_passed: false
          include_skipped: false
          require_tests: true

      - name: Upload Enterprise iOS mobile test results
        if: always() && steps.enterprise_ios_mobile_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-ios-mobile-test-results
          path: |
            waltid-identity-enterprise/waltid-enterprise-integration-tests/build/ios-test-reports/**
            waltid-identity-enterprise/waltid-enterprise-integration-tests/build/ios-test-results/**
          retention-days: 7

      - name: Retain failed Enterprise iOS logs
        if: failure() || cancelled() || steps.enterprise_ios_mobile_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-ios-failure-logs
          path: |
            ios-ci-logs/**
          retention-days: 7

      - name: Require successful Enterprise iOS tests and reports
        if: always() && (steps.enterprise_ios_mobile_tests.outcome != 'success' || steps.enterprise_ios_test_report.outputs.has_report != 'true')
        run: |
          echo "::error::Enterprise iOS tests did not complete successfully with a test report"
          exit 1

  macos-sdk-docs:
    needs: wallet-core-framework
    if: ${{ inputs.run-sdk-docs }}
    uses: ./.github/workflows/mobile-sdk-docs.yml
    secrets: inherit
    with:
      generate-linux-docs: false
      generate-macos-docs: true
      checkout-refs: ${{ needs.wallet-core-framework.outputs.checkout-refs }}
      wallet-core-artifact: ${{ needs.wallet-core-framework.outputs.artifact-name }}
