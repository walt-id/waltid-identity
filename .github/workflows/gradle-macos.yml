name: iOS receipt diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  receipt-readiness:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: walt-id/waltid-identity/.github/actions/checkout-repos@cba255efcba637f429422c132ccaf46b13b9572b
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: '{"unified":"fe7ad3cfee01dc1107eaad6a7d8bc11b62ba500a","identity":"f29c02f65df43f3eb9cb2f6f5d400098f1e8598e","enterprise":"624927002d11740e91f2af96ab5028827ee6da91","enterprise_license":"89e50887a63586c021b4bb927e5c2c696c229ce1"}'
      - uses: actions/checkout@v6
        with:
          path: diagnostic-source
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wallet-core-release-1
          run-id: 41666422173
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wallet-core-artifact
      - name: Verify exact framework before adding metadata-only Swift probes
        working-directory: waltid-identity
        run: |
          python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
          components=waltid-applications/waltid-wallet-demo-shared-ios/Sources/WalletDemoSharingUI/Components
          cp "../diagnostic-source/$components/WalletSheetSizing.swift" "$components/WalletSheetSizing.swift"
          cp "../diagnostic-source/$components/WalletSheetReadinessTrace.swift" "$components/WalletSheetReadinessTrace.swift"
          mkdir -p "$GITHUB_WORKSPACE/diagnostic-evidence"
          git diff > "$GITHUB_WORKSPACE/diagnostic-evidence/metadata-probe.patch"
          cp "$RUNNER_TEMP/wallet-core-artifact/wallet-core.json" "$GITHUB_WORKSPACE/diagnostic-evidence/"
      - name: Reproduce receipt failure on the pinned CI toolchain
        working-directory: waltid-identity/waltid-applications/waltid-wallet-demo-ios/iosApp
        run: |
          evidence="$GITHUB_WORKSPACE/diagnostic-evidence"
          simulator=$(xcrun simctl create 'WAL1585 receipt diagnostics' 'iPhone 17' 'iOS 27.0')
          cleanup() {
            status=$?
            container=$(xcrun simctl get_app_container "$simulator" id.walt.wallet.native data 2>/dev/null) || container=''
            if [[ -n "$container" ]]; then
              find "$container/tmp" -name 'sheet-readiness-*.jsonl' -exec cp {} "$evidence/" \;
            fi
            xcrun simctl delete "$simulator" || true
            exit "$status"
          }
          trap cleanup EXIT
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild test -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" \
            -only-testing:iosAppUITests/MockWalletUITests/testCredentialImageOpensAndClosesFullScreenViewer \
            -test-iterations 8 -run-tests-until-failure -test-repetition-relaunch-enabled YES \
            -parallel-testing-enabled NO -enableCodeCoverage NO \
            -resultBundlePath "$evidence/TestResults.xcresult" \
            -derivedDataPath /tmp/xcode-derived \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES > "$evidence/native.log" 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: receipt-readiness-diagnostic-${{ github.run_attempt }}
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
