name: Enterprise iOS runtime diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  enterprise-runtime:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
    steps:
      - uses: walt-id/waltid-identity/.github/actions/checkout-repos@cba255efcba637f429422c132ccaf46b13b9572b
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: '{"unified":"fe7ad3cfee01dc1107eaad6a7d8bc11b62ba500a","identity":"debff4f32429b6628dae0f650633e712db956b3b","enterprise":"624927002d11740e91f2af96ab5028827ee6da91","enterprise_license":"89e50887a63586c021b4bb927e5c2c696c229ce1"}'
      - uses: actions/checkout@v6
        with:
          path: diagnostic-source
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/mobile-ci/enterprise-runtime-diagnostic.py
            .github/scripts/mobile-ci/run-enterprise-ios.sh
      - uses: actions/download-artifact@v8
        with:
          name: wallet-core-release-1
          run-id: 41716713428
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wallet-core-artifact
      - name: Verify original release framework and unchanged source
        working-directory: waltid-identity
        run: |
          python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
          mkdir -p "$GITHUB_WORKSPACE/diagnostic-evidence"
          cp "$RUNNER_TEMP/wallet-core-artifact/wallet-core.json" "$GITHUB_WORKSPACE/diagnostic-evidence/"
          git status --short
      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Run unchanged Enterprise tests with resource and JVM diagnostics
        timeout-minutes: 75
        run: |
          python3 diagnostic-source/.github/scripts/mobile-ci/enterprise-runtime-diagnostic.py -- \
            python3 waltid-identity/.github/scripts/mobile-ci/run-ios-phase.py \
            --output-dir "$GITHUB_WORKSPACE/ios-ci-logs" enterprise \
            bash diagnostic-source/.github/scripts/mobile-ci/run-enterprise-ios.sh \
            --no-build-cache \
            -Penterprise.ios.destination="${IOS_SIMULATOR_DESTINATION}" \
            -Penterprise.ios.collectTestDiagnostics=never \
            -Penterprise.ios.walletCoreArtifact="$RUNNER_TEMP/wallet-core-artifact"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-runtime-diagnostic-${{ github.run_attempt }}
          path: |
            diagnostic-evidence/**
            ios-ci-logs/**
            waltid-identity-enterprise/waltid-enterprise-integration-tests/build/ios-test-results/**
          if-no-files-found: error
          retention-days: 7
