name: WAL1585 native ownership evidence (temporary)
run-name: WAL1585 one native trace with required installation checks

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Exact single-use human authorization recorded in the private scope ledger
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: wal1585-native-ownership-20261028
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  WAL1585_AUTHORIZATION: ${{ inputs.authorization }}
  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

jobs:
  bounded-repair:
    name: native-ownership
    if: ${{ inputs.authorization == 'native-ownership-20261028' && github.run_attempt == 1 }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout the exact failed source tuple
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@cba255efcba637f429422c132ccaf46b13b9572b
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: >-
            {"unified":"1fef89185ad62339246905d88c45cbcac37341e6","identity":"c52f1778b6e88487f0be0864afde7edb00b224cf","enterprise":"b7501c0c568f351d383f4bf8d7a83e4f820682ba","enterprise_license":"89e50887a63586c021b4bb927e5c2c696c229ce1"}
      - name: Checkout isolated diagnostic harness
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: probe-harness
          persist-credentials: false
      - name: Download the exact retained release payload
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 12745935414
          run-id: 40503413203
          github-token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          path: ${{ runner.temp }}/wallet-core-artifact
          merge-multiple: true
      - name: Restore and verify all release payload files
        working-directory: waltid-identity
        run: python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
      - name: Configure Gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Configure the owning iOS build environment
        uses: ./waltid-identity/.github/actions/ios-build-setup
        with:
          gradle-properties-path: waltid-identity/gradle.properties
      - name: Execute the authorized scope exactly once
        run: python3 probe-harness/.github/scripts/mobile-ci/wal1585-bounded/run.py native
      - name: Retain finalized evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wal1585-native-ownership-20261028
          path: bounded-repair-evidence/native/
          if-no-files-found: error
          retention-days: 7
