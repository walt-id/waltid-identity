name: Native scanner height replacement (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0

jobs:
  sheet-height-control:
    runs-on: xcode-27
    timeout-minutes: 110
    steps:
      - name: Checkout the observed failing tuple
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@cba255efcba637f429422c132ccaf46b13b9572b
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: >-
            {"unified":"1fef89185ad62339246905d88c45cbcac37341e6","identity":"f31cefc90594e99e30097de804a709b4b674291b","enterprise":"024fbb2cc3e4a1dd14f61699b81f9ccecfc5ccc5","enterprise_license":"78972ba6237a00e3e867c0a74192e161128375f7"}
      - name: Checkout temporary control source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: probe-harness
          persist-credentials: false
      - name: Record the single-factor control source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sheet-height-control"
          patch="$GITHUB_WORKSPACE/probe-harness/.github/scripts/mobile-ci/temporary-sheet-height-control.patch"
          shasum -a 256 "$patch" > "$GITHUB_WORKSPACE/sheet-height-control/patch-sha256.txt"
          xcodebuild -version > "$GITHUB_WORKSPACE/sheet-height-control/xcode-version.txt"
          xcrun simctl list runtimes --json > "$GITHUB_WORKSPACE/sheet-height-control/runtimes.json"
          python3 - <<'REVISIONS'
          import json, os, subprocess
          from pathlib import Path
          paths = {"unified": ".", "identity": "waltid-identity", "enterprise": "waltid-identity-enterprise", "enterprise_license": "waltid-identity-enterprise-license"}
          expected = {"unified": "1fef89185ad62339246905d88c45cbcac37341e6", "identity": "f31cefc90594e99e30097de804a709b4b674291b", "enterprise": "024fbb2cc3e4a1dd14f61699b81f9ccecfc5ccc5", "enterprise_license": "78972ba6237a00e3e867c0a74192e161128375f7"}
          actual = {key: subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip() for key, path in paths.items()}
          (Path(os.environ["GITHUB_WORKSPACE"]) / "sheet-height-control/checkout-revisions.json").write_text(json.dumps(actual, indent=2) + "\n")
          assert actual == expected, actual
          REVISIONS
      - name: Configure Gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Configure the owning iOS build environment
        uses: ./waltid-identity/.github/actions/ios-build-setup
        with:
          gradle-properties-path: waltid-identity/gradle.properties
      # Proposed prerequisite replacement: a fresh build of the same pinned source tuple.
      # This is not byte-identical provenance to the expired original artifact.
      - name: Build the pinned full release WalletCore
        timeout-minutes: 60
        working-directory: waltid-identity
        run: |
          exec python3 .github/scripts/mobile-ci/run-ios-phase.py \
            --output-dir "$GITHUB_WORKSPACE/sheet-height-control/framework-build" wallet-core-framework \
            ./gradlew :waltid-libraries:protocols:waltid-openid4vc-wallet-mobile:assembleWalletCoreReleaseXCFramework -PenableIosBuild=true --max-workers=1
      - name: Package and verify the rebuilt framework
        working-directory: waltid-identity
        run: |
          python3 .github/scripts/mobile-ci/wallet-core-artifact.py pack --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
          python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
          cp "$RUNNER_TEMP/wallet-core-artifact/wallet-core.json" "$GITHUB_WORKSPACE/sheet-height-control/rebuilt-framework-manifest.json"
      - name: Run the normal provider prerequisite
        run: |
          exec python3 waltid-identity/.github/scripts/mobile-ci/run-ios-phase.py \
            --output-dir "$GITHUB_WORKSPACE/sheet-height-control" provider \
            waltid-identity/.github/scripts/mobile-ci/verify-ios-identity-document-provider.sh \
            --project-dir waltid-identity/waltid-applications/waltid-wallet-demo-ios/iosApp \
            --destination "$IOS_SIMULATOR_DESTINATION" --derived-data /tmp/xcode-provider-derived \
            --app-group group.id.walt.wallet.native --keychain-group-suffix id.walt.wallet.native.shared \
            --app-bundle-id id.walt.wallet.native --appex-bundle-id id.walt.wallet.native.identitydocumentprovider \
            --development-team 9BB78CFW7Y --build-setting OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
      - name: Validate both setup variants and run the bounded height replacement
        timeout-minutes: 90
        run: |
          exec python3 "$GITHUB_WORKSPACE/waltid-identity/.github/scripts/mobile-ci/run-ios-phase.py" \
            --output-dir "$GITHUB_WORKSPACE/sheet-height-control" sheet-height-control \
            python3 - <<'CONTROL'
          from pathlib import Path
          import hashlib, json, os, signal, subprocess, sys

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          repo = workspace / 'waltid-identity'
          project = repo / 'waltid-applications/waltid-wallet-demo-ios/iosApp'
          out = workspace / 'sheet-height-control'
          sources = ['waltid-applications/waltid-wallet-demo-shared-ios/Sources/WalletDemoSharingUI/Components/WalletSheetSizing.swift', 'waltid-applications/waltid-wallet-demo-ios/iosApp/iosApp/Views/WalletScanView.swift']
          patch = workspace / 'probe-harness/.github/scripts/mobile-ci/temporary-sheet-height-control.patch'
          expected = {'original': {'waltid-applications/waltid-wallet-demo-shared-ios/Sources/WalletDemoSharingUI/Components/WalletSheetSizing.swift': '37860d541755f6ee379a7bf79a6e2ee97ae4a29b8b3dd9b14fdad3e77a056bde', 'waltid-applications/waltid-wallet-demo-ios/iosApp/iosApp/Views/WalletScanView.swift': '957a2e0a42543980743555ed3e9b45e0e2a5b01f3822b687b731beae048f8eda'}, 'control': {'waltid-applications/waltid-wallet-demo-shared-ios/Sources/WalletDemoSharingUI/Components/WalletSheetSizing.swift': '4b1e64c6e2b02fa74498f4cfaf6a9a04f9314e7a3cf34cdc4021af88637c9ec0', 'waltid-applications/waltid-wallet-demo-ios/iosApp/iosApp/Views/WalletScanView.swift': '5156a0f2ea908b3a8cd8119f4ef418d5fc4ad58ad36b3ae315da8037d379c2ba'}}
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '1ddf6c7e16f87ad95c60f6d63ef30d13eebfe20d517a9b3d2995380cf7f1925c'
          method = 'MockWalletUITests/testScanReceiveDetailsAndShareUsesMockWallet()'
          selection = 'iosAppUITests/MockWalletUITests/testScanReceiveDetailsAndShareUsesMockWallet'
          def interrupted(signum, frame):
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)

          rows = []
          overall = 0

          def run(args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)

          def nodes(value):
              if isinstance(value, dict):
                  if value.get('nodeType') == 'Test Case':
                      yield value
                  for child in value.values():
                      yield from nodes(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from nodes(child)

          # Compile both variants on the owning toolchain before spending any runtime arm.
          # These are build-for-testing actions, not extra test executions.
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          assert version.splitlines()[0] == 'Xcode 27.0', version
          setup_rows = []
          for arm in ['original', 'control']:
              destination = out / ('preflight-' + arm)
              destination.mkdir()
              patched = False
              try:
                  assert {path: hashlib.sha256((repo / path).read_bytes()).hexdigest() for path in sources} == expected['original']
                  if arm == 'control':
                      run(['git', 'apply', '--check', str(patch)], cwd=repo)
                      run(['git', 'apply', str(patch)], cwd=repo)
                      patched = True
                  actual = {path: hashlib.sha256((repo / path).read_bytes()).hexdigest() for path in sources}
                  assert actual == expected[arm]
                  (destination / 'applied.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', *sources], cwd=repo))
                  command = ['xcodebuild', 'build-for-testing', '-project', 'iosApp.xcodeproj',
                             '-scheme', 'iosApp', '-configuration', 'Debug',
                             '-destination', os.environ['IOS_SIMULATOR_DESTINATION'],
                             '-only-testing:' + selection, '-parallel-testing-enabled', 'NO',
                             '-enableCodeCoverage', 'NO', '-resultBundlePath', str(destination / 'BuildResults.xcresult'),
                             '-derivedDataPath', '/tmp/xcode-derived', 'OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES']
                  (destination / 'input.json').write_text(json.dumps({'arm': arm, 'sourceSha256': actual, 'command': command, 'xcodeVersion': version}, indent=2) + '\n')
                  execution = subprocess.run(command, cwd=project)
                  (destination / 'exit-code.txt').write_text(str(execution.returncode) + '\n')
                  setup_rows.append({'arm': arm, 'exitCode': execution.returncode, 'sourceSha256': actual, 'runtimeTests': 0})
                  (out / 'setup-builds.json').write_text(json.dumps(setup_rows, indent=2) + '\n')
                  if execution.returncode:
                      (out / 'stop-reason.txt').write_text('Owning-toolchain setup build failed; no runtime arms were started.\n')
                      raise SystemExit(execution.returncode)
              finally:
                  if patched:
                      run(['git', 'apply', '-R', '--check', str(patch)], cwd=repo)
                      run(['git', 'apply', '-R', str(patch)], cwd=repo)
                  assert {path: hashlib.sha256((repo / path).read_bytes()).hexdigest() for path in sources} == expected['original']
          assert len(setup_rows) == 2 and all(row['exitCode'] == 0 for row in setup_rows)
          (out / 'setup-validated.json').write_text(json.dumps({'xcodeVersion': version, 'arms': setup_rows, 'runtimeTests': 0}, indent=2) + '\n')

          for label, arm in [('A1', 'original'), ('B1', 'control'), ('A2', 'original'), ('B2', 'control'), ('A3', 'original')]:
              destination = out / label
              destination.mkdir()
              patched = False
              simulator = None
              try:
                  assert {path: hashlib.sha256((repo / path).read_bytes()).hexdigest() for path in sources} == expected['original']
                  if arm == 'control':
                      run(['git', 'apply', '--check', str(patch)], cwd=repo)
                      run(['git', 'apply', str(patch)], cwd=repo)
                      patched = True
                  actual = {path: hashlib.sha256((repo / path).read_bytes()).hexdigest() for path in sources}
                  assert actual == expected[arm]
                  (destination / 'applied.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', *sources], cwd=repo))
                  simulator = subprocess.check_output(['xcrun', 'simctl', 'create', 'WAL1585 sheet height ' + label, 'iPhone 17', 'iOS 27.0'], text=True).strip()
                  run(['xcrun', 'simctl', 'bootstatus', simulator, '-b'])
                  bundle = destination / 'TestResults.xcresult'
                  command = ['xcodebuild', 'test', '-collect-test-diagnostics', 'never',
                             '-project', 'iosApp.xcodeproj', '-scheme', 'iosApp', '-configuration', 'Debug',
                             '-destination', 'platform=iOS Simulator,id=' + simulator,
                             '-only-testing:' + selection, '-parallel-testing-enabled', 'NO',
                             '-enableCodeCoverage', 'NO', '-resultBundlePath', str(bundle),
                             '-derivedDataPath', '/tmp/xcode-derived', 'OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES']
                  (destination / 'input.json').write_text(json.dumps({'arm': arm, 'sourceSha256': actual, 'simulator': simulator, 'command': command}, indent=2) + '\n')
                  print('BEGIN ' + label + ' ' + arm, flush=True)
                  execution = subprocess.run(command, cwd=project)
                  (destination / 'exit-code.txt').write_text(str(execution.returncode) + '\n')
                  for kind in ['summary', 'tests']:
                      report = subprocess.check_output(['xcrun', 'xcresulttool', 'get', 'test-results', kind, '--path', str(bundle)])
                      (destination / ('test-' + kind + '.json')).write_bytes(report)
                  summary = json.loads((destination / 'test-summary.json').read_text())
                  cases = list(nodes(json.loads((destination / 'test-tests.json').read_text())))
                  assert len(cases) == 1 and cases[0]['nodeIdentifier'] == method, cases
                  assert summary['totalTestCount'] == 1 and summary['skippedTests'] == 0, summary
                  assert cases[0]['result'] in ['Passed', 'Failed'], cases
                  assert (execution.returncode == 0) == (cases[0]['result'] == 'Passed'), (execution.returncode, cases)
                  row = {'label': label, 'arm': arm, 'exitCode': execution.returncode, 'case': cases[0], 'devices': summary['devicesAndConfigurations']}
                  rows.append(row)
                  (out / 'completed-arms.json').write_text(json.dumps(rows, indent=2) + '\n')
                  print('END ' + label + ' ' + json.dumps(row), flush=True)
                  if execution.returncode:
                      overall = execution.returncode
                      if arm == 'control':
                          (out / 'stop-reason.txt').write_text('Control failed; stop this hypothesis and inspect the retained result.\n')
                          break
              finally:
                  try:
                      if simulator:
                          run(['xcrun', 'simctl', 'delete', simulator])
                          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '--json']))
                          assert not any(device['udid'] == simulator for group in devices['devices'].values() for device in group), simulator
                          (destination / 'simulator-deleted.json').write_text(json.dumps({'udid': simulator, 'absentAfterDeletion': True}) + '\n')
                  finally:
                      if patched:
                          run(['git', 'apply', '-R', '--check', str(patch)], cwd=repo)
                          run(['git', 'apply', '-R', str(patch)], cwd=repo)
                      assert {path: hashlib.sha256((repo / path).read_bytes()).hexdigest() for path in sources} == expected['original']

          if len(rows) == 5 and all(row['case']['result'] == 'Passed' for row in rows if row['arm'] == 'original'):
              (out / 'stop-reason.txt').write_text('Baseline did not reproduce in the fixed batch; inconclusive. No extra repetitions.\n')
          (out / 'batch-completion.json').write_text(json.dumps({'planned': 5, 'completed': len(rows), 'exitCode': overall, 'observerApplied': False}, indent=2) + '\n')
          sys.exit(overall)
          CONTROL
      - name: Retain control results on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-sheet-height-control
          path: sheet-height-control/**
          if-no-files-found: error
          retention-days: 7
