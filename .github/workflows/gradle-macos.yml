name: Native repeated scan journey observation (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0

jobs:
  animation-observation:
    runs-on: xcode-27
    timeout-minutes: 110
    steps:
      - name: Checkout the observed failing tuple
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@cba255efcba637f429422c132ccaf46b13b9572b
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: >-
            {"unified":"1fef89185ad62339246905d88c45cbcac37341e6","identity":"f31cefc90594e99e30097de804a709b4b674291b","enterprise":"024fbb2cc3e4a1dd14f61699b81f9ccecfc5ccc5","enterprise_license":"78972ba6237a00e3e867c0a74192e161128375f7"}
      - name: Restore the failing run's shared release framework
        uses: actions/download-artifact@v8
        with:
          name: wallet-core-release-1
          run-id: 40162930961
          github-token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          path: ${{ runner.temp }}/wallet-core-artifact
      - name: Verify the shared release framework before observation
        working-directory: waltid-identity
        run: python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
      - name: Checkout temporary observation source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: probe-harness
          persist-credentials: false
      - name: Apply only the bounded observation
        working-directory: waltid-identity
        run: |
          mkdir -p "$GITHUB_WORKSPACE/animation-observation"
          patch="$GITHUB_WORKSPACE/probe-harness/.github/scripts/mobile-ci/temporary-animation-observation.patch"
          shasum -a 256 "$patch" > "$GITHUB_WORKSPACE/animation-observation/patch-sha256.txt"
          git apply --check "$patch"
          git apply "$patch"
          git diff > "$GITHUB_WORKSPACE/animation-observation/applied.patch"
      - name: Retain the actual animation notifier implementation
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, os, subprocess
          binary = Path(os.environ['DEVELOPER_DIR']) / 'Platforms/iPhoneSimulator.platform/Developer/Library/PrivateFrameworks/XCTAutomationSupport.framework/XCTAutomationSupport'
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'animation-observation'
          disassembly = subprocess.check_output(['xcrun', 'otool', '-arch', 'arm64', '-tvV', str(binary)], text=True)
          start = disassembly.find('+[XCTAnimationsIdleNotifier initialize]:')
          end = disassembly.find('-[XCTMainRunLoopIdleNotifier init]:', max(start, 0))
          (out / 'XCTAnimationsIdleNotifier.disassembly.txt').write_text(disassembly[start:end] if start >= 0 and end > start else disassembly)
          metadata = {'binary': str(binary), 'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True)}
          (out / 'notifier-binary.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYCODE
      - name: Configure Gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Configure the owning iOS build environment
        uses: ./waltid-identity/.github/actions/ios-build-setup
        with:
          gradle-properties-path: waltid-identity/gradle.properties
      - name: Run the normal provider prerequisite
        run: |
          exec python3 waltid-identity/.github/scripts/mobile-ci/run-ios-phase.py \
            --output-dir "$GITHUB_WORKSPACE/animation-observation" provider \
            waltid-identity/.github/scripts/mobile-ci/verify-ios-identity-document-provider.sh \
            --project-dir waltid-identity/waltid-applications/waltid-wallet-demo-ios/iosApp \
            --destination "$IOS_SIMULATOR_DESTINATION" --derived-data /tmp/xcode-derived \
            --app-group group.id.walt.wallet.native --keychain-group-suffix id.walt.wallet.native.shared \
            --app-bundle-id id.walt.wallet.native --appex-bundle-id id.walt.wallet.native.identitydocumentprovider \
            --development-team 9BB78CFW7Y --build-setting OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
      - name: Observe callback pairing in the previously failing scan journey
        timeout-minutes: 90
        working-directory: waltid-identity/waltid-applications/waltid-wallet-demo-ios/iosApp
        run: |
          exec python3 "$GITHUB_WORKSPACE/waltid-identity/.github/scripts/mobile-ci/run-ios-phase.py" \
            --output-dir "$GITHUB_WORKSPACE/animation-observation" native-observation \
            bash -e -o pipefail <<'TESTS'
          simulator=$(xcrun simctl create 'WAL1585 animation callback observation' 'iPhone 17' 'iOS 27.0')
          cleanup() {
            result=$?
            xcrun simctl delete "$simulator" || { cleanup_result=$?; (( result != 0 )) || result=$cleanup_result; }
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild test -collect-test-diagnostics never \
            -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" \
            -only-testing:iosAppUITests/MockWalletUITests/testScanReceiveDetailsAndShareUsesMockWallet \
            -test-iterations 5 -run-tests-until-failure \
            -parallel-testing-enabled NO -enableCodeCoverage NO \
            -resultBundlePath "$GITHUB_WORKSPACE/animation-observation/TestResults.xcresult" \
            -derivedDataPath /tmp/xcode-derived OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
          TESTS
      - name: Retain observation on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-animation-observation
          path: animation-observation/**
          if-no-files-found: error
          retention-days: 7
