name: Credential scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Blocks cloud credentials from entering the repository. An AWS access key ID was committed in
# October 2024 (waltid-crypto AWSKey.kt, plus Enterprise Postman datasets) and later removed - this
# check exists so that it cannot happen again unnoticed.
#
# Patterns are limited to shapes that only real credentials have. Generic checks (private key PEM
# blocks, `clientSecret = "..."`) are intentionally omitted: the repository legitimately tracks 46
# PEM test fixtures and local development configuration, so those would only produce noise.
jobs:
  tracked-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout waltid-identity
        uses: actions/checkout@v4

      - name: Scan tracked files for cloud credentials
        shell: bash
        run: |
          set -uo pipefail
          status=0

          scan() {
            local description="$1" pattern="$2"
            local matches
            # This workflow documents the patterns, so it is excluded from its own scan.
            # (Note: the repository .gitignore ignores paths starting with "secret", hence this name.)
            matches=$(git grep -nIE -e "$pattern" -- . ':(exclude).github/workflows/credential-scan.yml' || true)
            if [ -n "$matches" ]; then
              echo "::error::$description found in tracked files:"
              echo "$matches"
              status=1
            fi
          }

          # AWS access key IDs: fixed prefix followed by exactly 16 uppercase alphanumerics.
          scan "AWS access key ID" 'A(KIA|SIA|GPA|IDA|ROA|IPA|NPA|NVA)[0-9A-Z]{16}'
          # AWS secret access keys are exactly 40 base64 characters.
          scan "AWS secret access key" '(secretAccessKey|aws_secret_access_key)[[:space:]]*[=:][[:space:]]*"?[A-Za-z0-9/+=]{40}"?'

          if [ "$status" -ne 0 ]; then
            echo "::error::Remove the credential material and rotate the exposed secret."
            exit 1
          fi
          echo "No cloud credentials found in tracked files."
