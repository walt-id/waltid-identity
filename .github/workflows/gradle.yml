name: Build gradle and/or publish (reusable workflow)

on:
  workflow_call:
    inputs:
      version:
        description: "release version"
        required: false
        type: string
      checkout-refs:
        description: "Exact commits to check out, as a JSON object of unified, identity, enterprise and enterprise_license SHAs (defaults to the branch with main fallback)"
        required: false
        type: string
        default: ''
      publish:
        description: "Specifies whether to publish the artifacts (defaults to false)"
        required: false
        type: boolean
        default: false
      report-check-name:
        description: "Visible GitHub check run name to update with the JUnit report"
        required: true
        type: string
      enable-android-build:
        description: "Enable Android targets during the Gradle build"
        required: false
        type: boolean
        default: false
      run-payment-demo:
        description: "Require deployed SD-JWT payment issuance and presentation acceptance"
        required: false
        type: boolean
        default: false
      run-conformance:
        description: "Run the live OpenID4VP and OpenID4VCI conformance suites"
        required: false
        type: boolean
        default: false
      run-issuer-conformance:
        description: "Run the OpenID4VCI Issuer2 conformance matrix"
        required: false
        type: boolean
        default: false
      run-haip-conformance:
        description: "Run the OpenID4VCI HAIP Issuer2 conformance matrix"
        required: false
        type: boolean
        default: false
      cacheless:
        description: "Run a clean, cache-defeating Gradle rebuild"
        required: false
        type: boolean
        default: false
      conformance-report-check-name:
        description: "Retained for existing callers. Verifier and wallet roles publish their own JUnit checks."
        required: false
        type: string
        default: "wallet/verifier-conformance"
      upload-test-results:
        description: "Upload the JUnit XML results as artifacts (for the enterprise release evidence bundle)"
        required: false
        type: boolean
        default: false

jobs:
  gradle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # KLOGGING_MIN_* only affect Klogging internals / delivery path. Application TRACE comes
      # from test klogging.conf; this file is loaded first and keeps CI at INFO+.
      KLOGGING_CONFIG_PATH: ${{ github.workspace }}/waltid-identity/.github/ci/klogging.conf
      JUNIT_TIMEOUT_DEFAULT: 10m
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          resolved-refs: ${{ inputs.checkout-refs }}

      - name: Verify CI klogging config
        run: test -f "$KLOGGING_CONFIG_PATH"

      - name: Configure gradle
        id: gradle-setup
        uses: ./waltid-identity/.github/actions/gradle-setup-action
        with:
          # Feeds Dependabot alerts, which Renovate reads for security updates. Restricted to pushes
          # to main because alerts only consume the default-branch snapshot; submitting per PR just
          # adds annotations and dependency-graph_*.json artifacts.
          dependency-graph: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'generate-and-submit' || 'disabled' }}

      - name: Check default Kotlin configuration
        run: |
          # Mobile-enabled builds can hide modules included without any Kotlin targets.
          for project_dir in . waltid-identity; do
            ./gradlew -p "$project_dir" checkKotlinGradlePluginConfigurationErrors \
              -PenableAndroidBuild=false -PenableIosBuild=false -PenableWalletDemoComposeWeb=false \
              --no-configuration-cache --console=plain
          done

      - name: Install SoftHSM for PKCS11 tests
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2

      - name: Enable Android build
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'waltid-identity/gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable Android build in unified-build root
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Write Google services config
        if: ${{ inputs.enable-android-build }}
        env:
          GOOGLE_SERVICES_PREVIEW_JSON: ${{ secrets.GOOGLE_SERVICES_PREVIEW_JSON }}
          GOOGLE_SERVICES_PRODUCTION_JSON: ${{ secrets.GOOGLE_SERVICES_PRODUCTION_JSON }}
        run: bash waltid-identity/.github/scripts/mobile-ci/write-google-services.sh

      # `playwright install --with-deps` shells out to apt-get, and three modules register an
      # installPlaywrightBrowsers task that the build runs in parallel. They then race for
      # /var/lib/dpkg/lock-frontend and whichever loses fails with "Failed to install browsers".
      # Installing once, serially, keeps the same dep-install mechanism while taking apt out of the
      # parallel phase; the browsers land in ~/.cache/ms-playwright, so the tasks in the build below
      # find them already present and become no-ops with --with-deps switched off.
      - name: Install Playwright browsers and system dependencies once
        run: ./gradlew :waltid-services:waltid-issuer-api2:installPlaywrightBrowsers --no-daemon --console=plain
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"

      - name: Record runner memory before Gradle
        if: always()
        run: |
          {
            echo "## Runner memory before Gradle"
            echo '```'
            free -h || true
            swapon --show || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and test
        if: ${{ !inputs.cacheless }}
        run: |
          set -o pipefail
          ./gradlew build allTests -PskipLiveConformance=true --continue --console=plain --warning-mode=summary | tee "$RUNNER_TEMP/gradle-build.log"
        env:
          CI: "true"
          SKIP_LIVE_CONFORMANCE: "true"
          # Already installed serially above; leaving this on would reintroduce the dpkg race.
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Clean and build with all tests
        if: ${{ inputs.cacheless }}
        run: |
          set -o pipefail
          ./gradlew clean cleanAllTests build allTests -PskipLiveConformance=true --rerun-tasks --no-daemon --continue --console=plain --warning-mode=summary | tee "$RUNNER_TEMP/gradle-build.log"
        env:
          CI: "true"
          SKIP_LIVE_CONFORMANCE: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Require public SD-JWT payment acceptance
        if: ${{ !cancelled() && inputs.run-payment-demo && steps.gradle-setup.outcome == 'success' }}
        timeout-minutes: 20
        run: >-
          ./gradlew :waltid-services:waltid-issuer-api2:paymentDemoTest
          --max-workers=2 --console=plain
        env:
          CI: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Summarize Gradle task outcomes and memory
        if: always()
        run: |
          {
            echo "## Gradle task outcomes"
            log="$RUNNER_TEMP/gradle-build.log"
            if [ -f "$log" ]; then
              echo "- UP-TO-DATE: $(grep -c ' UP-TO-DATE$' "$log" || true)"
              echo "- FROM-CACHE: $(grep -c ' FROM-CACHE$' "$log" || true)"
              echo "- SKIPPED: $(grep -c ' SKIPPED$' "$log" || true)"
              echo "- NO-SOURCE: $(grep -c ' NO-SOURCE$' "$log" || true)"
              echo "- task lines: $(grep -cE '^> Task ' "$log" || true)"
            else
              echo "_No Gradle log was captured._"
            fi
            echo
            echo "## Runner memory after Gradle"
            echo '```'
            free -h || true
            swapon --show || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require portable JVM and JS test results
        if: always()
        run: |
          python3 waltid-identity/.github/scripts/mobile-ci/verify_platform_test_results.py --platform jvm
          python3 waltid-identity/.github/scripts/mobile-ci/verify_platform_test_results.py --platform js-node

      - name: Require portable Android host test results
        if: ${{ always() && inputs.enable-android-build }}
        run: python3 waltid-identity/.github/scripts/mobile-ci/verify_platform_test_results.py --platform android-host

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          update_check: true
          job_name: ${{ inputs.report-check-name }}
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

      - name: Upload test results
        if: ${{ always() && inputs.upload-test-results }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-gradle
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
          retention-days: 90

  # Verifier, OpenID4VP wallet and OpenID4VCI wallet each own a runner, tunnel and test
  # filter. fail-fast is off so one role cannot cancel the others. Issuer proofs stay separate.
  wallet-conformance:
    name: ${{ matrix.role }}-conformance
    if: ${{ inputs.run-conformance || inputs.run-issuer-conformance || inputs.run-haip-conformance }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: verifier
            port: 7003
            report_dir: vp-verifier
            title: OpenID4VP Verifier
            tests: id.walt.openid4vp.conformance.ConformanceTests
            extra_tests: id.walt.openid4vp.conformance.VerifierConformanceTests
          - role: vp-wallet
            port: 7006
            report_dir: vp-wallet
            title: OpenID4VP Wallet
            tests: id.walt.openid4vp.conformance.VpWalletConformanceTests
            extra_tests: ""
          - role: vci-wallet
            port: 7007
            report_dir: vci-wallet
            title: OpenID4VCI Wallet
            tests: id.walt.openid4vp.conformance.VciWalletConformanceTests
            extra_tests: ""
    env:
      KLOGGING_CONFIG_PATH: ${{ github.workspace }}/waltid-identity/.github/ci/klogging.conf
      ROLE: ${{ matrix.role }}
      ROLE_PORT: ${{ matrix.port }}
      ROLE_REPORT_DIR: ${{ matrix.report_dir }}
      ROLE_TITLE: ${{ matrix.title }}
      ROLE_TESTS: ${{ matrix.tests }}
      ROLE_EXTRA_TESTS: ${{ matrix.extra_tests }}
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          resolved-refs: ${{ inputs.checkout-refs }}

      - name: Verify CI klogging config
        run: test -f "$KLOGGING_CONFIG_PATH"

      - name: Configure gradle
        id: conformance-gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Start role tunnel
        id: tunnel
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
        run: |
          set -euo pipefail
          wget -q -O cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x cloudflared
          log="$RUNNER_TEMP/lt_role.txt"
          ./cloudflared tunnel --url "http://localhost:${ROLE_PORT}" > "$log" 2>&1 &
          pid=$!
          echo "$pid" > "$RUNNER_TEMP/lt_role.pid"
          url=""
          for i in $(seq 1 60); do
            url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$log" | head -n 1 || true)
            [ -n "$url" ] && break
            kill -0 "$pid" 2>/dev/null || { echo "::error::${ROLE} cloudflared exited before printing a URL"; cat "$log"; exit 1; }
            sleep 1
          done
          if [ -z "$url" ]; then
            echo "::error::Failed to get ${ROLE} tunnel URL after ${i}s"
            cat "$log"
            exit 1
          fi
          echo "${ROLE} tunnel: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Point verifier tests at the tunnel
        id: verifier-url
        if: ${{ matrix.role == 'verifier' && steps.tunnel.outputs.url != '' }}
        run: |
          FILE="./waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/kotlin/id/walt/openid4vp/conformance/ConformanceTests.kt"
          sed -i \
            -e "s#https://verifier2.localhost/verification-session#${{ steps.tunnel.outputs.url }}/verification-session#g" \
            -e "s#localhost.emobix.co.uk#conformance.waltid.cloud#g" \
            -e "s#8443#443#g" \
            "$FILE"

      # `playwright install --with-deps` shells out to apt-get, and three modules register an
      # installPlaywrightBrowsers task that the build runs in parallel. They then race for
      # /var/lib/dpkg/lock-frontend and whichever loses fails with "Failed to install browsers".
      # Installing once, serially, keeps the same dep-install mechanism while taking apt out of the
      # parallel phase; the browsers land in ~/.cache/ms-playwright, so the tasks in the build below
      # find them already present and become no-ops with --with-deps switched off.
      - name: Install Playwright browsers and system dependencies once
        id: conformance-browsers
        run: ./gradlew :waltid-services:waltid-issuer-api2:installPlaywrightBrowsers --no-daemon --console=plain
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Run role conformance tests
        id: conformance-tests
        if: ${{ !cancelled() && steps.conformance-gradle.outcome == 'success' && steps.conformance-browsers.outcome == 'success' && steps.tunnel.outcome == 'success' && (matrix.role != 'verifier' || steps.verifier-url.outcome == 'success') }}
        env:
          CI: "true"
          CACHELESS: ${{ inputs.cacheless }}
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          CONFORMANCE_HOST: conformance.waltid.cloud
          CONFORMANCE_PORT: "443"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          SKIP_LIVE_CONFORMANCE: "false"
          PLAYWRIGHT_BROWSER: chromium
          PLAYWRIGHT_HEADLESS: "true"
        run: |
          set -euo pipefail
          unset OPENID4VCI_CONFORMANCE_CREDENTIAL_ISSUER_URL
          case "$ROLE" in
            verifier)
              echo "Running OpenID4VP verifier conformance."
              ;;
            vp-wallet)
              export CONFORMANCE_VP_WALLET_ADAPTER_URL="${TUNNEL_URL}/openid4vp/authorize"
              echo "Running OpenID4VP wallet conformance."
              ;;
            vci-wallet)
              export CONFORMANCE_VCI_WALLET_ADAPTER_BASE_URL="$TUNNEL_URL"
              echo "Running OpenID4VCI wallet conformance."
              ;;
            *)
              echo "::error::Unknown conformance role: $ROLE"
              exit 1
              ;;
          esac
          gradle_args=(--continue --console=plain --warning-mode=summary --no-configuration-cache -PskipLiveConformance=false)
          if [ "$CACHELESS" = "true" ]; then
            gradle_args+=(--rerun-tasks --no-daemon)
          fi
          test_args=(--tests "$ROLE_TESTS")
          if [ -n "${ROLE_EXTRA_TESTS:-}" ]; then
            test_args+=(--tests "$ROLE_EXTRA_TESTS")
          fi
          # Rerun live tests, not every compile/dependency task in the normal cached path.
          ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:test --rerun "${test_args[@]}" "${gradle_args[@]}"

      - name: Publish role test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: ${{ matrix.title }} conformance
          report_paths: '**/waltid-openid4vp-conformance-runners/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

      - name: Upload role test results
        if: ${{ always() && inputs.upload-test-results }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-conformance-${{ matrix.role }}
          overwrite: true
          path: '**/waltid-openid4vp-conformance-runners/build/test-results/**/*.xml'
          if-no-files-found: warn
          retention-days: 90

      - name: Publish role conformance summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## OpenID conformance results"
            echo
            echo "> ${ROLE_TITLE} failures fail this job."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          summary=""
          candidate=""
          while IFS= read -r candidate; do
            summary="$candidate"
            break
          done < <(find . -path "*/build/reports/openid-conformance/${ROLE_REPORT_DIR}/summary.md" 2>/dev/null)

          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$summary" ] && [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo "Published ${ROLE_TITLE} conformance summary."
          else
            {
              echo "# ${ROLE_TITLE} Conformance Summary"
              echo
              echo "- Total: 0"
              echo "- Passed: 0"
              echo "- Failed: 0"
              echo
              echo "<details>"
              echo "<summary>${ROLE_TITLE} results</summary>"
              echo
              echo "| Test | Status | Suite | Log | Error |"
              echo "|------|--------|-------|-----|-------|"
              echo
              echo "</details>"
              echo
              echo "_No ${ROLE_TITLE} conformance results were produced (suite skipped, unavailable, or failed before writing a report)._"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No ${ROLE_TITLE} summary file was produced."
          fi

      - name: Fail job on published role conformance failures
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          summary=""
          candidate=""
          while IFS= read -r candidate; do
            summary="$candidate"
            break
          done < <(find . -path "*/build/reports/openid-conformance/${ROLE_REPORT_DIR}/summary.md" 2>/dev/null)
          if [ -z "$summary" ] || [ ! -f "$summary" ]; then
            exit 0
          fi
          count="$(awk -F': ' '/^- Failed: / { print $2; exit }' "$summary")"
          if [ -n "${count:-}" ] && [ "$count" -gt 0 ]; then
            echo "::error::${ROLE_TITLE} conformance reported ${count} failed test(s). See the job summary."
            exit 1
          fi

      - name: Stop role tunnel
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/lt_role.pid"
          [ -f "$pid_file" ] || exit 0
          pid=$(cat "$pid_file")
          if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then kill "$pid" 2>/dev/null || true; fi

      - name: Upload role conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openid-conformance-${{ matrix.report_dir }}
          overwrite: true
          if-no-files-found: warn
          path: |
            **/build/reports/openid-conformance/**

  wallet-conformance-results:
    name: wallet/verifier conformance results
    needs: wallet-conformance
    if: ${{ always() && !cancelled() && (inputs.run-conformance || inputs.run-issuer-conformance || inputs.run-haip-conformance) }}
    runs-on: ubuntu-22.04
    steps:
      # Keep going after a missing artifact so the uploads below can still publish
      # whatever arrived. The final check fails the job when the role jobs themselves
      # succeeded and a required artifact did not.
      - name: Download verifier reports
        id: verifier-reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: openid-conformance-vp-verifier
          path: role-reports/vp-verifier

      - name: Download OpenID4VP wallet reports
        id: vp-wallet-reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: openid-conformance-vp-wallet
          path: role-reports/vp-wallet

      - name: Download OpenID4VCI wallet reports
        id: vci-wallet-reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: openid-conformance-vci-wallet
          path: role-reports/vci-wallet

      - name: Download verifier JUnit
        id: verifier-junit
        if: ${{ inputs.upload-test-results }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: junit-conformance-verifier
          path: junit-conformance/verifier

      - name: Download OpenID4VP wallet JUnit
        id: vp-wallet-junit
        if: ${{ inputs.upload-test-results }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: junit-conformance-vp-wallet
          path: junit-conformance/vp-wallet

      - name: Download OpenID4VCI wallet JUnit
        id: vci-wallet-junit
        if: ${{ inputs.upload-test-results }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: junit-conformance-vci-wallet
          path: junit-conformance/vci-wallet

      - name: Assemble OpenID conformance summaries
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p openid-conformance-summaries
          # Copy every report that arrived. Missing roles are rejected below when
          # the role jobs succeeded; a failed role still leaves its siblings here.
          for role in vp-verifier vp-wallet vci-wallet; do
            src="role-reports/$role"
            [ -d "$src" ] || continue
            summary="$(find "$src" -name summary.md -print -quit || true)"
            [ -n "$summary" ] || continue
            mkdir -p "openid-conformance-summaries/$role"
            cp -R "$(dirname "$summary")/." "openid-conformance-summaries/$role/"
          done

      - name: Upload OpenID conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openid-conformance-summaries
          overwrite: true
          if-no-files-found: warn
          path: openid-conformance-summaries

      - name: Upload conformance test results
        if: ${{ always() && inputs.upload-test-results }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-conformance
          overwrite: true
          if-no-files-found: warn
          path: junit-conformance

      - name: Require complete reports when role jobs succeeded
        if: ${{ always() && !cancelled() && needs.wallet-conformance.result == 'success' }}
        env:
          UPLOAD_TEST_RESULTS: ${{ inputs.upload-test-results }}
          VERIFIER_REPORTS: ${{ steps.verifier-reports.outcome }}
          VP_WALLET_REPORTS: ${{ steps.vp-wallet-reports.outcome }}
          VCI_WALLET_REPORTS: ${{ steps.vci-wallet-reports.outcome }}
          VERIFIER_JUNIT: ${{ steps.verifier-junit.outcome }}
          VP_WALLET_JUNIT: ${{ steps.vp-wallet-junit.outcome }}
          VCI_WALLET_JUNIT: ${{ steps.vci-wallet-junit.outcome }}
        run: |
          set -euo pipefail
          failed=0
          require_success() {
            local name="$1"
            local outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error::${name} download ${outcome}; the combined conformance artifact is incomplete."
              failed=1
            fi
          }
          require_success "OpenID4VP verifier reports" "$VERIFIER_REPORTS"
          require_success "OpenID4VP wallet reports" "$VP_WALLET_REPORTS"
          require_success "OpenID4VCI wallet reports" "$VCI_WALLET_REPORTS"
          for role in vp-verifier vp-wallet vci-wallet; do
            if [ ! -f "openid-conformance-summaries/${role}/summary.md" ]; then
              echo "::error::Missing ${role} summary after aggregation."
              failed=1
            fi
          done
          if [ "$UPLOAD_TEST_RESULTS" = "true" ]; then
            require_success "verifier JUnit" "$VERIFIER_JUNIT"
            require_success "OpenID4VP wallet JUnit" "$VP_WALLET_JUNIT"
            require_success "OpenID4VCI wallet JUnit" "$VCI_WALLET_JUNIT"
          fi
          exit "$failed"

  # Each proof mode runs the unchanged issuer matrix on an independent runner.
  # Neither depends on the verifier or wallet jobs, and a failed proof must not cancel its sibling.
  issuer-conformance:
    name: issuer-conformance (proof-${{ matrix.proof }})
    if: ${{ inputs.run-issuer-conformance || inputs.run-haip-conformance }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        proof: [jwt, attestation]
    env:
      KLOGGING_CONFIG_PATH: ${{ github.workspace }}/waltid-identity/.github/ci/klogging.conf
      ISSUER_REPORT_DIR: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/build/reports/issuer-ci
      ISSUER_DIAGNOSTICS_DIR: ${{ github.workspace }}/issuer-conformance-diagnostics
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          resolved-refs: ${{ inputs.checkout-refs }}

      - name: Verify CI klogging config
        run: test -f "$KLOGGING_CONFIG_PATH"

      - name: Configure gradle
        id: conformance-gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Install Playwright browsers and system dependencies once
        id: conformance-browsers
        run: ./gradlew :waltid-services:waltid-issuer-api2:installPlaywrightBrowsers --no-daemon --console=plain
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      # Prepare an independent issuer runtime for this proof mode.
      - name: Verify hosted suite revision
        id: issuer-suite
        if: ${{ !cancelled() && steps.conformance-gradle.outcome == 'success' && steps.conformance-browsers.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$ISSUER_DIAGNOSTICS_DIR"
          git -C waltid-identity rev-parse HEAD > "$ISSUER_DIAGNOSTICS_DIR/identity-revision.txt"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            https://conformance.waltid.cloud/api/server > "$ISSUER_DIAGNOSTICS_DIR/suite-version.json"
          jq -e '.revision == "db1080a" and .tag == "release-v5.2.3" and .version == "5.2.4"' \
            "$ISSUER_DIAGNOSTICS_DIR/suite-version.json" >/dev/null || {
              echo '::error::Hosted suite differs from pinned db1080a / release-v5.2.3 / 5.2.4. Review the suite pin; do not bypass this check.'
              exit 1
            }

      - name: Prepare Issuer2 distribution and validate conformance fixtures
        id: issuer-build
        if: ${{ !cancelled() && steps.issuer-suite.outcome == 'success' }}
        run: |
          ./gradlew :waltid-services:waltid-issuer-api2:installDist \
            :waltid-services:waltid-openid4vp-conformance-runners:test -PskipLiveConformance=true \
            --tests id.walt.openid4vp.conformance.IssuerCiConfigurationTest \
            --tests id.walt.openid4vp.conformance.IssuerKeyAttestationTest \
            --tests id.walt.openid4vp.conformance.IssuerProofModesTest --no-configuration-cache --console=plain
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Prepare Issuer2 conformance runtime
        id: issuer-tunnel
        if: ${{ !cancelled() && steps.issuer-build.outcome == 'success' }}
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
        run: |
          set -euo pipefail
          # Each proof job owns its issuer process, tunnel and port on a separate runner.
          if [ -n "$(ss -H -ltn 'sport = :7005')" ]; then
            echo '::error::Port 7005 is occupied; refusing to start Issuer2.'
            exit 1
          fi
          CLOUDFLARED="$RUNNER_TEMP/cloudflared-issuer2"
          TUNNEL_LOG="$RUNNER_TEMP/cloudflared-issuer2.log"
          ISSUER_LOG="$RUNNER_TEMP/issuer2.log"
          ISSUER_CONFIG="$RUNNER_TEMP/issuer-service-conformance.conf"
          FIXTURES="$GITHUB_WORKSPACE/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/issuer2"

          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o "$CLOUDFLARED"
          chmod +x "$CLOUDFLARED"
          "$CLOUDFLARED" tunnel --url http://127.0.0.1:7005 > "$TUNNEL_LOG" 2>&1 &
          CF_PID=$!
          echo "$CF_PID" > "$RUNNER_TEMP/cloudflared-issuer2.pid"
          TUNNEL_URL=""
          for attempt in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | head -n 1 || true)
            [ -n "$TUNNEL_URL" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { echo "::error::Issuer tunnel exited during startup"; exit 1; }
            sleep 1
          done
          [ -n "$TUNNEL_URL" ] || { echo "::error::No issuer tunnel URL after 60s"; exit 1; }
          sed "s|__ISSUER_BASE_URL__|$TUNNEL_URL|g" "$FIXTURES/issuer-service-ci.conf.template" > "$ISSUER_CONFIG"

          pushd waltid-identity/waltid-services/waltid-issuer-api2 >/dev/null
          nohup java -Dconfig.file.issuer-service="$ISSUER_CONFIG" \
            -Dconfig.file.issuer2-profiles="$FIXTURES/issuer2-profiles-ci.conf" \
            -Dconfig.file.credential-issuer-metadata="$FIXTURES/credential-issuer-metadata-ci.conf" \
            -cp "build/install/waltid-issuer-api2/lib/*" id.walt.issuer2.MainKt > "$ISSUER_LOG" 2>&1 &
          ISSUER_PID=$!
          popd >/dev/null
          echo "$ISSUER_PID" > "$RUNNER_TEMP/issuer2.pid"
          METADATA_PATH="/.well-known/openid-credential-issuer/openid4vci"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --connect-timeout 2 --max-time 3 "http://127.0.0.1:7005$METADATA_PATH" >/dev/null; then
              break
            fi
            kill -0 "$ISSUER_PID" 2>/dev/null || { echo "::error::Issuer2 exited; ensure the batch compatibility implementation is merged"; exit 1; }
            sleep 1
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 5 --max-time 15 \
            "$TUNNEL_URL$METADATA_PATH" > "$ISSUER_DIAGNOSTICS_DIR/issuer-metadata.json"
          jq -e --arg issuer "$TUNNEL_URL/openid4vci" '
            .credential_issuer == $issuer
            and (.batch_credential_issuance.batch_size | type == "number" and . >= 2 and floor == .)
            and (.credential_configurations_supported as $configs
              | {"identity_credential": "dc+sd-jwt", "org.iso.18013.5.1.mDL": "mso_mdoc",
                 "identity_credential_haip": "dc+sd-jwt", "org.iso.18013.5.1.mDL.haip": "mso_mdoc"}
              | to_entries | all(.[]; . as $entry
                | $configs[$entry.key].format == $entry.value
                and (($configs[$entry.key].proof_types_supported.jwt.proof_signing_alg_values_supported // []) | index("ES256") != null)
                and ($configs[$entry.key].proof_types_supported | keys == ["jwt"])
                and ($configs[$entry.key].proof_types_supported.jwt.key_attestations_required | type == "object")
                and ($configs[$entry.key + ".attestation"].format == $entry.value)
                and ($configs[$entry.key + ".attestation"].proof_types_supported | keys == ["attestation"])
                and (($configs[$entry.key + ".attestation"].proof_types_supported.attestation.proof_signing_alg_values_supported // []) | index("ES256") != null)))
          ' "$ISSUER_DIAGNOSTICS_DIR/issuer-metadata.json" >/dev/null || {
            echo '::error::Issuer metadata must expose the public URL, batch size >= 2 and four JWT-only and four attestation-only CI configurations using ES256 and required JWT key attestations. Check the issuer implementation and CI configuration.'
            exit 1
          }
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Run issuer conformance tests
        id: conformance-tests
        if: ${{ !cancelled() && steps.issuer-tunnel.outcome == 'success' }}
        run: |
          set -euo pipefail
          export OPENID4VCI_CONFORMANCE_CREDENTIAL_ISSUER_URL="$ISSUER_BASE_URL/openid4vci"
          gradle_args=(--continue --console=plain --warning-mode=summary --no-configuration-cache -PskipLiveConformance=false)
          if [ "$CACHELESS" = "true" ]; then
            gradle_args+=(--rerun-tasks --no-daemon)
          fi
          # Rerun live tests, not every compile/dependency task in the normal cached path.
          ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:test --rerun \
            --tests id.walt.openid4vp.conformance.IssuerConformanceTests "${gradle_args[@]}"
        env:
          CI: "true"
          CACHELESS: ${{ inputs.cacheless }}
          ISSUER_BASE_URL: ${{ steps.issuer-tunnel.outputs.url }}
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          CONFORMANCE_HOST: conformance.waltid.cloud
          CONFORMANCE_PORT: "443"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          SKIP_LIVE_CONFORMANCE: "false"
          OPENID4VCI_CONFORMANCE_MATRIX: all
          OPENID4VCI_CONFORMANCE_DISCOVERY_ONLY: "false"
          OPENID4VCI_CONFORMANCE_STRICT: "true"
          OPENID4VCI_CONFORMANCE_REQUIRE_BATCH_PASS: "true"
          OPENID4VCI_CONFORMANCE_REQUIRE_KEY_ATTESTATION_PASS: "true"
          OPENID4VCI_CONFORMANCE_SUITE_HOST: conformance.waltid.cloud
          OPENID4VCI_CONFORMANCE_SUITE_PORT: "443"
          OPENID4VCI_CONFORMANCE_SD_JWT_CREDENTIAL_CONFIGURATION_ID: identity_credential
          OPENID4VCI_CONFORMANCE_MDOC_CREDENTIAL_CONFIGURATION_ID: org.iso.18013.5.1.mDL
          OPENID4VCI_CONFORMANCE_HAIP_SD_JWT_CREDENTIAL_CONFIGURATION_ID: identity_credential_haip
          OPENID4VCI_CONFORMANCE_HAIP_MDOC_CREDENTIAL_CONFIGURATION_ID: org.iso.18013.5.1.mDL.haip
          OPENID4VCI_CONFORMANCE_CLIENT_ATTESTER_JWKS_FILE: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/keys/attester-key.json
          OPENID4VCI_CONFORMANCE_KEY_ATTESTER_JWKS_FILE: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/keys/attester-key.json
          OPENID4VCI_CONFORMANCE_PROOF_MODES: ${{ matrix.proof }}
          OPENID4VCI_CONFORMANCE_CREDENTIAL_TRUST_ANCHOR_PEM_FILE: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/certs/issuer2-haip-root-ca.pem
          OPENID4VCI_CONFORMANCE_STATUS_LIST_TRUST_ANCHOR_PEM_FILE: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/certs/issuer2-haip-root-ca.pem
          OPENID4VCI_CONFORMANCE_FILTER_FAPI_PROFILES: vci,vci_haip
          OPENID4VCI_CONFORMANCE_FILTER_FORMATS: sd_jwt_vc,mdoc
          OPENID4VCI_CONFORMANCE_FILTER_GRANT_TYPES: authorization_code,pre_authorization_code
          OPENID4VCI_CONFORMANCE_FILTER_FLOW_VARIANTS: issuer_initiated,wallet_initiated
          OPENID4VCI_CONFORMANCE_FILTER_CLIENT_AUTH_TYPES: client_attestation
          OPENID4VCI_CONFORMANCE_FILTER_SENDER_CONSTRAINTS: dpop
          OPENID4VCI_CONFORMANCE_FILTER_AUTH_REQUEST_TYPES: simple
          OPENID4VCI_CONFORMANCE_FILTER_REQUEST_METHODS: unsigned
          OPENID4VCI_CONFORMANCE_FILTER_CREDENTIAL_ENCRYPTION: plain,encrypted
          OPENID4VCI_CONFORMANCE_MODULE_GROUPS: metadata,positive,negative
          OPENID4VCI_CONFORMANCE_MODULES: ""
          # CI-only: these TLS probes reach the Cloudflare Quick Tunnel edge, not Issuer2.
          # Keep enabled locally; restore here when CI uses a compliant public TLS endpoint.
          OPENID4VCI_CONFORMANCE_EXCLUDED_MODULES: oid4vci-1_0-issuer-happy-flow-additional-requests
          OPENID4VCI_CONFORMANCE_STATIC_TX_CODE: "493536"
          OPENID4VCI_CONFORMANCE_BROWSER_AUTOMATION: "true"
          OPENID4VCI_CONFORMANCE_AUTH_USERNAME: jane@walt.id
          OPENID4VCI_CONFORMANCE_AUTH_PASSWORD: jane
          OPENID4VCI_CONFORMANCE_AUTH_TIMEOUT_SECONDS: "90"
          OPENID4VCI_CONFORMANCE_TIMEOUT_MINUTES: "90"
          OPENID4VCI_CONFORMANCE_REPORT_DIR: ${{ env.ISSUER_REPORT_DIR }}
          PLAYWRIGHT_BROWSER: chromium
          PLAYWRIGHT_HEADLESS: "true"

      - name: Publish issuer test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: Issuer2 conformance (${{ matrix.proof }})
          report_paths: '**/waltid-openid4vp-conformance-runners/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

      - name: Upload issuer test results
        if: ${{ always() && inputs.upload-test-results }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-issuer-conformance-${{ matrix.proof }}
          overwrite: true
          path: '**/waltid-openid4vp-conformance-runners/build/test-results/**/*.xml'
          if-no-files-found: warn
          retention-days: 90

      - name: Prepare issuer proof results
        if: always()
        env:
          PROOF_MODE: ${{ matrix.proof }}
          ISSUER_SETUP_OUTCOME: ${{ steps.issuer-tunnel.outcome }}
          ISSUER_TEST_OUTCOME: ${{ steps.conformance-tests.outcome }}
        run: >-
          python3 waltid-identity/.github/scripts/ci/issuer_conformance_reports.py prepare
          --proof "$PROOF_MODE" --reports "$ISSUER_REPORT_DIR" --output "$ISSUER_DIAGNOSTICS_DIR"
          --setup-outcome "$ISSUER_SETUP_OUTCOME" --test-outcome "$ISSUER_TEST_OUTCOME"

      - name: Stop Issuer2 conformance services
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/issuer2.pid" "$RUNNER_TEMP/cloudflared-issuer2.pid"; do
            [ -f "$pid_file" ] || continue
            pid=$(cat "$pid_file")
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then kill "$pid" 2>/dev/null || true; fi
          done

      - name: Upload issuer proof results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issuer-conformance-proof-${{ matrix.proof }}
          overwrite: true
          if-no-files-found: warn
          path: |
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/identity-revision.txt
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/suite-version.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/results.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/shard.json

  issuer-conformance-results:
    name: issuer-conformance results
    needs: issuer-conformance
    if: ${{ always() && !cancelled() && (inputs.run-issuer-conformance || inputs.run-haip-conformance) }}
    runs-on: ubuntu-22.04
    env:
      ISSUER_DIAGNOSTICS_DIR: ${{ github.workspace }}/issuer-conformance-diagnostics
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          resolved-refs: ${{ inputs.checkout-refs }}

      # Named downloads keep a single surviving proof in its own directory.
      # A pattern match of one artifact is extracted without that directory.
      - name: Download JWT issuer proof results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issuer-conformance-proof-jwt
          path: issuer-proof-results/issuer-conformance-proof-jwt

      - name: Download attestation issuer proof results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issuer-conformance-proof-attestation
          path: issuer-proof-results/issuer-conformance-proof-attestation

      - name: Merge and verify issuer results
        if: ${{ always() && !cancelled() }}
        run: >-
          python3 waltid-identity/.github/scripts/ci/issuer_conformance_reports.py merge
          --shards issuer-proof-results --output "$ISSUER_DIAGNOSTICS_DIR"

      - name: Publish issuer conformance summary
        if: ${{ always() && !cancelled() }}
        run: bash waltid-identity/.github/scripts/ci/publish-issuer-conformance-summary.sh

      - name: Upload issuer conformance results
        if: ${{ always() && (inputs.run-issuer-conformance || inputs.run-haip-conformance) }}
        uses: actions/upload-artifact@v7
        with:
          name: issuer-conformance-basic-haip-batch
          overwrite: true
          if-no-files-found: warn
          path: |
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/identity-revision.txt
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/suite-version.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/results.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/coverage.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/jwt/results.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/attestation/results.json

  # Maven publish waits for the default Gradle job and, when requested, the live
  # verifier, wallet and issuer jobs. Leaving publish on the gradle job let release candidates upload
  # artifacts while conformance was still running or after it had failed.
  publish:
    name: publish
    needs: [gradle, wallet-conformance, wallet-conformance-results, issuer-conformance, issuer-conformance-results]
    if: >-
      always() && !cancelled()
      && inputs.publish
      && inputs.version != ''
      && needs.gradle.result == 'success'
      && (needs.wallet-conformance.result == 'success' || needs.wallet-conformance.result == 'skipped')
      && (needs.wallet-conformance-results.result == 'success' || needs.wallet-conformance-results.result == 'skipped')
      && (needs.issuer-conformance.result == 'success' || needs.issuer-conformance.result == 'skipped')
      && (needs.issuer-conformance-results.result == 'success' || needs.issuer-conformance-results.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          resolved-refs: ${{ inputs.checkout-refs }}

      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Enable Android build
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'waltid-identity/gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable Android build in unified-build root
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Write Google services config
        if: ${{ inputs.enable-android-build }}
        env:
          GOOGLE_SERVICES_PREVIEW_JSON: ${{ secrets.GOOGLE_SERVICES_PREVIEW_JSON }}
          GOOGLE_SERVICES_PRODUCTION_JSON: ${{ secrets.GOOGLE_SERVICES_PRODUCTION_JSON }}
        run: bash waltid-identity/.github/scripts/mobile-ci/write-google-services.sh

      - name: Publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish -Pversion="$RELEASE_VERSION" --no-daemon
