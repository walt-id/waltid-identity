name: Build gradle and/or publish (reusable workflow)

on:
  workflow_call:
    inputs:
      version:
        description: "release version"
        required: false
        type: string
      publish:
        description: "Specifies whether to publish the artifacts (defaults to false)"
        required: false
        type: boolean
        default: false
      report-check-name:
        description: "Visible GitHub check run name to update with the JUnit report"
        required: true
        type: string
      enable-android-build:
        description: "Enable Android targets during the Gradle build"
        required: false
        type: boolean
        default: false
      run-issuer-conformance:
        description: "Run the OpenID4VCI Issuer2 conformance matrix"
        required: false
        type: boolean
        default: false
      run-haip-conformance:
        description: "Run the OpenID4VCI HAIP Issuer2 conformance matrix"
        required: false
        type: boolean
        default: false

jobs:
  gradle:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@73cf58a0edcc4c978304fdfd1a91372d34f65da2
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@864f84343fdeea17f6f63434bc8036c39f178dc7

      - name: Install SoftHSM for PKCS11 tests
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2

      - name: Enable Android build
        if: ${{ inputs.enable-android-build }}
        uses: walt-id/waltid-identity/.github/actions/set-properties@00d4e55e9865cf17c6703d926dce4a4f6e1d404a
        with:
          file: 'waltid-identity/gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable Android build in unified-build root
        if: ${{ inputs.enable-android-build }}
        uses: walt-id/waltid-identity/.github/actions/set-properties@00d4e55e9865cf17c6703d926dce4a4f6e1d404a
        with:
          file: 'gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Start tunnel and get URL
        id: tunnel
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
        run: |
          # Start tunnel on port 7003
          wget -q -O cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:7003 > lt_output.txt 2>&1 &
          CF_PID=$!

          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' lt_output.txt | head -n 1)
            [ -n "$TUNNEL_URL" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { echo "cloudflared exited before printing a URL"; break; }
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get tunnel URL after ${i}s"
            cat lt_output.txt
            exit 1
          fi

          echo "Tunnel URL: $TUNNEL_URL (ready after ${i}s)"
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Replace URLs in Kotlin test
        if: ${{ steps.tunnel.outputs.url != '' }}
        run: |
          FILE="./waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/kotlin/id/walt/openid4vp/conformance/ConformanceTests.kt"
          sed -i \
            -e "s#https://verifier2.localhost/verification-session#${{ steps.tunnel.outputs.url }}/verification-session#g" \
            -e "s#localhost.emobix.co.uk#conformance.waltid.cloud#g" \
            -e "s#8443#443#g" \
            "$FILE"

      - name: Clean and build with all tests
        run: ./gradlew clean cleanAllTests build allTests --rerun-tasks --no-daemon --continue --console=plain --warning-mode=summary
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          CONFORMANCE_ALLOW_FAILURE: ${{ vars.CONFORMANCE_ALLOW_FAILURE }}
          OPENID4VCI_CONFORMANCE_STRICT: ${{ vars.CONFORMANCE_ALLOW_FAILURE == 'false' }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          update_check: true
          job_name: ${{ inputs.report-check-name }}
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

      - name: Publish OpenID conformance summary
        if: always()
        env:
          CONFORMANCE_ALLOW_FAILURE: ${{ vars.CONFORMANCE_ALLOW_FAILURE }}
        run: |
          {
            echo "## OpenID Conformance Results"
            echo
            if [ -z "${CONFORMANCE_ALLOW_FAILURE}" ] || [ "${CONFORMANCE_ALLOW_FAILURE}" = "true" ]; then
              echo "> Soft-fail enabled (\`CONFORMANCE_ALLOW_FAILURE\` unset/true). Failed conformance tests are reported below but do not fail this job."
            else
              echo "> Soft-fail disabled (\`CONFORMANCE_ALLOW_FAILURE=false\`). Failed conformance tests fail this job."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          found=0
          while IFS= read -r -d '' summary; do
            found=$((found + 1))
            {
              echo
              cat "$summary"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find . \
            -path '*/build/reports/openid-conformance/*/summary.md' \
            -print0 2>/dev/null)

          while IFS= read -r -d '' summary; do
            found=$((found + 1))
            {
              echo
              cat "$summary"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find . \
            -path '*/build/reports/openid4vci-issuer-matrix/summary.md' \
            -print0 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "_No OpenID conformance suite summaries were produced (suites skipped or unavailable)._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Appended $found OpenID conformance summary file(s) to the job summary."
          fi

      - name: Set version
        if: ${{ inputs.version != '' && runner.os == 'linux' }}
        run: |
          sed -i "s/1.0.0-SNAPSHOT/${{ inputs.version }}/g" build.gradle.kts

      - name: Publish
        if: ${{ inputs.version != '' && inputs.publish && runner.os == 'linux' }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish --no-daemon

  openid4vci-conformance:
    if: ${{ inputs.run-issuer-conformance }}
    runs-on: ubuntu-22.04
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@73cf58a0edcc4c978304fdfd1a91372d34f65da2
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@864f84343fdeea17f6f63434bc8036c39f178dc7

      - name: Build Issuer2 conformance runtime
        run: ./gradlew :waltid-services:waltid-issuer-api2:buildFatJar --no-daemon --console=plain --warning-mode=summary
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Start Issuer2 conformance tunnel
        id: issuer-tunnel
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
        run: |
          set -euo pipefail

          CLOUDFLARED="$RUNNER_TEMP/cloudflared"
          TUNNEL_LOG="$RUNNER_TEMP/cloudflared-issuer2.log"
          ISSUER_LOG="$RUNNER_TEMP/issuer2.log"
          ISSUER_CONFIG="$RUNNER_TEMP/issuer-service-conformance.conf"
          TEMPLATE="waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/issuer2/issuer-service-ci.conf.template"

          wget -q -O "$CLOUDFLARED" "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x "$CLOUDFLARED"
          "$CLOUDFLARED" tunnel --url http://127.0.0.1:7005 > "$TUNNEL_LOG" 2>&1 &
          CF_PID=$!
          echo "$CF_PID" > "$RUNNER_TEMP/cloudflared-issuer2.pid"

          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | head -n 1 || true)
            [ -n "$TUNNEL_URL" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { echo "cloudflared exited before printing a URL"; break; }
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get a Cloudflare Quick Tunnel URL"
            cat "$TUNNEL_LOG"
            exit 1
          fi

          sed "s|__ISSUER_BASE_URL__|$TUNNEL_URL|g" "$TEMPLATE" > "$ISSUER_CONFIG"

          pushd waltid-identity/waltid-services/waltid-issuer-api2 >/dev/null
          nohup java -Dconfig.file.issuer-service="$ISSUER_CONFIG" \
            -jar build/libs/waltid-issuer-api2-all.jar > "$ISSUER_LOG" 2>&1 &
          ISSUER_PID=$!
          popd >/dev/null
          echo "$ISSUER_PID" > "$RUNNER_TEMP/issuer2.pid"

          METADATA_PATH="/.well-known/openid-credential-issuer/openid4vci"
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error "http://127.0.0.1:7005$METADATA_PATH" >/dev/null; then
              break
            fi
            kill -0 "$ISSUER_PID" 2>/dev/null || { echo "Issuer2 exited during startup"; cat "$ISSUER_LOG"; exit 1; }
            sleep 1
          done
          curl --fail --silent --show-error "$TUNNEL_URL$METADATA_PATH" >/dev/null

          echo "Issuer2 conformance tunnel: $TUNNEL_URL"
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Install Playwright for Issuer2 conformance
        run: ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:installPlaywrightBrowsers --no-daemon --console=plain --warning-mode=summary
        env:
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Run OpenID4VCI Issuer2 conformance
        run: >-
          ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:test
          --tests id.walt.openid4vp.conformance.IssuerConformanceTests
          --rerun-tasks --no-daemon --console=plain --warning-mode=summary
        env:
          CI: "true"
          CONFORMANCE_ALLOW_FAILURE: "false"
          OPENID4VCI_CONFORMANCE_STRICT: "true"
          OPENID4VCI_CONFORMANCE_CREDENTIAL_ISSUER_URL: ${{ steps.issuer-tunnel.outputs.url }}/openid4vci
          OPENID4VCI_CONFORMANCE_SUITE_HOST: conformance.waltid.cloud
          OPENID4VCI_CONFORMANCE_SUITE_PORT: "443"
          OPENID4VCI_CONFORMANCE_SD_JWT_CREDENTIAL_CONFIGURATION_ID: identity_credential
          OPENID4VCI_CONFORMANCE_MDOC_CREDENTIAL_CONFIGURATION_ID: org.iso.18013.5.1.mDL
          OPENID4VCI_CONFORMANCE_FILTER_FAPI_PROFILES: vci
          OPENID4VCI_CONFORMANCE_FILTER_FORMATS: sd_jwt_vc,mdoc
          OPENID4VCI_CONFORMANCE_FILTER_GRANT_TYPES: authorization_code,pre_authorization_code
          OPENID4VCI_CONFORMANCE_FILTER_FLOW_VARIANTS: issuer_initiated,wallet_initiated
          OPENID4VCI_CONFORMANCE_FILTER_CLIENT_AUTH_TYPES: client_attestation
          OPENID4VCI_CONFORMANCE_FILTER_SENDER_CONSTRAINTS: dpop
          OPENID4VCI_CONFORMANCE_FILTER_AUTH_REQUEST_TYPES: simple
          OPENID4VCI_CONFORMANCE_FILTER_REQUEST_METHODS: unsigned
          OPENID4VCI_CONFORMANCE_FILTER_CREDENTIAL_ENCRYPTION: plain,encrypted
          OPENID4VCI_CONFORMANCE_MODULE_GROUPS: metadata,positive,negative
          OPENID4VCI_CONFORMANCE_EXCLUDED_MODULES: oid4vci-1_0-issuer-happy-flow-additional-requests,fapi2-security-profile-final-discovery-end-point-verification
          OPENID4VCI_CONFORMANCE_EXCLUDE_PREAUTH_MULTIPLE_CLIENTS: "true"
          OPENID4VCI_CONFORMANCE_STATIC_TX_CODE: "493536"
          OPENID4VCI_CONFORMANCE_BROWSER_AUTOMATION: "true"
          OPENID4VCI_CONFORMANCE_AUTH_USERNAME: jane@walt.id
          OPENID4VCI_CONFORMANCE_AUTH_PASSWORD: jane
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Stop Issuer2 conformance services
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/issuer2.pid" "$RUNNER_TEMP/cloudflared-issuer2.pid"; do
            [ -f "$pid_file" ] || continue
            pid=$(cat "$pid_file")
            kill "$pid" 2>/dev/null || true
          done

      - name: Upload OpenID4VCI Issuer2 conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openid4vci-issuer2-conformance
          if-no-files-found: warn
          path: |
            waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/build/reports/openid-conformance/vci-issuer/
            ${{ runner.temp }}/issuer2.log
            ${{ runner.temp }}/cloudflared-issuer2.log

      - name: Publish OpenID4VCI conformance test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          update_check: true
          job_name: ${{ inputs.report-check-name }} / openid4vci-conformance
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

      - name: Publish OpenID4VCI conformance summary
        if: always()
        run: |
          {
            echo "## OpenID4VCI Conformance Results"
            echo
            echo "> This matrix runs in strict mode. A non-accepted selected variant fails this job."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          found=0
          while IFS= read -r -d '' summary; do
            found=$((found + 1))
            {
              echo
              cat "$summary"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find . \
            -path '*/build/reports/openid-conformance/vci-issuer/summary.md' \
            -print0 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "_No OpenID4VCI conformance summary was produced._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Appended $found OpenID4VCI conformance summary file(s) to the job summary."
          fi

  openid4vci-haip-conformance:
    if: ${{ inputs.run-haip-conformance }}
    runs-on: ubuntu-22.04
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@73cf58a0edcc4c978304fdfd1a91372d34f65da2
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@864f84343fdeea17f6f63434bc8036c39f178dc7

      - name: Build Issuer2 HAIP conformance runtime
        run: ./gradlew :waltid-services:waltid-issuer-api2:buildFatJar --no-daemon --console=plain --warning-mode=summary
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Start Issuer2 HAIP conformance tunnel
        id: issuer-tunnel
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
        run: |
          set -euo pipefail

          CLOUDFLARED="$RUNNER_TEMP/cloudflared"
          TUNNEL_LOG="$RUNNER_TEMP/cloudflared-issuer2-haip.log"
          ISSUER_LOG="$RUNNER_TEMP/issuer2-haip.log"
          ISSUER_CONFIG="$RUNNER_TEMP/issuer-service-haip-conformance.conf"
          TEMPLATE="waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/issuer2/issuer-service-ci.conf.template"

          wget -q -O "$CLOUDFLARED" "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x "$CLOUDFLARED"
          "$CLOUDFLARED" tunnel --url http://127.0.0.1:7005 > "$TUNNEL_LOG" 2>&1 &
          CF_PID=$!
          echo "$CF_PID" > "$RUNNER_TEMP/cloudflared-issuer2-haip.pid"

          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | head -n 1 || true)
            [ -n "$TUNNEL_URL" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { echo "cloudflared exited before printing a URL"; break; }
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get a Cloudflare Quick Tunnel URL"
            cat "$TUNNEL_LOG"
            exit 1
          fi

          sed "s|__ISSUER_BASE_URL__|$TUNNEL_URL|g" "$TEMPLATE" > "$ISSUER_CONFIG"

          pushd waltid-identity/waltid-services/waltid-issuer-api2 >/dev/null
          nohup java -Dconfig.file.issuer-service="$ISSUER_CONFIG" \
            -jar build/libs/waltid-issuer-api2-all.jar > "$ISSUER_LOG" 2>&1 &
          ISSUER_PID=$!
          popd >/dev/null
          echo "$ISSUER_PID" > "$RUNNER_TEMP/issuer2-haip.pid"

          METADATA_PATH="/.well-known/openid-credential-issuer/openid4vci"
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error "http://127.0.0.1:7005$METADATA_PATH" >/dev/null; then
              break
            fi
            kill -0 "$ISSUER_PID" 2>/dev/null || { echo "Issuer2 exited during startup"; cat "$ISSUER_LOG"; exit 1; }
            sleep 1
          done
          curl --fail --silent --show-error "$TUNNEL_URL$METADATA_PATH" >/dev/null

          echo "Issuer2 HAIP conformance tunnel: $TUNNEL_URL"
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Install Playwright for Issuer2 HAIP conformance
        run: ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:installPlaywrightBrowsers --no-daemon --console=plain --warning-mode=summary
        env:
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Run OpenID4VCI HAIP Issuer2 conformance
        run: >-
          ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:test
          --tests id.walt.openid4vp.conformance.IssuerConformanceTests
          --rerun-tasks --no-daemon --console=plain --warning-mode=summary
        env:
          CI: "true"
          CONFORMANCE_ALLOW_FAILURE: "false"
          OPENID4VCI_CONFORMANCE_STRICT: "true"
          OPENID4VCI_CONFORMANCE_CREDENTIAL_ISSUER_URL: ${{ steps.issuer-tunnel.outputs.url }}/openid4vci
          OPENID4VCI_CONFORMANCE_SUITE_HOST: conformance.waltid.cloud
          OPENID4VCI_CONFORMANCE_SUITE_PORT: "443"
          OPENID4VCI_CONFORMANCE_HAIP_SD_JWT_CREDENTIAL_CONFIGURATION_ID: identity_credential_haip
          OPENID4VCI_CONFORMANCE_HAIP_MDOC_CREDENTIAL_CONFIGURATION_ID: org.iso.18013.5.1.mDL.haip
          OPENID4VCI_CONFORMANCE_CREDENTIAL_TRUST_ANCHOR_PEM_FILE: waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/certs/issuer2-haip-root-ca.pem
          OPENID4VCI_CONFORMANCE_STATUS_LIST_TRUST_ANCHOR_PEM_FILE: waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/certs/issuer2-haip-root-ca.pem
          OPENID4VCI_CONFORMANCE_FILTER_FAPI_PROFILES: vci_haip
          OPENID4VCI_CONFORMANCE_FILTER_FORMATS: sd_jwt_vc,mdoc
          OPENID4VCI_CONFORMANCE_FILTER_GRANT_TYPES: authorization_code
          OPENID4VCI_CONFORMANCE_FILTER_FLOW_VARIANTS: issuer_initiated,wallet_initiated
          OPENID4VCI_CONFORMANCE_FILTER_CLIENT_AUTH_TYPES: client_attestation
          OPENID4VCI_CONFORMANCE_FILTER_SENDER_CONSTRAINTS: dpop
          OPENID4VCI_CONFORMANCE_FILTER_AUTH_REQUEST_TYPES: simple
          OPENID4VCI_CONFORMANCE_FILTER_REQUEST_METHODS: unsigned
          OPENID4VCI_CONFORMANCE_FILTER_CREDENTIAL_ENCRYPTION: plain,encrypted
          OPENID4VCI_CONFORMANCE_MODULE_GROUPS: metadata,positive,negative
          # Cloudflare Quick Tunnels do not provide the suite's required TLS policy evidence.
          OPENID4VCI_CONFORMANCE_EXCLUDED_MODULES: oid4vci-1_0-issuer-happy-flow-additional-requests
          OPENID4VCI_CONFORMANCE_BROWSER_AUTOMATION: "true"
          OPENID4VCI_CONFORMANCE_AUTH_USERNAME: jane@walt.id
          OPENID4VCI_CONFORMANCE_AUTH_PASSWORD: jane
          OPENID4VCI_CONFORMANCE_AUTH_TIMEOUT_SECONDS: "90"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Stop Issuer2 HAIP conformance services
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/issuer2-haip.pid" "$RUNNER_TEMP/cloudflared-issuer2-haip.pid"; do
            [ -f "$pid_file" ] || continue
            pid=$(cat "$pid_file")
            kill "$pid" 2>/dev/null || true
          done

      - name: Upload OpenID4VCI HAIP Issuer2 conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openid4vci-haip-issuer2-conformance
          if-no-files-found: warn
          path: |
            waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/build/reports/openid-conformance/vci-issuer/
            ${{ runner.temp }}/issuer2-haip.log
            ${{ runner.temp }}/cloudflared-issuer2-haip.log

      - name: Publish OpenID4VCI HAIP conformance test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          update_check: true
          job_name: ${{ inputs.report-check-name }} / openid4vci-haip-conformance
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

      - name: Publish OpenID4VCI HAIP conformance summary
        if: always()
        run: |
          {
            echo "## OpenID4VCI HAIP Conformance Results"
            echo
            echo "> This matrix runs in strict mode and excludes dedicated FAPI modules. A non-accepted selected variant fails this job."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          found=0
          while IFS= read -r -d '' summary; do
            found=$((found + 1))
            {
              echo
              cat "$summary"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find . \
            -path '*/build/reports/openid-conformance/vci-issuer/summary.md' \
            -print0 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            echo "_No OpenID4VCI HAIP conformance summary was produced._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Appended $found OpenID4VCI HAIP conformance summary file(s) to the job summary."
          fi
