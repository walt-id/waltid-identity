name: Build gradle and/or publish (reusable workflow)

on:
  workflow_call:
    inputs:
      version:
        description: "release version"
        required: false
        type: string
      publish:
        description: "Specifies whether to publish the artifacts (defaults to false)"
        required: false
        type: boolean
        default: false
      report-check-name:
        description: "Visible GitHub check run name to update with the JUnit report"
        required: true
        type: string
      enable-android-build:
        description: "Enable Android targets during the Gradle build"
        required: false
        type: boolean
        default: false
      run-conformance:
        description: "Run the live OpenID4VP and OpenID4VCI conformance suites"
        required: false
        type: boolean
        default: false
      run-issuer-conformance:
        description: "Run the OpenID4VCI Issuer2 conformance matrix"
        required: false
        type: boolean
        default: false
      run-haip-conformance:
        description: "Run the OpenID4VCI HAIP Issuer2 conformance matrix"
        required: false
        type: boolean
        default: false
      cacheless:
        description: "Run a clean, cache-defeating Gradle rebuild"
        required: false
        type: boolean
        default: false
      conformance-report-check-name:
        description: "Visible GitHub check run name for the conformance job JUnit report"
        required: false
        type: string
        default: "conformance (ubuntu-22.04)"

jobs:
  gradle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # KLOGGING_MIN_* only affect Klogging internals / delivery path. Application TRACE comes
      # from test klogging.conf; this file is loaded first and keeps CI at INFO+.
      KLOGGING_CONFIG_PATH: ${{ github.workspace }}/waltid-identity/.github/ci/klogging.conf
      JUNIT_TIMEOUT_DEFAULT: 10m
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Verify CI klogging config
        run: test -f "$KLOGGING_CONFIG_PATH"

      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
        with:
          # Restricted to pushes to main because Dependabot only consumes the default-branch
          # snapshot; submitting per PR just adds annotations and dependency-graph_*.json artifacts.
          dependency-graph: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'generate-and-submit' || 'disabled' }}

      - name: Check default Kotlin configuration
        run: |
          # Mobile-enabled builds can hide modules included without any Kotlin targets.
          for project_dir in . waltid-identity; do
            ./gradlew -p "$project_dir" checkKotlinGradlePluginConfigurationErrors \
              -PenableAndroidBuild=false -PenableIosBuild=false -PenableWalletDemoComposeWeb=false \
              --no-configuration-cache --console=plain
          done

      - name: Install SoftHSM for PKCS11 tests
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2

      - name: Enable Android build
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'waltid-identity/gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable Android build in unified-build root
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Write Google services config
        if: ${{ inputs.enable-android-build }}
        env:
          GOOGLE_SERVICES_PREVIEW_JSON: ${{ secrets.GOOGLE_SERVICES_PREVIEW_JSON }}
          GOOGLE_SERVICES_PRODUCTION_JSON: ${{ secrets.GOOGLE_SERVICES_PRODUCTION_JSON }}
        run: bash waltid-identity/.github/scripts/mobile-ci/write-google-services.sh

      # `playwright install --with-deps` shells out to apt-get, and three modules register an
      # installPlaywrightBrowsers task that the build runs in parallel. They then race for
      # /var/lib/dpkg/lock-frontend and whichever loses fails with "Failed to install browsers".
      # Installing once, serially, keeps the same dep-install mechanism while taking apt out of the
      # parallel phase; the browsers land in ~/.cache/ms-playwright, so the tasks in the build below
      # find them already present and become no-ops with --with-deps switched off.
      - name: Install Playwright browsers and system dependencies once
        run: ./gradlew :waltid-services:waltid-issuer-api2:installPlaywrightBrowsers --no-daemon --console=plain
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"

      - name: Record runner memory before Gradle
        if: always()
        run: |
          {
            echo "## Runner memory before Gradle"
            echo '```'
            free -h || true
            swapon --show || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and test
        if: ${{ !inputs.cacheless }}
        run: |
          set -o pipefail
          ./gradlew build allTests -PskipLiveConformance=true --continue --console=plain --warning-mode=summary | tee "$RUNNER_TEMP/gradle-build.log"
        env:
          CI: "true"
          SKIP_LIVE_CONFORMANCE: "true"
          # Already installed serially above; leaving this on would reintroduce the dpkg race.
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Clean and build with all tests
        if: ${{ inputs.cacheless }}
        run: |
          set -o pipefail
          ./gradlew clean cleanAllTests build allTests -PskipLiveConformance=true --rerun-tasks --no-daemon --continue --console=plain --warning-mode=summary | tee "$RUNNER_TEMP/gradle-build.log"
        env:
          CI: "true"
          SKIP_LIVE_CONFORMANCE: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Summarize Gradle task outcomes and memory
        if: always()
        run: |
          {
            echo "## Gradle task outcomes"
            log="$RUNNER_TEMP/gradle-build.log"
            if [ -f "$log" ]; then
              echo "- UP-TO-DATE: $(grep -c ' UP-TO-DATE$' "$log" || true)"
              echo "- FROM-CACHE: $(grep -c ' FROM-CACHE$' "$log" || true)"
              echo "- SKIPPED: $(grep -c ' SKIPPED$' "$log" || true)"
              echo "- NO-SOURCE: $(grep -c ' NO-SOURCE$' "$log" || true)"
              echo "- task lines: $(grep -cE '^> Task ' "$log" || true)"
            else
              echo "_No Gradle log was captured._"
            fi
            echo
            echo "## Runner memory after Gradle"
            echo '```'
            free -h || true
            swapon --show || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require proximity JVM and JS test discovery
        if: always()
        run: |
          python3 waltid-identity/.github/scripts/mobile-ci/verify_proximity_suites.py --platform jvm
          python3 waltid-identity/.github/scripts/mobile-ci/verify_proximity_suites.py --platform js-node

      - name: Require proximity Android host test discovery
        if: ${{ always() && inputs.enable-android-build }}
        run: python3 waltid-identity/.github/scripts/mobile-ci/verify_proximity_suites.py --platform android-host

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          update_check: true
          job_name: ${{ inputs.report-check-name }}
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

  conformance:
    name: conformance (ubuntu-22.04)
    if: ${{ inputs.run-conformance || inputs.run-issuer-conformance || inputs.run-haip-conformance }}
    runs-on: ubuntu-22.04
    env:
      KLOGGING_CONFIG_PATH: ${{ github.workspace }}/waltid-identity/.github/ci/klogging.conf
      ISSUER_REPORT_DIR: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/build/reports/issuer-ci
      ISSUER_DIAGNOSTICS_DIR: ${{ github.workspace }}/issuer-conformance-diagnostics
    steps:
      - name: Set up swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Verify CI klogging config
        run: test -f "$KLOGGING_CONFIG_PATH"

      - name: Configure gradle
        id: conformance-gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Start tunnels and get URLs
        id: tunnel
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
        run: |
          wget -q -O cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x cloudflared

          start_tunnel() {
            local port="$1"
            local log="$2"
            ./cloudflared tunnel --url "http://localhost:${port}" > "$log" 2>&1 &
            local pid=$!
            echo "$pid" > "$RUNNER_TEMP/${log%.txt}.pid"
            echo "$pid"
          }

          wait_for_url() {
            local pid="$1"
            local log="$2"
            local name="$3"
            local url=""
            local i
            for i in $(seq 1 60); do
              url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$log" | head -n 1)
              [ -n "$url" ] && break
              kill -0 "$pid" 2>/dev/null || { echo "$name cloudflared exited before printing a URL"; cat "$log"; return 1; }
              sleep 1
            done
            if [ -z "$url" ]; then
              echo "Failed to get $name tunnel URL after ${i}s"
              cat "$log"
              return 1
            fi
            echo "$url"
          }

          # Sequential start+wait: concurrent trycloudflare sessions can stall before printing a URL.
          # 7003: OpenID4VP verifier E2E server
          # 7006: OpenID4VP wallet adapter authorization endpoint
          # 7007: OpenID4VCI wallet adapter credential-offer endpoint
          VERIFIER_PID=$(start_tunnel 7003 lt_verifier.txt)
          VERIFIER_URL=$(wait_for_url "$VERIFIER_PID" lt_verifier.txt verifier) || exit 1
          VP_WALLET_PID=$(start_tunnel 7006 lt_vp_wallet.txt)
          VP_WALLET_URL=$(wait_for_url "$VP_WALLET_PID" lt_vp_wallet.txt vp-wallet) || exit 1
          VCI_WALLET_PID=$(start_tunnel 7007 lt_vci_wallet.txt)
          VCI_WALLET_URL=$(wait_for_url "$VCI_WALLET_PID" lt_vci_wallet.txt vci-wallet) || exit 1

          echo "Verifier tunnel: $VERIFIER_URL"
          echo "VP wallet adapter tunnel: $VP_WALLET_URL"
          echo "VCI wallet adapter tunnel: $VCI_WALLET_URL"
          echo "url=$VERIFIER_URL" >> "$GITHUB_OUTPUT"
          echo "vp_wallet_url=$VP_WALLET_URL" >> "$GITHUB_OUTPUT"
          echo "vci_wallet_url=$VCI_WALLET_URL" >> "$GITHUB_OUTPUT"

      - name: Replace URLs in Kotlin test
        if: ${{ steps.tunnel.outputs.url != '' }}
        run: |
          FILE="./waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/kotlin/id/walt/openid4vp/conformance/ConformanceTests.kt"
          sed -i \
            -e "s#https://verifier2.localhost/verification-session#${{ steps.tunnel.outputs.url }}/verification-session#g" \
            -e "s#localhost.emobix.co.uk#conformance.waltid.cloud#g" \
            -e "s#8443#443#g" \
            "$FILE"

      # `playwright install --with-deps` shells out to apt-get, and three modules register an
      # installPlaywrightBrowsers task that the build runs in parallel. They then race for
      # /var/lib/dpkg/lock-frontend and whichever loses fails with "Failed to install browsers".
      # Installing once, serially, keeps the same dep-install mechanism while taking apt out of the
      # parallel phase; the browsers land in ~/.cache/ms-playwright, so the tasks in the build below
      # find them already present and become no-ops with --with-deps switched off.
      - name: Install Playwright browsers and system dependencies once
        id: conformance-browsers
        run: ./gradlew :waltid-services:waltid-issuer-api2:installPlaywrightBrowsers --no-daemon --console=plain
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      # Prepare the optional issuer before the shared live test invocation.
      - name: Verify hosted suite revision
        id: issuer-suite
        if: ${{ !cancelled() && (inputs.run-issuer-conformance || inputs.run-haip-conformance) && steps.conformance-gradle.outcome == 'success' && steps.conformance-browsers.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$ISSUER_DIAGNOSTICS_DIR"
          git -C waltid-identity rev-parse HEAD > "$ISSUER_DIAGNOSTICS_DIR/identity-revision.txt"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            https://conformance.waltid.cloud/api/server > "$ISSUER_DIAGNOSTICS_DIR/suite-version.json"
          jq -e '.revision == "db1080a" and .tag == "release-v5.2.3" and .version == "5.2.4"' \
            "$ISSUER_DIAGNOSTICS_DIR/suite-version.json" >/dev/null || {
              echo '::error::Hosted suite differs from pinned db1080a / release-v5.2.3 / 5.2.4. Review the suite pin; do not bypass this check.'
              exit 1
            }

      - name: Build Issuer2 and validate conformance fixtures
        id: issuer-build
        if: ${{ !cancelled() && steps.issuer-suite.outcome == 'success' }}
        run: |
          ./gradlew :waltid-services:waltid-issuer-api2:buildFatJar --no-daemon --console=plain --warning-mode=summary
          ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:test -PskipLiveConformance=true \
            --tests id.walt.openid4vp.conformance.IssuerCiConfigurationTest --no-configuration-cache --console=plain
        env:
          CI: "true"
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Prepare Issuer2 conformance runtime
        id: issuer-tunnel
        if: ${{ !cancelled() && steps.issuer-build.outcome == 'success' }}
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
        run: |
          set -euo pipefail
          # Issuer2 uses 7005; wallet tests use 7015/7016 and verifier tests use 7003.
          if [ -n "$(ss -H -ltn 'sport = :7005')" ]; then
            echo '::error::Port 7005 is occupied; refusing to start Issuer2.'
            exit 1
          fi
          CLOUDFLARED="$RUNNER_TEMP/cloudflared-issuer2"
          TUNNEL_LOG="$RUNNER_TEMP/cloudflared-issuer2.log"
          ISSUER_LOG="$RUNNER_TEMP/issuer2.log"
          ISSUER_CONFIG="$RUNNER_TEMP/issuer-service-conformance.conf"
          FIXTURES="$GITHUB_WORKSPACE/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/issuer2"

          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o "$CLOUDFLARED"
          chmod +x "$CLOUDFLARED"
          "$CLOUDFLARED" tunnel --url http://127.0.0.1:7005 > "$TUNNEL_LOG" 2>&1 &
          CF_PID=$!
          echo "$CF_PID" > "$RUNNER_TEMP/cloudflared-issuer2.pid"
          TUNNEL_URL=""
          for attempt in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | head -n 1 || true)
            [ -n "$TUNNEL_URL" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { echo "::error::Issuer tunnel exited during startup"; exit 1; }
            sleep 1
          done
          [ -n "$TUNNEL_URL" ] || { echo "::error::No issuer tunnel URL after 60s"; exit 1; }
          sed "s|__ISSUER_BASE_URL__|$TUNNEL_URL|g" "$FIXTURES/issuer-service-ci.conf.template" > "$ISSUER_CONFIG"

          pushd waltid-identity/waltid-services/waltid-issuer-api2 >/dev/null
          nohup java -Dconfig.file.issuer-service="$ISSUER_CONFIG" \
            -Dconfig.file.issuer2-profiles="$FIXTURES/issuer2-profiles-ci.conf" \
            -Dconfig.file.credential-issuer-metadata="$FIXTURES/credential-issuer-metadata-ci.conf" \
            -jar build/libs/waltid-issuer-api2-all.jar > "$ISSUER_LOG" 2>&1 &
          ISSUER_PID=$!
          popd >/dev/null
          echo "$ISSUER_PID" > "$RUNNER_TEMP/issuer2.pid"
          METADATA_PATH="/.well-known/openid-credential-issuer/openid4vci"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --connect-timeout 2 --max-time 3 "http://127.0.0.1:7005$METADATA_PATH" >/dev/null; then
              break
            fi
            kill -0 "$ISSUER_PID" 2>/dev/null || { echo "::error::Issuer2 exited; ensure the batch compatibility implementation is merged"; exit 1; }
            sleep 1
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 5 --max-time 15 \
            "$TUNNEL_URL$METADATA_PATH" > "$ISSUER_DIAGNOSTICS_DIR/issuer-metadata.json"
          jq -e --arg issuer "$TUNNEL_URL/openid4vci" '
            .credential_issuer == $issuer
            and (.batch_credential_issuance.batch_size | type == "number" and . >= 2 and floor == .)
            and (.credential_configurations_supported as $configs
              | {"identity_credential": "dc+sd-jwt", "org.iso.18013.5.1.mDL": "mso_mdoc",
                 "identity_credential_haip": "dc+sd-jwt", "org.iso.18013.5.1.mDL.haip": "mso_mdoc"}
              | to_entries | all(.[]; . as $entry
                | $configs[$entry.key].format == $entry.value
                and (($configs[$entry.key].proof_types_supported.jwt.proof_signing_alg_values_supported // []) | index("ES256") != null)))
          ' "$ISSUER_DIAGNOSTICS_DIR/issuer-metadata.json" >/dev/null || {
            echo '::error::Issuer metadata must expose the public URL, batch size >= 2 and all four proof-bound CI configurations. Check the batch merge and CI configuration.'
            exit 1
          }
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Run conformance tests
        id: conformance-tests
        # Keep wallet/verifier testing runnable even if the optional issuer setup failed.
        if: ${{ !cancelled() && steps.conformance-gradle.outcome == 'success' && steps.conformance-browsers.outcome == 'success' && steps.tunnel.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ -n "$ISSUER_BASE_URL" ]; then
            export OPENID4VCI_CONFORMANCE_CREDENTIAL_ISSUER_URL="$ISSUER_BASE_URL/openid4vci"
            echo 'Running wallet, verifier and issuer conformance together (issuer strict + batch checks enabled).'
          else
            unset OPENID4VCI_CONFORMANCE_CREDENTIAL_ISSUER_URL
            echo 'Running wallet/verifier conformance; no issuer runtime was prepared.'
          fi
          gradle_args=(--continue --console=plain --warning-mode=summary --no-configuration-cache -PskipLiveConformance=false)
          if [ "$CACHELESS" = "true" ]; then
            gradle_args+=(--rerun-tasks --no-daemon)
          fi
          # Rerun live tests, not every compile/dependency task in the normal cached path.
          ./gradlew :waltid-services:waltid-openid4vp-conformance-runners:test --rerun "${gradle_args[@]}"
        env:
          CI: "true"
          CACHELESS: ${{ inputs.cacheless }}
          ISSUER_BASE_URL: ${{ steps.issuer-tunnel.outputs.url }}
          PLAYWRIGHT_INSTALL_WITH_DEPS: "false"
          # Wallet/verifier retain the repository soft-fail policy. The issuer-specific override wins below.
          CONFORMANCE_ALLOW_FAILURE: ${{ vars.CONFORMANCE_ALLOW_FAILURE }}
          CONFORMANCE_HOST: conformance.waltid.cloud
          CONFORMANCE_PORT: "443"
          CONFORMANCE_VP_WALLET_ADAPTER_URL: ${{ steps.tunnel.outputs.vp_wallet_url }}/openid4vp/authorize
          CONFORMANCE_VCI_WALLET_ADAPTER_BASE_URL: ${{ steps.tunnel.outputs.vci_wallet_url }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          SKIP_LIVE_CONFORMANCE: "false"
          OPENID4VCI_CONFORMANCE_MATRIX: all
          OPENID4VCI_CONFORMANCE_DISCOVERY_ONLY: "false"
          OPENID4VCI_CONFORMANCE_STRICT: "true"
          OPENID4VCI_CONFORMANCE_REQUIRE_BATCH_PASS: "true"
          OPENID4VCI_CONFORMANCE_SUITE_HOST: conformance.waltid.cloud
          OPENID4VCI_CONFORMANCE_SUITE_PORT: "443"
          OPENID4VCI_CONFORMANCE_SD_JWT_CREDENTIAL_CONFIGURATION_ID: identity_credential
          OPENID4VCI_CONFORMANCE_MDOC_CREDENTIAL_CONFIGURATION_ID: org.iso.18013.5.1.mDL
          OPENID4VCI_CONFORMANCE_HAIP_SD_JWT_CREDENTIAL_CONFIGURATION_ID: identity_credential_haip
          OPENID4VCI_CONFORMANCE_HAIP_MDOC_CREDENTIAL_CONFIGURATION_ID: org.iso.18013.5.1.mDL.haip
          OPENID4VCI_CONFORMANCE_CLIENT_ATTESTER_JWKS_FILE: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/keys/attester-key.json
          OPENID4VCI_CONFORMANCE_CREDENTIAL_TRUST_ANCHOR_PEM_FILE: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/certs/issuer2-haip-root-ca.pem
          OPENID4VCI_CONFORMANCE_STATUS_LIST_TRUST_ANCHOR_PEM_FILE: ${{ github.workspace }}/waltid-identity/waltid-services/waltid-openid4vp-conformance-runners/src/test/resources/certs/issuer2-haip-root-ca.pem
          OPENID4VCI_CONFORMANCE_FILTER_FAPI_PROFILES: vci,vci_haip
          OPENID4VCI_CONFORMANCE_FILTER_FORMATS: sd_jwt_vc,mdoc
          OPENID4VCI_CONFORMANCE_FILTER_GRANT_TYPES: authorization_code,pre_authorization_code
          OPENID4VCI_CONFORMANCE_FILTER_FLOW_VARIANTS: issuer_initiated,wallet_initiated
          OPENID4VCI_CONFORMANCE_FILTER_CLIENT_AUTH_TYPES: client_attestation
          OPENID4VCI_CONFORMANCE_FILTER_SENDER_CONSTRAINTS: dpop
          OPENID4VCI_CONFORMANCE_FILTER_AUTH_REQUEST_TYPES: simple
          OPENID4VCI_CONFORMANCE_FILTER_REQUEST_METHODS: unsigned
          OPENID4VCI_CONFORMANCE_FILTER_CREDENTIAL_ENCRYPTION: plain,encrypted
          OPENID4VCI_CONFORMANCE_MODULE_GROUPS: metadata,positive,negative
          OPENID4VCI_CONFORMANCE_MODULES: ""
          # CI-only: these TLS probes reach the Cloudflare Quick Tunnel edge, not Issuer2.
          # Keep enabled locally; restore here when CI uses a compliant public TLS endpoint.
          OPENID4VCI_CONFORMANCE_EXCLUDED_MODULES: oid4vci-1_0-issuer-happy-flow-additional-requests
          OPENID4VCI_CONFORMANCE_STATIC_TX_CODE: "493536"
          OPENID4VCI_CONFORMANCE_BROWSER_AUTOMATION: "true"
          OPENID4VCI_CONFORMANCE_AUTH_USERNAME: jane@walt.id
          OPENID4VCI_CONFORMANCE_AUTH_PASSWORD: jane
          OPENID4VCI_CONFORMANCE_AUTH_TIMEOUT_SECONDS: "90"
          OPENID4VCI_CONFORMANCE_TIMEOUT_MINUTES: "90"
          OPENID4VCI_CONFORMANCE_REPORT_DIR: ${{ env.ISSUER_REPORT_DIR }}
          PLAYWRIGHT_BROWSER: chromium
          PLAYWRIGHT_HEADLESS: "true"

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          update_check: true
          job_name: ${{ inputs.conformance-report-check-name }}
          report_paths: '**/waltid-openid4vp-conformance-runners/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: false
          include_skipped: false

      - name: Publish OpenID conformance summary
        if: always()
        env:
          CONFORMANCE_ALLOW_FAILURE: ${{ vars.CONFORMANCE_ALLOW_FAILURE }}
        run: |
          {
            echo "## Wallet and verifier conformance results"
            echo
            if [ -z "${CONFORMANCE_ALLOW_FAILURE}" ] || [ "${CONFORMANCE_ALLOW_FAILURE}" = "true" ]; then
              echo "> Soft-fail enabled (\`CONFORMANCE_ALLOW_FAILURE\` unset/true). Wallet/verifier failures are reported below but do not fail this job. Issuer strict and batch checks are independent."
            else
              echo "> Soft-fail disabled (\`CONFORMANCE_ALLOW_FAILURE=false\`). Wallet/verifier failures fail this job. Issuer strict and batch checks are independent."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          append_role_summary() {
            local role_dir="$1"
            local title="$2"
            local summary=""
            local candidate
            while IFS= read -r candidate; do
              summary="$candidate"
              break
            done < <(find . -path "*/build/reports/openid-conformance/${role_dir}/summary.md" 2>/dev/null)

            echo >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$summary" ] && [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              found=$((found + 1))
            else
              {
                echo "# ${title} Conformance Summary"
                echo
                if [ -z "${CONFORMANCE_ALLOW_FAILURE}" ] || [ "${CONFORMANCE_ALLOW_FAILURE}" = "true" ]; then
                  echo "- Soft-fail (\`CONFORMANCE_ALLOW_FAILURE\`): \`enabled\`"
                else
                  echo "- Soft-fail (\`CONFORMANCE_ALLOW_FAILURE\`): \`disabled\`"
                fi
                echo "- Total: 0"
                echo "- Passed: 0"
                echo "- Failed: 0"
                echo
                echo "| Test | Status | Suite | Log | Error |"
                echo "|------|--------|-------|-----|-------|"
                echo
                echo "_No ${title} conformance results were produced (suite skipped, unavailable, or failed before writing a report)._"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          }

          found=0
          append_role_summary vp-verifier "OpenID4VP Verifier"
          append_role_summary vp-wallet "OpenID4VP Wallet"
          append_role_summary vci-wallet "OpenID4VCI Wallet"

          echo "Published OpenID conformance summaries for verifier, OpenID4VP wallet and OpenID4VCI wallet (${found} file(s) found)."

      - name: Stop wallet and verifier conformance tunnels
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/lt_verifier.pid" "$RUNNER_TEMP/lt_vp_wallet.pid" "$RUNNER_TEMP/lt_vci_wallet.pid"; do
            [ -f "$pid_file" ] || continue
            pid=$(cat "$pid_file")
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then kill "$pid" 2>/dev/null || true; fi
          done

      - name: Verify issuer results were produced
        if: ${{ !cancelled() && steps.issuer-tunnel.outcome == 'success' && steps.conformance-tests.outcome == 'success' }}
        # Strict results and executed batch coverage are enforced by the Kotlin runner.
        run: jq -e 'type == "array" and length > 0' "$ISSUER_REPORT_DIR/results.json" >/dev/null

      - name: Stop Issuer2 conformance services
        if: ${{ always() && (inputs.run-issuer-conformance || inputs.run-haip-conformance) }}
        run: |
          for pid_file in "$RUNNER_TEMP/issuer2.pid" "$RUNNER_TEMP/cloudflared-issuer2.pid"; do
            [ -f "$pid_file" ] || continue
            pid=$(cat "$pid_file")
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then kill "$pid" 2>/dev/null || true; fi
          done

      - name: Publish issuer result overview
        if: ${{ always() && (inputs.run-issuer-conformance || inputs.run-haip-conformance) }}
        run: |
          echo '> CI coverage gap: `oid4vci-1_0-issuer-happy-flow-additional-requests` is excluded because its TLS probes reach the Cloudflare Quick Tunnel edge. This run does not establish TLS conformance. Local runs retain this module; strict and batch checks remain enabled.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$ISSUER_REPORT_DIR/results.json" ]; then
            # Publish only identifiers and statuses, not error bodies, credentials or raw logs.
            jq 'map({variantId, status, planId, modules: [.modules[] |
              {testModule, testId, status, result, accepted}]})' \
              "$ISSUER_REPORT_DIR/results.json" > "$ISSUER_DIAGNOSTICS_DIR/results.json"
            jq '{variants: (group_by(.status) | map({status: .[0].status, count: length})),
              batch_modules: ([.[].modules[] | select(.testModule == "oid4vci-1_0-issuer-batch-issuance")]
                | group_by(.result) | map({result: .[0].result, count: length}))}' \
              "$ISSUER_DIAGNOSTICS_DIR/results.json" > "$ISSUER_DIAGNOSTICS_DIR/coverage.json"
            {
              echo '## Issuer conformance results'
              echo '```json'
              cat "$ISSUER_DIAGNOSTICS_DIR/coverage.json"
              echo '```'
              echo 'See the issuer artifact for plan/test IDs and https://conformance.waltid.cloud/logs.html for suite logs.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Issuer conformance did not produce a summary. See the failed setup/test step and diagnostic artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload issuer conformance results
        if: ${{ always() && (inputs.run-issuer-conformance || inputs.run-haip-conformance) }}
        uses: actions/upload-artifact@v7
        with:
          name: issuer-conformance-basic-haip-batch
          if-no-files-found: warn
          path: |
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/identity-revision.txt
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/suite-version.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/results.json
            ${{ env.ISSUER_DIAGNOSTICS_DIR }}/coverage.json

  # Maven publish waits for the default Gradle job and, when requested, the live
  # conformance job. Leaving publish on the gradle job let release/fix-release upload
  # artifacts while conformance was still running or after it had failed.
  publish:
    name: publish
    needs: [gradle, conformance]
    if: >-
      always() && !cancelled()
      && inputs.publish
      && inputs.version != ''
      && needs.gradle.result == 'success'
      && (needs.conformance.result == 'success' || needs.conformance.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Enable Android build
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'waltid-identity/gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable Android build in unified-build root
        if: ${{ inputs.enable-android-build }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Write Google services config
        if: ${{ inputs.enable-android-build }}
        env:
          GOOGLE_SERVICES_PREVIEW_JSON: ${{ secrets.GOOGLE_SERVICES_PREVIEW_JSON }}
          GOOGLE_SERVICES_PRODUCTION_JSON: ${{ secrets.GOOGLE_SERVICES_PRODUCTION_JSON }}
        run: bash waltid-identity/.github/scripts/mobile-ci/write-google-services.sh

      - name: Set version
        run: |
          sed -i "s/1.0.0-SNAPSHOT/${{ inputs.version }}/g" build.gradle.kts

      - name: Publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish --no-daemon
