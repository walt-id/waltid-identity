name: WAL-1585 bounded native window diagnostic

on:
  push:
    branches: [chore/wal-1585-native-animation-diagnostic-20261101]

permissions:
  contents: read
  actions: read
  checks: write

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout exact failing source tuple
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@cba255efcba637f429422c132ccaf46b13b9572b
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: '{"unified":"fe7ad3cfee01dc1107eaad6a7d8bc11b62ba500a","identity":"d234f152a91568b6585aa504edeeb0972184873d","enterprise":"f855ef79f41cb8d85786bb4fbc072c9072969b32","enterprise_license":"89e50887a63586c021b4bb927e5c2c696c229ce1"}'
      - name: Checkout diagnostic instrumentation separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: native-diagnostic
          sparse-checkout: .github/scripts/ci/native-animation-diagnostic.patch
          sparse-checkout-cone-mode: false
      - name: Restore existing release framework
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '13097044488'
          run-id: '41339075557'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wallet-core-artifact
          merge-multiple: true
      - name: Verify producer identity and framework bytes
        working-directory: waltid-identity
        run: python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"
      - name: Apply window logging and bounded case selection
        working-directory: waltid-identity
        run: |
          git apply ../native-diagnostic/.github/scripts/ci/native-animation-diagnostic.patch
          git diff --check
          git diff --stat
      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Diagnose the native unit and mock suites in their ordinary order
        timeout-minutes: 75
        uses: ./waltid-identity/.github/actions/gradle-ios
        with:
          waltid-directory: waltid-identity
          simulator-destination: platform=iOS Simulator,name=iPhone 17,OS=27.0
          wallet-core-artifact: ${{ runner.temp }}/wallet-core-artifact
          run-ios-simulator-tests: 'false'
          run-wallet-sdk-tests: 'false'
          run-native-demo-tests: 'true'
          run-compose-demo-tests: 'false'
          collect-test-diagnostics: on-failure
          collect-test-reports: 'false'
          test-result-artifact-name: native-animation-diagnostic-results
      - name: Preserve diagnostic logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-animation-diagnostic
          path: |
            ios-ci-logs/
            waltid-identity/waltid-applications/waltid-wallet-demo-ios/iosApp/TestResults.xcresult/
          retention-days: 7
          if-no-files-found: error
