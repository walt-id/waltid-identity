name: Create release branch (reusable workflow)

on:
  workflow_call:
    inputs:
      version:
        description: "release version (e.g. 0.20.0)"
        required: true
        type: string
      repository:
        description: "repository to branch (default: current repo)"
        required: false
        type: string
        default: ${{ github.repository }}
      ref:
        description: |
          Branch to create the release branch from. If it exists in the target
          repository it is used, otherwise the repository's default branch (main)
          is used. Defaults to the branch that started the calling workflow.
        required: false
        type: string
        default: ${{ github.ref_name }}
    outputs:
      branch:
        description: "The created branch"
        value: ${{ jobs.branch.outputs.result }}

jobs:
  branch:
    name: Git branch
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Determine ref to branch from
        id: ref
        env:
          REF: ${{ inputs.ref }}
          REPO: ${{ inputs.repository }}
          TOKEN: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
        run: |
          if [ -n "$REF" ] && git ls-remote --exit-code --heads "https://${TOKEN}@github.com/${REPO}.git" "$REF"; then
            echo "Branch '$REF' found in $REPO, branching from it."
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$REF' not found in $REPO, using default branch."
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
      - name: Create and push the release branch
        id: branch
        run: |
          # Derive the release branch from the release version:
          # 0.20.0 -> release/v0.20.x
          minor=$(echo "${{ inputs.version }}" | cut -d. -f1-2)
          branch="release/v${minor}.x"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists, skipping."
          else
            git branch "$branch"
            git push origin "$branch"
          fi
          echo "branch=${branch}" >> $GITHUB_OUTPUT
