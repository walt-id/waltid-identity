name: Build and/or push api docker images (reusable workflow)

on:
  workflow_call:
    inputs:
      version:
        description: "release version"
        required: true
        type: string
      checkout-refs:
        description: "Exact commits to check out, as a JSON object of unified, identity, enterprise and enterprise_license SHAs (defaults to the branch with main fallback)"
        required: false
        type: string
        default: ''
      tags:
        description: 'JSON array of extra tags to apply, e.g. ["stable", "latest"]. The version tag is always applied.'
        required: false
        type: string
        default: '[]'
      publish:
        description: "Specifies whether to publish the images (defaults to false)"
        required: false
        type: boolean
        default: false
      attest-provenance:
        description: "Publish build provenance for release candidate images with exact checkout refs"
        required: false
        type: boolean
        default: false
      artifact:
        description: "Upload docker artifact (defaults to false)"
        required: false
        type: boolean
        default: false

jobs:
  api-docker-matrix:
    uses: ./.github/workflows/load-json.yml
    with:
      jsonpath: ".github/workflows/data/api-docker-matrix.json"

  docker:
    runs-on: ubuntu-latest
    needs: api-docker-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.api-docker-matrix.outputs.json) }}
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          resolved-refs: ${{ inputs.checkout-refs }}
      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Generate Docker tags
        id: tags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXTRA_TAGS: ${{ inputs.tags }}
        run: |
          tags="$(jq -er --arg version "$RELEASE_VERSION" '[$version] + . | join(",")' <<< "$EXTRA_TAGS")"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Require exact checkout refs for provenance
        if: ${{ inputs.attest-provenance && (!inputs.publish || inputs.checkout-refs == '') }}
        run: |
          echo '::error::Build provenance requires publishing from exact checkout refs.'
          exit 1
      - name: Build & Publish Docker images (${{ matrix.image }})
        if: ${{ inputs.publish }}
        run: |
          # --no-configuration-cache: the license-notice tasks pulled in by jib (enterprise-api)
          # invoke Task.project at execution time and are not CC-compatible.
          target=()
          if [ "$ATTEST_PROVENANCE" = true ]; then
            target=(-Djib.to.image="${IMAGE}:${RELEASE_VERSION}" -Djib.outputPaths.digest="$RUNNER_TEMP/jib-image.digest")
          fi
          ./gradlew "$JIB_TASK" \
            --no-configuration-cache \
            -Pversion="$RELEASE_VERSION" \
            -Djib.to.tags="$DOCKER_TAGS" \
            "${target[@]}"
        env:
          ATTEST_PROVENANCE: ${{ inputs.attest-provenance }}
          IMAGE: docker.io/waltid/${{ matrix.image }}
          JIB_TASK: ${{ matrix.commandPath }}:jib
          DOCKER_TAGS: ${{ steps.tags.outputs.tags }}
          RELEASE_VERSION: ${{ inputs.version }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub for provenance
        if: ${{ inputs.attest-provenance }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Record the Jib build provenance
        if: ${{ inputs.attest-provenance }}
        id: provenance
        env:
          IMAGE: docker.io/waltid/${{ matrix.image }}
          RELEASE_VERSION: ${{ inputs.version }}
          JIB_TASK: ${{ matrix.commandPath }}:jib
        run: |
          set -euo pipefail
          digest="$(cat "$RUNNER_TEMP/jib-image.digest")"
          published="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_VERSION}" --format '{{json .Manifest}}' | jq -er '.digest')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || "$digest" != "$published" ]]; then
            echo "::error::Jib digest does not match the published digest of ${IMAGE}:${RELEASE_VERSION}."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg version "$RELEASE_VERSION" --arg task "$JIB_TASK" \
            --arg unified "$(git rev-parse HEAD)" \
            --arg identity "$(git -C waltid-identity rev-parse HEAD)" \
            --arg enterprise "$(git -C waltid-identity-enterprise rev-parse HEAD)" \
            --arg license "$(git -C waltid-identity-enterprise-license rev-parse HEAD)" \
            '{version: $version, gradleTask: $task, checkoutRefs: {
                unified: $unified, identity: $identity, enterprise: $enterprise, enterprise_license: $license
             }} | if all(.checkoutRefs[]; test("^[0-9a-f]{40}$")) then .
                  else error("Missing checkout commit for the Jib build") end' > "$RUNNER_TEMP/jib-build-inputs.json"
      - name: Attest the published image digest
        if: ${{ inputs.attest-provenance }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: docker.io/waltid/${{ matrix.image }}
          subject-digest: ${{ steps.provenance.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the Jib build inputs for the same digest
        if: ${{ inputs.attest-provenance }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: docker.io/waltid/${{ matrix.image }}
          subject-digest: ${{ steps.provenance.outputs.digest }}
          predicate-type: https://github.com/walt-id/waltid-identity/blob/main/.github/workflows/api-docker.yml#jib-build-inputs-v1
          predicate-path: ${{ runner.temp }}/jib-build-inputs.json
          push-to-registry: true
          create-storage-record: false

      - name: Build Docker images (${{ matrix.image }})
        if: ${{ inputs.publish == false && inputs.artifact == true }}
        run: |
          ./gradlew ${{ matrix.commandPath }}:jibDockerBuild \
            --no-configuration-cache \
            -Pversion="$RELEASE_VERSION" \
            -Djib.to.tags=${{ steps.tags.outputs.tags }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Save Docker Image to ${{ matrix.image }}.tar.gz
        if: ${{ inputs.artifact }}
        run: docker save waltid/${{ matrix.image }}:${{ inputs.version }} | gzip > ${{ runner.temp }}/${{ matrix.image }}.tar.gz
        continue-on-error: false
      - name: Upload artifact
        if: ${{ inputs.artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar.gz
          retention-days: 1
