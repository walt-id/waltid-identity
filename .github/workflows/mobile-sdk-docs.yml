name: Mobile SDK API docs

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: "Package the generated Dokka and DocC HTML into the sdk-docs image and publish it (release only)"
        required: false
        type: boolean
        default: false
      version:
        description: "Release version used to tag the sdk-docs image"
        required: false
        type: string
        default: ""
      tags:
        description: 'JSON array of extra tags for the sdk-docs image, e.g. ["stable"]'
        required: false
        type: string
        default: '[]'
      generate-linux-docs:
        description: "Run Linux Dokka and documentation snippet checks"
        required: false
        type: boolean
        default: false
      generate-macos-docs:
        description: "Run macOS iOS ABI checks and Swift DocC generation"
        required: false
        type: boolean
        default: true
      wallet-core-artifact:
        description: "Same-run full release WalletCore artifact from the framework producer"
        required: false
        type: string
        default: ''
      checkout-refs:
        description: "Exact coordinated revisions resolved by the framework producer"
        required: false
        type: string
        default: ''

jobs:
  linux-sdk-docs:
    if: ${{ inputs.generate-linux-docs }}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          ref: ${{ github.head_ref || github.ref_name }}
          identity-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          resolved-refs: ${{ inputs.checkout-refs }}

      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Check mobile SDK documentation snippets
        working-directory: waltid-identity
        run: python3 waltid-libraries/protocols/waltid-wallet-sdk-ios/scripts/check-mobile-wallet-doc-snippets.py

      - name: Generate mobile SDK API docs
        timeout-minutes: 45
        working-directory: waltid-identity
        run: |
          ./gradlew \
            :waltid-libraries:protocols:waltid-openid4vc-wallet-mobile:dokkaGeneratePublicationHtml \
            :waltid-libraries:protocols:waltid-openid4vc-wallet-persistence-mobile:dokkaGeneratePublicationHtml \
            -PenableAndroidBuild=true \
            --console=plain \
            --warning-mode=summary

  mobile-sdk-docs:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.generate-macos-docs }}
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          ref: ${{ github.head_ref || github.ref_name }}
          identity-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          resolved-refs: ${{ inputs.checkout-refs }}

      - name: Configure gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Restore the shared release framework
        if: ${{ inputs.wallet-core-artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.wallet-core-artifact }}
          path: ${{ runner.temp }}/wallet-core-artifact

      - name: Verify the shared release framework
        if: ${{ inputs.wallet-core-artifact != '' }}
        working-directory: waltid-identity
        run: python3 .github/scripts/mobile-ci/wallet-core-artifact.py restore --artifact-dir "$RUNNER_TEMP/wallet-core-artifact"

      - name: Check mobile SDK API contract
        timeout-minutes: 60
        working-directory: waltid-identity
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          SWIFT_PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --prune --unshallow origin
          fi
          git fetch --prune origin main
          if [ -n "$SWIFT_PARITY_BASE_SHA" ]; then
            git fetch origin "$SWIFT_PARITY_BASE_SHA"
          fi
          ./gradlew \
            :build-logic:test \
            checkKotlinAbi \
            :waltid-libraries:protocols:waltid-openid4vc-wallet-custody-enterprise:testAndroidHostTest \
            -PenableAndroidBuild=true \
            -PenableIosBuild=true \
            --no-daemon \
            --console=plain
          # A stacked base branch may be merged and deleted while this job runs.
          if [ -n "$SWIFT_PARITY_BASE_SHA" ]; then
            scripts/check-mobile-swift-parity-decision.sh --base-ref "$SWIFT_PARITY_BASE_SHA"
          else
            scripts/check-mobile-swift-parity-decision.sh
          fi

      - name: Generate mobile SDK API docs
        timeout-minutes: 45
        uses: ./waltid-identity/.github/actions/gradle-mobile-sdk-docs
        with:
          waltid-directory: 'waltid-identity'
          generate-dokka: true
          check-snippets: ${{ inputs.generate-linux-docs && 'false' || 'true' }}
          skip-wallet-core-assemble: ${{ inputs.wallet-core-artifact != '' && 'true' || 'false' }}

      - name: Collect generated HTML
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          base="waltid-identity/waltid-libraries/protocols"
          out="$RUNNER_TEMP/sdk-docs-html"
          rm -rf "$out"
          mkdir -p "$out/wallet-mobile" "$out/wallet-persistence-mobile"
          cp -R "$base/waltid-openid4vc-wallet-mobile/build/dokka/html/." "$out/wallet-mobile/"
          cp -R "$base/waltid-openid4vc-wallet-persistence-mobile/build/dokka/html/." "$out/wallet-persistence-mobile/"
          # Landing page linking the two module docs.
          cat > "$out/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>walt.id Mobile SDK API docs</title></head>
          <body>
          <h1>walt.id Mobile SDK API documentation</h1>
          <ul>
            <li><a href="wallet-mobile/index.html">OpenID4VC Wallet (mobile)</a></li>
            <li><a href="wallet-persistence-mobile/index.html">OpenID4VC Wallet persistence (mobile)</a></li>
          </ul>
          </body>
          </html>
          HTML

      - name: Upload SDK docs HTML artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-artifact@v7
        with:
          name: sdk-docs-html
          path: ${{ runner.temp }}/sdk-docs-html
          retention-days: 1

      - name: Package Swift WalletSDK DocC archive
        working-directory: waltid-identity
        run: |
          tar -czf \
            waltid-libraries/protocols/waltid-wallet-sdk-ios/build/docc/WalletSDK.doccarchive.tar.gz \
            -C waltid-libraries/protocols/waltid-wallet-sdk-ios/build/docc \
            WalletSDK.doccarchive

      - name: Upload Swift WalletSDK DocC archive
        uses: actions/upload-artifact@v7
        with:
          name: walletsdk-doccarchive
          path: waltid-identity/waltid-libraries/protocols/waltid-wallet-sdk-ios/build/docc/WalletSDK.doccarchive.tar.gz
          if-no-files-found: error

      - name: Transform Swift WalletSDK DocC archive for static hosting
        if: ${{ inputs.deploy }}
        working-directory: waltid-identity
        run: |
          out="$RUNNER_TEMP/ios-sdk-docs-html"
          rm -rf "$out"
          xcrun docc process-archive transform-for-static-hosting \
            waltid-libraries/protocols/waltid-wallet-sdk-ios/build/docc/WalletSDK.doccarchive \
            --output-path "$out"
          # upload-artifact rejects DocC operator pages whose names contain ':' (e.g. !=(_:_:).json).
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/ios-sdk-docs-html.tar.gz" -C "$out" .

      - name: Upload iOS SDK docs HTML artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sdk-docs-html
          path: ${{ runner.temp }}/ios-sdk-docs-html.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: mobile-sdk-docs
    if: ${{ inputs.deploy == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout waltid-identity
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: waltid-identity
          sparse-checkout: docs/mobile-sdk-api

      - name: Download SDK docs HTML artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-docs-html
          path: waltid-identity/docs/mobile-sdk-api/html

      - name: Download iOS SDK docs HTML artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-sdk-docs-html
          path: ${{ runner.temp }}/ios-sdk-docs-html

      - name: Extract iOS SDK docs HTML
        run: |
          mkdir -p waltid-identity/docs/mobile-sdk-api/ios-html
          tar -xzf "$RUNNER_TEMP/ios-sdk-docs-html/ios-sdk-docs-html.tar.gz" \
            -C waltid-identity/docs/mobile-sdk-api/ios-html

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker tags
        id: tags
        run: |
          TAGS="waltid/waltid-sdk-docs:${{ inputs.version }}"
          for tag in $(echo '${{ inputs.tags }}' | jq -r '.[]'); do
            TAGS="$TAGS, waltid/waltid-sdk-docs:$tag"
          done
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push sdk-docs image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          file: waltid-identity/docs/mobile-sdk-api/Dockerfile
          context: waltid-identity/docs/mobile-sdk-api
          tags: ${{ steps.tags.outputs.tags }}
