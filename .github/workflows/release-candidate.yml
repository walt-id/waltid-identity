name: Release candidate on manual push

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version'
        required: true

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
      preferred: ${{ inputs.release_version }}
  enterprise-ref:
    name: Resolve enterprise branch ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      license-ref: ${{ steps.ref.outputs.license-ref }}
    steps:
      - name: Determine ref to dispatch on
        id: ref
        env:
          REF: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://${TOKEN}@github.com/walt-id/waltid-identity-enterprise.git" "$REF"; then
            echo "Branch '$REF' found in waltid-identity-enterprise, using it."
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$REF' not found in waltid-identity-enterprise, using main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --heads "https://${TOKEN}@github.com/walt-id/waltid-identity-enterprise-license.git" "$REF"; then
            echo "Branch '$REF' found in waltid-identity-enterprise-license, using it."
            echo "license-ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$REF' not found in waltid-identity-enterprise-license, using main."
            echo "license-ref=main" >> "$GITHUB_OUTPUT"
          fi
  gradle:
    uses: ./.github/workflows/gradle.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      enable-android-build: true
      publish: true
      cacheless: true
      run-conformance: true
      run-issuer-conformance: true
      run-haip-conformance: true
      report-check-name: 'gradle / gradle (ubuntu-22.04)'
      conformance-report-check-name: 'gradle / conformance (ubuntu-22.04)'
  integration-test-aws:
    name: Integration Tests - AWS
    runs-on: ubuntu-latest
    needs: enterprise-ref
    steps:
      - name: Dispatch integration-test-aws.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: integration-test-aws.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
  integration-test-azure:
    name: Integration Tests - Azure
    runs-on: ubuntu-latest
    needs: enterprise-ref
    steps:
      - name: Dispatch integration-test-azure.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: integration-test-azure.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
  docker:
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      tags: '[]'
      publish: true
  api-docker:
    uses: ./.github/workflows/api-docker.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      tags: '[]'
      publish: true
  sdk-docs:
    uses: ./.github/workflows/mobile-sdk-docs.yml
    secrets: inherit
    needs: version
    with:
      deploy: true
      version: ${{ needs.version.outputs.release_version }}
      tags: '[]'
  deploy-license:
    name: Deploy license (staging)
    runs-on: ubuntu-latest
    needs: [ version, enterprise-ref, gradle, docker, api-docker, sdk-docs, integration-test-aws, integration-test-azure ]
    steps:
      - name: Dispatch deploy-k8s.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: deploy-k8s.yml
          repo: walt-id/waltid-identity-enterprise-license
          ref: ${{ needs.enterprise-ref.outputs.license-ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: '{"version": "${{ needs.version.outputs.release_version }}", "k8s_file": "waltid-license-server/k8s/deployment-dev.yaml"}'
  deploy:
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    needs: [ version, deploy-license ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      deployment: dev
      oss: test-identity-main
      enterprise: test-enterprise-main
