name: Build and test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  checks: write
  pull-requests: read

jobs:
  wallet-visual-browser:
    needs: macos-eligibility
    if: ${{ needs.macos-eligibility.outputs.run-visual-browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the production browser host
        run: >-
          python3 .github/scripts/mobile-ci/run-ios-phase.py
          --output-dir waltid-applications/waltid-wallet-demo-compose/webApp/build/reports/browser-visual/timings
          browser-build ./gradlew :waltid-applications:waltid-wallet-demo-compose:webApp:wasmJsBrowserDistribution
          -PenableAndroidBuild=false -PenableIosBuild=false -PenableWalletDemoComposeWeb=true
          --max-workers=2 --console=plain
      - name: Install the pinned browser test tools
        working-directory: waltid-applications/waltid-wallet-demo-compose/webApp/visual
        run: npm ci
      - name: Compare every browser catalogue state
        working-directory: waltid-applications/waltid-wallet-demo-compose/webApp/visual
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: >-
          python3 ../../../../.github/scripts/mobile-ci/run-ios-phase.py
          --output-dir ../build/reports/browser-visual/timings browser-compare npm test
      - name: Retain browser comparisons and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wallet-visual-browser-${{ github.run_attempt }}
          path: waltid-applications/waltid-wallet-demo-compose/webApp/build/reports/browser-visual
          if-no-files-found: error
          retention-days: 14

  wallet-visual-android:
    needs: macos-eligibility
    if: ${{ needs.macos-eligibility.outputs.run-visual-android == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the coordinated source revisions
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          ref: ${{ github.head_ref || github.ref_name }}
          identity-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./waltid-identity/.github/actions/gradle-setup-action
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Compare Compose Android visual references
        uses: ./waltid-identity/.github/actions/wallet-visual
        with:
          renderer: android

  macos-predicate-tests:
    name: CI eligibility and visual contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Test macOS lane predicates
        run: .github/scripts/ci/test-macos-lane-predicates.sh
      - name: Test CI eligibility
        run: python3 -m unittest discover -s .github/scripts/ci -p 'test_*.py'
      - name: Test iOS CI helpers
        run: python3 -m unittest discover -s .github/scripts/mobile-ci -p 'test_*.py'
      - name: Test Swift facade parity gate
        run: scripts/test-mobile-swift-parity-gate.sh
      - name: Test physical controller without hardware
        run: python3 -m unittest discover -s scripts/proximity-physical -p 'test_*.py'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check reporting contracts and the committed catalogue
        run: |
          python3 -m venv "$RUNNER_TEMP/wallet-visual-python"
          "$RUNNER_TEMP/wallet-visual-python/bin/pip" install -r waltid-applications/waltid-wallet-demo-test-fixtures/visual/requirements.txt
          "$RUNNER_TEMP/wallet-visual-python/bin/python" -m unittest discover -s waltid-applications/waltid-wallet-demo-test-fixtures/visual -p 'test_*.py'
          "$RUNNER_TEMP/wallet-visual-python/bin/python" waltid-applications/waltid-wallet-demo-test-fixtures/visual/gallery.py --check-index
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check ordinary and coordinated verification defaults
        run: >-
          ./gradlew -p build-logic test --tests WalletVisualVerificationTest --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.compiler.execution.strategy=in-process
      - name: Generate the PR reference gallery
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          "$RUNNER_TEMP/wallet-visual-python/bin/python" waltid-applications/waltid-wallet-demo-test-fixtures/visual/gallery.py
          --base "$PR_BASE" --head "$PR_HEAD" --repository "$PR_BASE_REPOSITORY"
          --head-repository "$PR_HEAD_REPOSITORY" --output build/reports/wallet-gallery
      - name: Retain the reference gallery
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: wallet-reference-gallery
          path: build/reports/wallet-gallery
          if-no-files-found: error
          retention-days: 14

  android-eligibility:
    uses: ./.github/workflows/android-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  macos-eligibility:
    uses: ./.github/workflows/macos-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  conformance-eligibility:
    uses: ./.github/workflows/conformance-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  crypto2-eligibility:
    uses: ./.github/workflows/platform-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
      platform-name: Crypto2
      platform-label: ci:crypto2
      path-patterns: |
        [
          ".github/workflows/build.yml",
          ".github/workflows/crypto2-platforms.yml",
          ".github/workflows/platform-eligibility.yml",
          ".github/actions/checkout-repos/*",
          ".github/actions/gradle-setup-action/*",
          "build-logic/*",
          "build.gradle.kts",
          "gradle/*",
          "gradle.properties",
          "gradlew",
          "settings.gradle.kts",
          "waltid-libraries/crypto/waltid-crypto2/*",
          "waltid-libraries/crypto/waltid-crypto2-*/*",
          "waltid-libraries/crypto/waltid-jose/*",
          "waltid-libraries/crypto/waltid-cose/*"
        ]
  cacheless-eligibility:
    uses: ./.github/workflows/cacheless-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  gradle-eligibility:
    runs-on: ubuntu-22.04
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether the Linux Gradle job should run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before || '' }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/ci/decide-gradle-eligibility.sh
  sdk-docs:
    uses: ./.github/workflows/mobile-sdk-docs.yml
    needs: macos-eligibility
    if: ${{ always() && !cancelled() && needs.macos-eligibility.outputs.run-sdk-docs == 'true' }}
    secrets: inherit
    with:
      generate-linux-docs: true
      generate-macos-docs: false
  ios-tests:
    uses: ./.github/workflows/gradle-macos.yml
    needs: macos-eligibility
    if: ${{ needs.macos-eligibility.outputs.should-run == 'true' }}
    secrets: inherit
    with:
      job_name_prefix: ios-tests
      run-ios-simulator: ${{ needs.macos-eligibility.outputs.run-ios-simulator == 'true' }}
      run-native: ${{ needs.macos-eligibility.outputs.run-native == 'true' }}
      run-compose: ${{ needs.macos-eligibility.outputs.run-compose == 'true' }}
      run-enterprise: ${{ needs.macos-eligibility.outputs.run-enterprise == 'true' }}
      run-sdk-docs: ${{ needs.macos-eligibility.outputs.run-sdk-docs == 'true' }}
      run-visual-compose: ${{ needs.macos-eligibility.outputs.run-visual-compose == 'true' }}
      run-visual-native: ${{ needs.macos-eligibility.outputs.run-visual-native == 'true' }}
  android-device-tests:
    uses: ./.github/workflows/android-device-tests.yml
    needs: android-eligibility
    if: ${{ needs.android-eligibility.outputs.should-run == 'true' }}
    secrets: inherit
    with:
      job_name_prefix: android-device-tests
  crypto2-platform-tests:
    uses: ./.github/workflows/crypto2-platforms.yml
    needs: crypto2-eligibility
    if: ${{ needs.crypto2-eligibility.outputs.should-run == 'true' }}
    secrets: inherit
  gradle-build:
    uses: ./.github/workflows/gradle.yml
    secrets: inherit
    needs: [android-eligibility, conformance-eligibility, cacheless-eligibility, gradle-eligibility]
    if: ${{ needs.gradle-eligibility.outputs.should-run == 'true' || (needs.conformance-eligibility.outputs.should-run == 'true' && github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:conformance') || contains(github.event.pull_request.labels.*.name, 'ci:issuer-conformance'))) }}
    with:
      enable-android-build: ${{ needs.android-eligibility.outputs.should-run == 'true' }}
      cacheless: ${{ needs.cacheless-eligibility.outputs.should-run == 'true' }}
      report-check-name: 'gradle-build / gradle (ubuntu-22.04)'
      conformance-report-check-name: 'gradle-build / wallet/verifier-conformance'
      run-conformance: ${{ needs.conformance-eligibility.outputs.should-run == 'true' }}
      run-issuer-conformance: ${{ needs.conformance-eligibility.outputs.should-run == 'true' }}
      run-payment-demo: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:mobile-dc-api') }}
  distribute-android-preview:
    name: distribute-android-preview
    needs: ci-gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success' }}
    uses: ./.github/workflows/distribute-android-firebase.yml
    secrets: inherit
    with:
      variant: preview
      version_name: 1.0.0-dev

  ci-gate:
    name: ci-gate
    if: always()
    timeout-minutes: 5
    needs:
      - macos-predicate-tests
      - wallet-visual-android
      - wallet-visual-browser
      - android-eligibility
      - macos-eligibility
      - conformance-eligibility
      - crypto2-eligibility
      - cacheless-eligibility
      - gradle-eligibility
      - gradle-build
      - android-device-tests
      - ios-tests
      - sdk-docs
      - crypto2-platform-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Summarize live conformance selection
        env:
          SELECTED: ${{ needs.conformance-eligibility.outputs.should-run }}
          REASON: ${{ needs.conformance-eligibility.outputs.reason }}
          DEFERRED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:conformance-deferred') && !contains(github.event.pull_request.labels.*.name, 'ci:conformance') && !contains(github.event.pull_request.labels.*.name, 'ci:issuer-conformance') }}
        run: |
          set -euo pipefail
          {
            echo '## Live OpenID conformance'
            echo
            if [[ "$DEFERRED" == true && "$SELECTED" == false ]]; then
              echo "**Deferred for this run** by \`ci:conformance-deferred\`."
              echo "A successful \`ci-gate\` is not evidence that live conformance passed."
              echo "The maintainer must record a passing run for the integrated revision before it enters \`main\`."
            else
              echo "Requested: \`${SELECTED:-unavailable}\`. See the verifier, wallet and issuer conformance jobs for the result."
            fi
            echo
            echo "Selection reason: ${REASON:-eligibility decision unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reject cancelled workflow
        if: cancelled()
        run: |
          echo '::error::Workflow was cancelled; coverage is incomplete.'
          exit 1
      - name: Evaluate merge gate
        if: always()
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          fail=0
          job_results="$(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          while IFS= read -r line; do
            job="${line%%=*}"
            result="${line#*=}"
            echo "$job: $result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$job ended with $result"
                fail=1
                ;;
            esac
          done <<< "$job_results"
          exit "$fail"
