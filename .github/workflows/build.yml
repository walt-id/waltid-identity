name: Build and test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: &docs-and-assets
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.ico'
      - '**/LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore: *docs-and-assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  checks: write
  pull-requests: read

jobs:
  macos-predicate-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test macOS lane predicates
        run: .github/scripts/ci/test-macos-lane-predicates.sh
  android-eligibility:
    uses: ./.github/workflows/android-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  macos-eligibility:
    uses: ./.github/workflows/macos-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  issuer-conformance-eligibility:
    uses: ./.github/workflows/issuer-conformance-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  crypto2-eligibility:
    uses: ./.github/workflows/platform-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
      platform-name: Crypto2
      platform-label: ci:crypto2
      path-patterns: |
        [
          ".github/workflows/build.yml",
          ".github/workflows/crypto2-platforms.yml",
          ".github/workflows/platform-eligibility.yml",
          ".github/actions/checkout-repos/*",
          ".github/actions/gradle-setup-action/*",
          "build-logic/*",
          "build.gradle.kts",
          "gradle/*",
          "gradle.properties",
          "gradlew",
          "settings.gradle.kts",
          "waltid-libraries/crypto/waltid-crypto2/*",
          "waltid-libraries/crypto/waltid-crypto2-*/*",
          "waltid-libraries/crypto/waltid-jose/*",
          "waltid-libraries/crypto/waltid-cose/*"
        ]
  cacheless-eligibility:
    uses: ./.github/workflows/cacheless-eligibility.yml
    with:
      event-name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-head-repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
      pr-labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
      pr-draft: ${{ github.event.pull_request.draft || false }}
  sdk-docs:
    uses: ./.github/workflows/mobile-sdk-docs.yml
    needs: [macos-eligibility, ios-tests]
    if: ${{ always() && !cancelled() && needs.macos-eligibility.outputs.run-sdk-docs == 'true' }}
    secrets: inherit
    with:
      generate-linux-docs: true
      generate-macos-docs: true
      restore-wallet-core-artifact: ${{ needs.ios-tests.result == 'success' && (needs.macos-eligibility.outputs.run-native == 'true' || needs.macos-eligibility.outputs.run-compose == 'true') }}
  ios-tests:
    uses: ./.github/workflows/gradle-macos.yml
    needs: macos-eligibility
    if: ${{ needs.macos-eligibility.outputs.run-ios-simulator == 'true' || needs.macos-eligibility.outputs.run-native == 'true' || needs.macos-eligibility.outputs.run-compose == 'true' || needs.macos-eligibility.outputs.run-enterprise == 'true' }}
    secrets: inherit
    with:
      job_name_prefix: ios-tests
      run-ios-simulator: ${{ needs.macos-eligibility.outputs.run-ios-simulator == 'true' }}
      run-native: ${{ needs.macos-eligibility.outputs.run-native == 'true' }}
      run-compose: ${{ needs.macos-eligibility.outputs.run-compose == 'true' }}
      run-enterprise: ${{ needs.macos-eligibility.outputs.run-enterprise == 'true' }}
  android-device-tests:
    uses: ./.github/workflows/android-device-tests.yml
    needs: android-eligibility
    if: ${{ needs.android-eligibility.outputs.should-run == 'true' }}
    secrets: inherit
    with:
      job_name_prefix: android-device-tests
  crypto2-platform-tests:
    uses: ./.github/workflows/crypto2-platforms.yml
    needs: crypto2-eligibility
    if: ${{ needs.crypto2-eligibility.outputs.should-run == 'true' }}
    secrets: inherit
  gradle-build:
    uses: ./.github/workflows/gradle.yml
    secrets: inherit
    needs: [android-eligibility, issuer-conformance-eligibility, cacheless-eligibility]
    with:
      enable-android-build: ${{ needs.android-eligibility.outputs.should-run == 'true' }}
      cacheless: ${{ needs.cacheless-eligibility.outputs.should-run == 'true' }}
      report-check-name: 'gradle-build / gradle (ubuntu-22.04)'
      conformance-report-check-name: 'gradle-build / conformance (ubuntu-22.04)'
      run-issuer-conformance: ${{ needs.issuer-conformance-eligibility.outputs.should-run == 'true' }}
      run-haip-conformance: ${{ needs.issuer-conformance-eligibility.outputs.should-run == 'true' }}
  ci-gate:
    name: ci-gate
    if: always() && !cancelled()
    needs:
      - macos-predicate-tests
      - android-eligibility
      - macos-eligibility
      - issuer-conformance-eligibility
      - crypto2-eligibility
      - cacheless-eligibility
      - gradle-build
      - android-device-tests
      - ios-tests
      - sdk-docs
      - crypto2-platform-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Evaluate merge gate
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r line; do
            job="${line%%=*}"
            result="${line#*=}"
            echo "$job: $result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$job ended with $result"
                fail=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          exit "$fail"
