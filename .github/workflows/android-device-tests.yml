name: Android device tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      job_name_prefix:
        description: 'Caller job id, used to build the check job name (empty when run standalone).'
        type: string
        required: false
        default: ''

permissions:
  checks: write

jobs:
  android-device-test-phase:
    name: android-device-tests (${{ matrix.phase }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        phase: [wallet-mobile, compose-demo, dc-api-compose, enterprise-mobile]
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d123dc039bd55e193b3d54350791868fcfa6ac04
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          ref: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@c95b601fc5095d5668eb8c906af992d8e00ed513

      - name: Enable Android build in identity repo
        uses: walt-id/waltid-identity/.github/actions/set-properties@00d4e55e9865cf17c6703d926dce4a4f6e1d404a
        with:
          file: 'waltid-identity/gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable Android build in unified-build root
        uses: walt-id/waltid-identity/.github/actions/set-properties@00d4e55e9865cf17c6703d926dce4a4f6e1d404a
        with:
          file: 'gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore configured DC API AVD
        if: matrix.phase == 'dc-api-compose'
        id: dc-api-avd-cache
        uses: actions/cache/restore@v4
        with:
          # Cache only the configured AVD disk. The key is deliberately explicit about the complete
          # emulator substrate; the manifest written during preparation verifies the same values on
          # every consumer job. No adb host state or Quick Boot snapshot is reusable across jobs.
          path: |
            ~/.android/avd/*
          key: dc-api-avd-v2-${{ runner.os }}-api37-x86_64-pixel7-playstore_ps16k-emulator-37.1.11-platform-tools-37.0.1-system-image-6-${{ hashFiles('waltid-identity/.github/scripts/mobile-ci/configure-android-device-phase.sh', 'waltid-identity/.github/scripts/mobile-ci/prepare-android-dc-api-device.sh', 'waltid-identity/.github/scripts/mobile-ci/prepare-android-dc-api-avd.sh') }}

      - name: Report DC API AVD cache state
        if: matrix.phase == 'dc-api-compose'
        run: |
          echo "DC API AVD cache hit: ${{ steps.dc-api-avd-cache.outputs.cache-hit || 'false' }}"

      - name: Configure Android device test phase
        id: android-device-phase
        run: ./waltid-identity/.github/scripts/mobile-ci/configure-android-device-phase.sh "${{ matrix.phase }}"

      - name: Preinstall Android emulator SDK packages
        if: matrix.phase != 'dc-api-compose'
        shell: bash
        run: |
          set -euo pipefail

          retry_sdkmanager_install() {
            local attempt
            for attempt in 1 2 3; do
              echo "sdkmanager install attempt ${attempt}: $*"
              if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$@" --channel=0; then
                return 0
              fi

              if [ "$attempt" -eq 3 ]; then
                return 1
              fi

              sleep $((attempt * 20))
            done
          }

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          retry_sdkmanager_install 'build-tools;37.0.0' platform-tools 'platforms;android-34' "platforms;android-${{ steps.android-device-phase.outputs.emulator_api_level }}"
          retry_sdkmanager_install emulator
          retry_sdkmanager_install "system-images;android-${{ steps.android-device-phase.outputs.emulator_api_level }};${{ steps.android-device-phase.outputs.emulator_target }};x86_64"

      - name: Build Enterprise Android mobile test artifacts
        if: matrix.phase == 'enterprise-mobile'
        run: ./waltid-identity/.github/scripts/mobile-ci/prepare-enterprise-android-mobile-tests.sh

      - name: Prepare configured DC API AVD baseline
        if: matrix.phase == 'dc-api-compose' && steps.dc-api-avd-cache.outputs.cache-hit != 'true'
        id: dc-api-avd-preparation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ steps.android-device-phase.outputs.emulator_api_level }}
          arch: x86_64
          avd-name: ${{ steps.android-device-phase.outputs.emulator_avd_name }}
          force-avd-creation: false
          profile: ${{ steps.android-device-phase.outputs.emulator_profile }}
          target: ${{ steps.android-device-phase.outputs.emulator_target }}
          emulator-boot-timeout: 600
          emulator-options: ${{ steps.android-device-phase.outputs.emulator_options }}
          disable-animations: true
          script: ./waltid-identity/.github/scripts/mobile-ci/prepare-android-dc-api-avd.sh

      - name: Save configured DC API AVD baseline
        if: matrix.phase == 'dc-api-compose' && steps.dc-api-avd-cache.outputs.cache-hit != 'true' && steps.dc-api-avd-preparation.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
          key: dc-api-avd-v2-${{ runner.os }}-api37-x86_64-pixel7-playstore_ps16k-emulator-37.1.11-platform-tools-37.0.1-system-image-6-${{ hashFiles('waltid-identity/.github/scripts/mobile-ci/configure-android-device-phase.sh', 'waltid-identity/.github/scripts/mobile-ci/prepare-android-dc-api-device.sh', 'waltid-identity/.github/scripts/mobile-ci/prepare-android-dc-api-avd.sh') }}

      - name: Run Android device tests
        if: matrix.phase != 'dc-api-compose'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.android-device-phase.outputs.emulator_api_level }}
          arch: x86_64
          # Must match the system image the preinstall step resolved for this phase.
          target: ${{ steps.android-device-phase.outputs.emulator_target }}
          emulator-options: ${{ steps.android-device-phase.outputs.emulator_options }}
          disable-animations: true
          script: ${{ steps.android-device-phase.outputs.script }}

      - name: Run Digital Credentials device test
        if: matrix.phase == 'dc-api-compose'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ steps.android-device-phase.outputs.emulator_api_level }}
          arch: x86_64
          avd-name: ${{ steps.android-device-phase.outputs.emulator_avd_name }}
          force-avd-creation: false
          profile: ${{ steps.android-device-phase.outputs.emulator_profile }}
          target: ${{ steps.android-device-phase.outputs.emulator_target }}
          emulator-boot-timeout: 600
          emulator-options: ${{ steps.android-device-phase.outputs.emulator_test_options }}
          disable-animations: true
          script: ${{ steps.android-device-phase.outputs.script }}

      - name: Publish Android device test report
        if: always() && steps.android-device-phase.outputs.report_paths != ''
        uses: mikepenz/action-junit-report@v6
        with:
          update_check: true
          job_name: ${{ inputs.job_name_prefix != '' && format('{0} / ', inputs.job_name_prefix) || '' }}android-device-tests (${{ matrix.phase }})
          check_name: Android Device Test Report (${{ matrix.phase }})
          report_paths: ${{ steps.android-device-phase.outputs.report_paths }}
          detailed_summary: true
          include_passed: false
          include_skipped: false
          require_tests: true

      - name: Upload Android device test reports
        if: always() && steps.android-device-phase.outputs.artifact_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports-${{ matrix.phase }}
          path: ${{ steps.android-device-phase.outputs.artifact_paths }}
          retention-days: 30
