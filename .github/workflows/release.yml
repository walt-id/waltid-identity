name: Release on manual push

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version'
        required: true

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
      preferred: ${{ inputs.release_version }}
  enterprise-ref:
    name: Resolve enterprise branch ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Determine ref to dispatch on
        id: ref
        env:
          REF: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://${TOKEN}@github.com/walt-id/waltid-identity-enterprise.git" "$REF"; then
            echo "Branch '$REF' found in waltid-identity-enterprise, using it."
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$REF' not found in waltid-identity-enterprise, using main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
  gradle:
    uses: ./.github/workflows/gradle.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      enable-android-build: true
      publish: true
      cacheless: true
      run-issuer-conformance: true
      run-haip-conformance: true
      report-check-name: 'gradle / gradle (ubuntu-22.04)'
      conformance-report-check-name: 'gradle / conformance (ubuntu-22.04)'
  integration-test-aws:
    name: Integration Tests - AWS
    runs-on: ubuntu-latest
    needs: enterprise-ref
    steps:
      - name: Dispatch integration-test-aws.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: integration-test-aws.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
  integration-test-azure:
    name: Integration Tests - Azure
    runs-on: ubuntu-latest
    needs: enterprise-ref
    steps:
      - name: Dispatch integration-test-azure.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: integration-test-azure.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
  docker:
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      tags: '["stable", "latest"]'
      publish: true
  api-docker:
    uses: ./.github/workflows/api-docker.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      tags: '["stable", "latest"]'
      publish: true
  sdk-docs:
    uses: ./.github/workflows/mobile-sdk-docs.yml
    secrets: inherit
    needs: version
    with:
      deploy: true
      version: ${{ needs.version.outputs.release_version }}
      tags: '["stable", "latest"]'
  enterprise-image-digests:
    name: Resolve enterprise image digests
    runs-on: ubuntu-latest
    needs: [ version, api-docker, docker ]
    outputs:
      api-index-digest: ${{ steps.digest.outputs.api }}
      ui-index-digest: ${{ steps.digest.outputs.ui }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve published image index digests
        id: digest
        env:
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail
          API_DIGEST="$(docker buildx imagetools inspect "waltid/waltid-enterprise-api:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')"
          UI_DIGEST="$(docker buildx imagetools inspect "waltid/waltid-enterprise-ui:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "api=${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ui=${UI_DIGEST}" >> "$GITHUB_OUTPUT"
  enterprise-supply-chain:
    name: Enterprise supply chain
    runs-on: ubuntu-latest
    needs: [ enterprise-ref, enterprise-image-digests ]
    steps:
      - name: Dispatch enterprise-supply-chain.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: enterprise-supply-chain.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: '{"api-index-digest": "${{ needs.enterprise-image-digests.outputs.api-index-digest }}", "ui-index-digest": "${{ needs.enterprise-image-digests.outputs.ui-index-digest }}", "version": "${{ needs.version.outputs.release_version }}"}'
  deploy-license:
    name: Deploy license
    runs-on: ubuntu-latest
    needs: [ version, enterprise-ref, gradle, docker, api-docker, sdk-docs, integration-test-aws, integration-test-azure ]
    if: ${{ !contains(needs.version.outputs.release_version, 'PRE-RELEASE') }}
    steps:
      - name: Dispatch deploy-k8s-license.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: deploy-k8s-license.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: '{"version": "${{ needs.version.outputs.release_version }}"}'
  deploy:
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    needs: [ version, deploy-license ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      deployment: ${{ contains(needs.version.outputs.release_version, 'PRE-RELEASE') && 'dev' || 'prod' }}
      oss: ${{ contains(needs.version.outputs.release_version, 'PRE-RELEASE') && 'test-identity-main' || 'identity-main' }}
      enterprise: ${{ contains(needs.version.outputs.release_version, 'PRE-RELEASE') && 'test-enterprise-main' || 'enterprise-main' }}
  branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') && !contains(needs.version.outputs.release_version, 'PRE-RELEASE') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
  enterprise-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') && !contains(needs.version.outputs.release_version, 'PRE-RELEASE') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-identity-enterprise
  docs-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') && !contains(needs.version.outputs.release_version, 'PRE-RELEASE') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-docs
  quickstart-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') && !contains(needs.version.outputs.release_version, 'PRE-RELEASE') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-enterprise-quickstart
  unified-build-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') && !contains(needs.version.outputs.release_version, 'PRE-RELEASE') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-unified-build
  tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
  enterprise-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-identity-enterprise
  docs-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-docs
  quickstart-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-enterprise-quickstart
  unified-build-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-unified-build
  release:
    uses: ./.github/workflows/create-release.yml
    secrets: inherit
    needs: [ version, tag ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      tag: ${{ needs.tag.outputs.tag }}
  enterprise-release:
    name: Create Enterprise Release
    runs-on: ubuntu-latest
    needs: [ enterprise-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-identity-enterprise
          tag_name: ${{ needs.enterprise-tag.outputs.tag }}
          prerelease: ${{ contains(needs.enterprise-tag.outputs.tag, 'PRE-RELEASE') }}
  docs-release:
    name: Create Docs Release
    runs-on: ubuntu-latest
    needs: [ docs-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-docs
          tag_name: ${{ needs.docs-tag.outputs.tag }}
          prerelease: ${{ contains(needs.docs-tag.outputs.tag, 'PRE-RELEASE') }}
  quickstart-release:
    name: Create Quickstart Release
    runs-on: ubuntu-latest
    needs: [ quickstart-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-enterprise-quickstart
          tag_name: ${{ needs.quickstart-tag.outputs.tag }}
          prerelease: ${{ contains(needs.quickstart-tag.outputs.tag, 'PRE-RELEASE') }}
  unified-build-release:
    name: Create Unified Build Release
    runs-on: ubuntu-latest
    needs: [ unified-build-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-unified-build
          tag_name: ${{ needs.unified-build-tag.outputs.tag }}
          prerelease: ${{ contains(needs.unified-build-tag.outputs.tag, 'PRE-RELEASE') }}
