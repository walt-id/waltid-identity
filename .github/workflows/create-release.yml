name: Create release with APK asset (reusable workflow)

on:
  workflow_call:
    inputs:
      version:
        description: "release version (used to name the APK asset)"
        required: true
        type: string
      tag:
        description: "release tag to create and attach the APK to"
        required: true
        type: string
      make_latest:
        description: "Whether to mark this release as latest"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Detect compose app module
        id: detect
        run: |
          set -euo pipefail
          module_dir="waltid-identity/waltid-applications/waltid-wallet-demo-compose/androidApp"
          if [ -d "$module_dir" ]; then
            echo "Compose app module found, APK will be built."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Compose app module not present in this version; skipping APK build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure gradle
        if: ${{ steps.detect.outputs.exists == 'true' }}
        uses: ./waltid-identity/.github/actions/gradle-setup-action

      - name: Enable Android build in identity repo
        if: ${{ steps.detect.outputs.exists == 'true' }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'waltid-identity/gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Enable Android build in unified-build root
        if: ${{ steps.detect.outputs.exists == 'true' }}
        uses: ./waltid-identity/.github/actions/set-properties
        with:
          file: 'gradle.properties'
          properties: 'enableAndroidBuild=true'

      - name: Write Google services config
        if: ${{ steps.detect.outputs.exists == 'true' }}
        env:
          GOOGLE_SERVICES_PREVIEW_JSON: ${{ secrets.GOOGLE_SERVICES_PREVIEW_JSON }}
          GOOGLE_SERVICES_PRODUCTION_JSON: ${{ secrets.GOOGLE_SERVICES_PRODUCTION_JSON }}
        run: |
          set -euo pipefail
          script="waltid-identity/.github/scripts/mobile-ci/write-google-services.sh"
          if [ -f "$script" ]; then
            bash "$script"
          else
            echo "::notice::Google services write script not present on this ref; skipping."
          fi

      - name: Build debug APK
        if: ${{ steps.detect.outputs.exists == 'true' }}
        run: ./gradlew :waltid-applications:waltid-wallet-demo-compose:androidApp:assembleProductionDebug -PappVersionName=${{ inputs.version }} -PappVersionCode=${{ github.run_number }} --no-daemon --console=plain --warning-mode=summary
        env:
          CI: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Locate and rename APK
        id: apk
        if: ${{ steps.detect.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          apk=$(find waltid-identity/waltid-applications/waltid-wallet-demo-compose/androidApp/build/outputs/apk/production/debug -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          dest="waltid-wallet-demo-compose-${{ inputs.version }}.apk"
          cp "$apk" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Create release and attach APK if present
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: false
          prerelease: ${{ contains(inputs.tag, 'PRE-RELEASE') }}
          make_latest: ${{ inputs.make_latest }}

      - name: Write Firebase release notes
        if: ${{ steps.detect.outputs.exists == 'true' && steps.apk.outputs.path != '' }}
        env:
          VARIANT: production
          COMMIT_SHA: ${{ github.sha }}
          AUTHOR: ${{ github.actor }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          script="waltid-identity/.github/scripts/mobile-ci/write-mobile-release-notes.sh"
          if [ -f "$script" ]; then
            bash "$script" "$RUNNER_TEMP/firebase-release-notes.txt"
          else
            echo "::notice::Firebase release-notes script not present on this ref; skipping."
          fi

      - name: Upload production APK to Firebase App Distribution
        if: ${{ steps.detect.outputs.exists == 'true' && steps.apk.outputs.path != '' }}
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          FIREBASE_APP_ID: 1:548517295104:android:cb044a978d7d49e7e154e5
          FIREBASE_GROUPS: General
          FIREBASE_PROJECT: waltid-compose-app
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-release-notes.txt
        run: |
          set -euo pipefail
          script="waltid-identity/.github/scripts/mobile-ci/distribute-firebase-android.sh"
          if [ -f "$script" ]; then
            bash "$script"
          else
            echo "::notice::Firebase distribute script not present on this ref; skipping."
          fi
