name: Deploy Helm Chart to K8s

on:
  workflow_call:
    inputs:
      version:
        description: "release version"
        required: true
        type: string
      namespace:
        description: "namespace"
        required: true
        type: string
      kubeconfig_secret:
        description: "The name of the kubeconfig secret to use (defaults to 'KUBE_CONFIG')"
        required: false
        type: string
        default: "KUBE_CONFIG"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout waltid-identity
        uses: actions/checkout@v6
        with:
          repository: walt-id/waltid-identity
          ref: ${{ github.ref_name }}

      - name: Create namespace if not exists
        uses: actions-hub/kubectl@master
        continue-on-error: true
        env:
          KUBE_CONFIG: ${{ secrets[inputs.kubeconfig_secret] }}
        with:
          args: create namespace ${{ inputs.namespace }}

      - name: Update domains and image name in helm-values.json
        env:
          WALLET2_AUTH_SIGNING_KEY: ${{ secrets.WALLET2_AUTH_SIGNING_KEY }}
        run: |
          IMAGE_NAME="${{ inputs.version }}"
          NAMESPACE="${{ inputs.namespace }}"

          # Locate the helm-values.json from the checked-out waltid-identity repo
          HELM_VALUES_PATH="./.github/workflows/data/helm-values.json"

          # Check if the file exists
          if [ ! -f "$HELM_VALUES_PATH" ]; then
            echo "Error: helm-values.json not found at path $HELM_VALUES_PATH"
            exit 1
          fi

          # Copy the file to modify it
          cp $HELM_VALUES_PATH helm-values.json

          sed -i 's#"authConf": .*#"authConf": ${{ secrets.WALLET_AUTH_SECRET }}#g' helm-values.json

          if [ -z "$WALLET2_AUTH_SIGNING_KEY" ]; then
            echo "::error::WALLET2_AUTH_SIGNING_KEY is not set. Add it to the repository secrets as a walt.id key JSON, e.g. {\"type\":\"jwk\",\"jwk\":{...}}."
            echo "Deploy aborted: WALLET2_AUTH_SIGNING_KEY is not set." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          jq --arg key "$WALLET2_AUTH_SIGNING_KEY" \
            '.["wallet-api2"].configFiles["auth.conf"] |= gsub("__DEFAULT_WALLET2_AUTH_SIGNING_KEY__"; $key)' \
            helm-values.json > helm-values.patched.json
          mv helm-values.patched.json helm-values.json

          # Update domain names in the file
          sed -i "s/issuer\.portal\.test\.waltid\.cloud/issuer.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/issuer2\.portal\.test\.waltid\.cloud/issuer2.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/verifier\.portal\.test\.waltid\.cloud/verifier.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/verifier2\.portal\.test\.waltid\.cloud/verifier2.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/wallet2\.test\.waltid\.cloud/wallet2.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/wallet\.test\.waltid\.cloud/wallet.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/portal2\.test\.waltid\.cloud/portal2.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/portal\.test\.waltid\.cloud/portal.${IMAGE_NAME}.waltid.cloud/g" helm-values.json
          sed -i "s/wallet-dev\.test\.waltid\.cloud/wallet-dev.${IMAGE_NAME}.waltid.cloud/g" helm-values.json

          # Update image name in helm-values.json
          sed -i "s|\"latest\"|\"${IMAGE_NAME}\"|g" helm-values.json
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v5.0.0
      - name: Create kubeconfig file
        run: echo "${{ secrets[inputs.kubeconfig_secret] }}" | base64 --decode > ${{ github.workspace }}/kubeconfig
      - name: Create portal2 PID secret
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          PORTAL2_PID_ENV: ${{ secrets.PORTAL2_PID_ENV }}
        run: |
          if [ -z "$PORTAL2_PID_ENV" ]; then
            echo "::error::PORTAL2_PID_ENV is not set. Add PORTAL2_PID_ENV in your repository secrets."
            echo "Deploy aborted: PORTAL2_PID_ENV is not set." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          ENV_FILE="$RUNNER_TEMP/portal2-pid.env"
          printf '%s\n' "$PORTAL2_PID_ENV" > "$ENV_FILE"

          present=$(awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ { print $1 }' "$ENV_FILE")
          missing=()
          for name in \
            NUXT_PID_GERMAN_KEY_JWK NUXT_PID_GERMAN_X5C NUXT_PID_GERMAN_CLIENT_ID \
            NUXT_PID_GERMAN_VERIFIER_INFO NUXT_PID_FRANCE_KEY_JWK NUXT_PID_FRANCE_X5C \
            NUXT_PID_FRANCE_CLIENT_ID NUXT_PID_EUDI_REF_KEY_JWK NUXT_PID_EUDI_REF_X5C \
            NUXT_PID_EUDI_REF_CLIENT_ID; do
            grep -qxF "$name" <<< "$present" || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            rm -f "$ENV_FILE"
            echo "::error::PORTAL2_PID_ENV is missing: ${missing[*]}"
            echo "Deploy aborted: PORTAL2_PID_ENV is missing ${missing[*]}." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          kubectl create secret generic portal2-pid-secret \
            --namespace ${{ inputs.namespace }} \
            --from-env-file="$ENV_FILE" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$ENV_FILE"
      - name: Helm Dependency Build
        run: |
          helm dependency build ./helm-charts/waltid
      - name: Helm Deploy
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          helm upgrade --install waltid-helm-release ./helm-charts/waltid \
            --namespace ${{ inputs.namespace }} \
            --set-string global.deploymentId=${{ github.sha }} \
            -f helm-values.json
      - name: Add deployment URLs to summary
        run: |
          VERSION="${{ inputs.version }}"
          echo "## Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Issuer | https://issuer.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Issuer2 | https://issuer2.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Verifier | https://verifier.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Verifier2 | https://verifier2.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Wallet | https://wallet.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Wallet (Compose web) | https://wallet2.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Wallet API2 (same host as above) | https://wallet2.${VERSION}.waltid.cloud/swagger |" >> $GITHUB_STEP_SUMMARY
          echo "| Wallet Dev | https://wallet-dev.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Portal | https://portal.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
          echo "| Portal2 | https://portal2.${VERSION}.waltid.cloud |" >> $GITHUB_STEP_SUMMARY
