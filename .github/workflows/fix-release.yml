name: Fix release on manual push

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Fix release version (e.g. 0.20.1)'
        required: true

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
      preferred: ${{ inputs.release_version }}
  enterprise-ref:
    name: Resolve enterprise branch ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Determine ref to dispatch on
        id: ref
        env:
          REF: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://${TOKEN}@github.com/walt-id/waltid-identity-enterprise.git" "$REF"; then
            echo "Branch '$REF' found in waltid-identity-enterprise, using it."
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$REF' not found in waltid-identity-enterprise, using main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
  gradle:
    uses: ./.github/workflows/gradle.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      enable-android-build: true
      publish: true
      cacheless: true
      run-conformance: true
      run-issuer-conformance: true
      run-haip-conformance: true
      report-check-name: 'gradle / gradle (ubuntu-22.04)'
      conformance-report-check-name: 'gradle / conformance (ubuntu-22.04)'
  integration-test-aws:
    name: Integration Tests - AWS
    runs-on: ubuntu-latest
    needs: enterprise-ref
    steps:
      - name: Dispatch integration-test-aws.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: integration-test-aws.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
  integration-test-azure:
    name: Integration Tests - Azure
    runs-on: ubuntu-latest
    needs: enterprise-ref
    steps:
      - name: Dispatch integration-test-azure.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: integration-test-azure.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
  docker:
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      publish: true
  api-docker:
    uses: ./.github/workflows/api-docker.yml
    secrets: inherit
    needs: version
    with:
      version: ${{ needs.version.outputs.release_version }}
      publish: true
  tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, gradle, docker, api-docker, integration-test-aws, integration-test-azure ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      ref: ${{ github.ref_name }}
  enterprise-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, gradle, docker, api-docker, integration-test-aws, integration-test-azure ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-identity-enterprise
      ref: ${{ github.ref_name }}
  docs-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, gradle, docker, api-docker, integration-test-aws, integration-test-azure ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-docs
      ref: ${{ github.ref_name }}
  quickstart-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, gradle, docker, api-docker, integration-test-aws, integration-test-azure ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-enterprise-quickstart
      ref: ${{ github.ref_name }}
  unified-build-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, gradle, docker, api-docker, integration-test-aws, integration-test-azure ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-unified-build
      ref: ${{ github.ref_name }}
  release:
    uses: ./.github/workflows/create-release.yml
    secrets: inherit
    needs: [ version, tag ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      tag: ${{ needs.tag.outputs.tag }}
      make_latest: false
  enterprise-release:
    name: Create Enterprise Release
    runs-on: ubuntu-latest
    needs: [ enterprise-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-identity-enterprise
          tag_name: ${{ needs.enterprise-tag.outputs.tag }}
          prerelease: ${{ contains(needs.enterprise-tag.outputs.tag, 'PRE-RELEASE') }}
          make_latest: false
  docs-release:
    name: Create Docs Release
    runs-on: ubuntu-latest
    needs: [ docs-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-docs
          tag_name: ${{ needs.docs-tag.outputs.tag }}
          prerelease: ${{ contains(needs.docs-tag.outputs.tag, 'PRE-RELEASE') }}
          make_latest: false
  quickstart-release:
    name: Create Quickstart Release
    runs-on: ubuntu-latest
    needs: [ quickstart-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-enterprise-quickstart
          tag_name: ${{ needs.quickstart-tag.outputs.tag }}
          prerelease: ${{ contains(needs.quickstart-tag.outputs.tag, 'PRE-RELEASE') }}
          make_latest: false
  unified-build-release:
    name: Create Unified Build Release
    runs-on: ubuntu-latest
    needs: [ unified-build-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-unified-build
          tag_name: ${{ needs.unified-build-tag.outputs.tag }}
          prerelease: ${{ contains(needs.unified-build-tag.outputs.tag, 'PRE-RELEASE') }}
          make_latest: false
