name: Promote a release candidate to a general release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (must already be published and tagged by release-candidate.yml)'
        required: true

concurrency:
  # Keep candidate runs from moving version tags during promotion.
  group: release-pipeline
  queue: max

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
      preferred: ${{ inputs.version }}
  guard:
    name: Guard against promoting a pre-release
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Reject pre-release versions
        env:
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          case "$VERSION" in
            *PRE-RELEASE*|*SNAPSHOT*)
              echo "::error::Refusing to promote '$VERSION' to stable/latest and prod."
              exit 1
              ;;
          esac
          echo "Promoting $VERSION."
  source:
    name: Resolve release candidate tag
    runs-on: ubuntu-latest
    needs: [ version, guard ]
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      checkout-refs: ${{ steps.source.outputs.checkout-refs }}
      is-latest: ${{ steps.source.outputs.is-latest }}
    steps:
      - name: Resolve the tagged commits
        id: source
        env:
          TAG: v${{ needs.version.outputs.release_version }}
          VERSION: ${{ needs.version.outputs.release_version }}
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          declare -A shas
          for repo in waltid-identity waltid-unified-build waltid-identity-enterprise waltid-identity-enterprise-license waltid-docs waltid-enterprise-quickstart; do
            refs="$(git ls-remote "https://${GH_TOKEN}@github.com/walt-id/${repo}.git" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
            if [ -z "$refs" ]; then
              echo "::error::${TAG} not found in walt-id/${repo}. Was this version built by release-candidate.yml?"
              exit 1
            fi
            # Annotated tags list the tagged commit on a trailing ^{} line.
            shas[$repo]="$(tail -n 1 <<< "$refs" | cut -f1)"
            echo "walt-id/${repo}: ${TAG} -> ${shas[$repo]}"
          done

          # Only move stable/latest when this is the highest release, so patching an older
          # release line does not roll them back.
          highest_released="$(gh release list -R walt-id/waltid-identity --exclude-drafts --exclude-pre-releases --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)"
          if [ "$(printf '%s\n%s\n' "$highest_released" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ]; then
            is_latest=true
          else
            is_latest=false
            echo "::notice::${VERSION} is older than the released ${highest_released}; stable/latest and prod will not change."
          fi

          checkout_refs="$(jq -cn \
            --arg unified "${shas[waltid-unified-build]}" \
            --arg identity "${shas[waltid-identity]}" \
            --arg enterprise "${shas[waltid-identity-enterprise]}" \
            --arg enterprise_license "${shas[waltid-identity-enterprise-license]}" \
            '{unified: $unified, identity: $identity, enterprise: $enterprise, enterprise_license: $enterprise_license}')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "checkout-refs=${checkout_refs}" >> "$GITHUB_OUTPUT"
          echo "is-latest=${is_latest}" >> "$GITHUB_OUTPUT"

  verify-release-scan:
    name: Require the Enterprise release scan
    runs-on: ubuntu-latest
    needs: [ version, source ]
    outputs:
      run-id: ${{ steps.scan.outputs.run-id }}
    steps:
      - name: Verify a successful scan of this release
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          ENTERPRISE_SHA: ${{ fromJSON(needs.source.outputs.checkout-refs).enterprise }}
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail
          if ! run_id="$(gh api --paginate "repos/walt-id/waltid-identity-enterprise/actions/workflows/release-sonar-snapshot.yml/runs?head_sha=${ENTERPRISE_SHA}&status=success&event=workflow_dispatch&per_page=100" \
            | jq -ser --arg title "Release Sonar scan $VERSION" --arg sha "$ENTERPRISE_SHA" '
                [.[].workflow_runs[] | select(.display_title == $title and .head_sha == $sha and .conclusion == "success")]
                | sort_by(.id) | last | .id')"; then
            echo "::error::No successful SonarQube Cloud scan found for $VERSION at $ENTERPRISE_SHA."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  retag:
    name: Promote image tags
    runs-on: ubuntu-latest
    needs: [ version, source, verify-release-scan ]
    outputs:
      enterprise-api-digest: ${{ steps.jib.outputs.enterprise-api-digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.source.outputs.checkout-refs).identity }}
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify registry provenance for the Jib release images
        id: jib
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.release_version }}
          CHECKOUT_REFS: ${{ needs.source.outputs.checkout-refs }}
          IDENTITY_SHA: ${{ fromJSON(needs.source.outputs.checkout-refs).identity }}
        run: |
          set -euo pipefail
          policy=(--bundle-from-oci --repo walt-id/waltid-identity
            --signer-workflow walt-id/waltid-identity/.github/workflows/api-docker.yml
            --source-digest "$IDENTITY_SHA" --deny-self-hosted-runners)
          jib_inputs_type='https://github.com/walt-id/waltid-identity/blob/main/.github/workflows/api-docker.yml#jib-build-inputs-v1'
          matrix="$(jq -er '.[] | [.image, .commandPath] | @tsv' .github/workflows/data/api-docker-matrix.json)"
          : > "$RUNNER_TEMP/jib-digests"
          while IFS=$'\t' read -r image command_path; do
            reference="docker.io/waltid/${image}"
            digest="$(docker buildx imagetools inspect "${reference}:${VERSION}" --format '{{json .Manifest}}' | jq -er '.digest')"
            subject="oci://${reference}@${digest}"
            gh attestation verify "$subject" "${policy[@]}" --predicate-type https://slsa.dev/provenance/v1 > /dev/null
            if ! gh attestation verify "$subject" "${policy[@]}" --predicate-type "$jib_inputs_type" --format json \
              | jq -e --arg version "$VERSION" --arg task "${command_path}:jib" --argjson refs "$CHECKOUT_REFS" '
                  any(.[]; .verificationResult.statement.predicate ==
                    {version: $version, gradleTask: $task, checkoutRefs: $refs})' > /dev/null; then
              echo "::error::No verified Jib build provenance matched the tagged sources for ${reference}@${digest}."
              exit 1
            fi
            echo "$image=$digest" >> "$RUNNER_TEMP/jib-digests"
          done <<< "$matrix"
          api_digest="$(awk -F= '$1 == "waltid-enterprise-api" {print $2}' "$RUNNER_TEMP/jib-digests")"
          if [[ ! "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No verified Enterprise API digest was found in the Jib matrix."
            exit 1
          fi
          echo "enterprise-api-digest=$api_digest" >> "$GITHUB_OUTPUT"
      - name: Point stable and latest at the verified digests
        if: ${{ needs.source.outputs.is-latest == 'true' }}
        env:
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail
          images="$(
            {
              jq -r '.[].image' \
                .github/workflows/data/docker-matrix.json \
                .github/workflows/data/api-docker-matrix.json
              echo waltid-sdk-docs
            } | sort -u
          )"
          for image in $images; do
            echo "::group::waltid/${image}"
            digest="$(awk -F= -v image="$image" '$1 == image {print $2}' "$RUNNER_TEMP/jib-digests")"
            if [ -z "$digest" ]; then
              digest="$(docker buildx imagetools inspect "waltid/${image}:${VERSION}" \
                --format '{{json .Manifest}}' | jq -er '.digest')"
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve a digest for waltid/${image}:${VERSION}. Was this version published by release-candidate.yml?"
              exit 1
            fi
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "waltid/${image}:stable" \
              --tag "waltid/${image}:latest" \
              "waltid/${image}@${digest}"
            echo "promoted waltid/${image}:${VERSION} (${digest}) -> stable, latest"
            echo "::endgroup::"
          done

  enterprise-image-digests:
    name: Resolve enterprise image digests
    runs-on: ubuntu-latest
    needs: [ version, retag ]
    outputs:
      api-index-digest: ${{ needs.retag.outputs.enterprise-api-digest }}
      ui-index-digest: ${{ steps.digest.outputs.ui }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve the published UI image index digest
        id: digest
        env:
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail
          UI_DIGEST="$(docker buildx imagetools inspect "waltid/waltid-enterprise-ui:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "ui=${UI_DIGEST}" >> "$GITHUB_OUTPUT"
  enterprise-supply-chain:
    name: Enterprise supply chain
    runs-on: ubuntu-latest
    needs: [ version, source, enterprise-image-digests ]
    steps:
      - name: Dispatch enterprise-supply-chain.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.3
        with:
          workflow: enterprise-supply-chain.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.source.outputs.tag }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: '{"api-index-digest": "${{ needs.enterprise-image-digests.outputs.api-index-digest }}", "ui-index-digest": "${{ needs.enterprise-image-digests.outputs.ui-index-digest }}", "version": "${{ needs.version.outputs.release_version }}"}'

  enterprise-release-evidence:
    name: Enterprise release evidence
    runs-on: ubuntu-latest
    # Attaches to the enterprise GitHub release, so it has to exist first.
    needs: [ version, source, verify-release-scan, enterprise-image-digests, enterprise-release ]
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Dispatch release-evidence.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.3
        with:
          workflow: release-evidence.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.source.outputs.tag }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: >-
            {"version": "${{ needs.version.outputs.release_version }}",
            "api-index-digest": "${{ needs.enterprise-image-digests.outputs.api-index-digest }}",
            "ui-index-digest": "${{ needs.enterprise-image-digests.outputs.ui-index-digest }}",
            "sonar-run-id": "${{ needs.verify-release-scan.outputs.run-id }}",
            "attach-to-release": "true"}

  deploy-license:
    name: Deploy license
    runs-on: ubuntu-latest
    needs: [ version, source, retag ]
    if: ${{ needs.source.outputs.is-latest == 'true' }}
    steps:
      - name: Dispatch deploy-k8s.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.3
        with:
          workflow: deploy-k8s.yml
          repo: walt-id/waltid-identity-enterprise-license
          ref: ${{ needs.source.outputs.tag }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: '{"version": "${{ needs.version.outputs.release_version }}", "k8s_file": "waltid-license-server/k8s/deployment-prod.yaml"}'
  deploy:
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    needs: [ version, source, deploy-license ]
    if: ${{ needs.source.outputs.is-latest == 'true' }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      checkout-refs: ${{ needs.source.outputs.checkout-refs }}
      deployment: prod
      oss: identity-main
      enterprise: enterprise-main

  branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() && endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      ref: ${{ needs.source.outputs.tag }}
  enterprise-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() && endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-identity-enterprise
      ref: ${{ needs.source.outputs.tag }}
  enterprise-license-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() && endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-identity-enterprise-license
      ref: ${{ needs.source.outputs.tag }}
  docs-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() && endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-docs
      ref: ${{ needs.source.outputs.tag }}
  quickstart-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() && endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-enterprise-quickstart
      ref: ${{ needs.source.outputs.tag }}
  unified-build-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() && endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-unified-build
      ref: ${{ needs.source.outputs.tag }}

  release:
    uses: ./.github/workflows/create-release.yml
    secrets: inherit
    permissions:
      contents: write
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      tag: ${{ needs.source.outputs.tag }}
      checkout-refs: ${{ needs.source.outputs.checkout-refs }}
      make_latest: ${{ needs.source.outputs.is-latest == 'true' }}
  testflight:
    uses: ./.github/workflows/distribute-ios-testflight.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    needs: [ version, source, deploy ]
    if: ${{ !failure() && !cancelled() }}
    with:
      version_name: ${{ needs.version.outputs.release_version }}
      release_tag: ${{ needs.source.outputs.tag }}
      checkout-refs: ${{ needs.source.outputs.checkout-refs }}
      app: both
  enterprise-release:
    name: Create Enterprise Release
    runs-on: ubuntu-latest
    needs: [ source, deploy ]
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-identity-enterprise
          tag_name: ${{ needs.source.outputs.tag }}
          prerelease: ${{ contains(needs.source.outputs.tag, 'PRE-RELEASE') }}
          make_latest: ${{ needs.source.outputs.is-latest }}
  docs-release:
    name: Create Docs Release
    runs-on: ubuntu-latest
    needs: [ source, deploy ]
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-docs
          tag_name: ${{ needs.source.outputs.tag }}
          prerelease: ${{ contains(needs.source.outputs.tag, 'PRE-RELEASE') }}
          make_latest: ${{ needs.source.outputs.is-latest }}
  quickstart-release:
    name: Create Quickstart Release
    runs-on: ubuntu-latest
    needs: [ source, deploy ]
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-enterprise-quickstart
          tag_name: ${{ needs.source.outputs.tag }}
          prerelease: ${{ contains(needs.source.outputs.tag, 'PRE-RELEASE') }}
          make_latest: ${{ needs.source.outputs.is-latest }}
  unified-build-release:
    name: Create Unified Build Release
    runs-on: ubuntu-latest
    needs: [ source, deploy ]
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-unified-build
          tag_name: ${{ needs.source.outputs.tag }}
          prerelease: ${{ contains(needs.source.outputs.tag, 'PRE-RELEASE') }}
          make_latest: ${{ needs.source.outputs.is-latest }}
