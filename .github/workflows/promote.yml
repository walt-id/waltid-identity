name: Promote a release candidate to a general release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (must already be published by release-candidate.yml)'
        required: true

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
      preferred: ${{ inputs.version }}
  guard:
    name: Guard against promoting a pre-release
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Reject pre-release versions
        env:
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          case "$VERSION" in
            *PRE-RELEASE*|*SNAPSHOT*)
              echo "::error::Refusing to promote '$VERSION' to stable/latest and prod."
              exit 1
              ;;
          esac
          echo "Promoting $VERSION."
  enterprise-ref:
    name: Resolve enterprise branch ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      license-ref: ${{ steps.ref.outputs.license-ref }}
    steps:
      - name: Determine ref to dispatch on
        id: ref
        env:
          REF: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://${TOKEN}@github.com/walt-id/waltid-identity-enterprise.git" "$REF"; then
            echo "Branch '$REF' found in waltid-identity-enterprise, using it."
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$REF' not found in waltid-identity-enterprise, using main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --heads "https://${TOKEN}@github.com/walt-id/waltid-identity-enterprise-license.git" "$REF"; then
            echo "Branch '$REF' found in waltid-identity-enterprise-license, using it."
            echo "license-ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$REF' not found in waltid-identity-enterprise-license, using main."
            echo "license-ref=main" >> "$GITHUB_OUTPUT"
          fi

  retag:
    name: Promote image tags
    runs-on: ubuntu-latest
    needs: [ version, guard ]
    steps:
      - uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Point stable and latest at the verified digests
        env:
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail
          images="$(
            {
              jq -r '.[].image' \
                .github/workflows/data/docker-matrix.json \
                .github/workflows/data/api-docker-matrix.json
              echo waltid-sdk-docs
            } | sort -u
          )"
          for image in $images; do
            echo "::group::waltid/${image}"
            digest="$(docker buildx imagetools inspect "waltid/${image}:${VERSION}" \
              --format '{{json .Manifest}}' | jq -r '.digest')"
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::error::Could not resolve a digest for waltid/${image}:${VERSION}. Was this version published by release-candidate.yml?"
              exit 1
            fi
            docker buildx imagetools create \
              --tag "waltid/${image}:stable" \
              --tag "waltid/${image}:latest" \
              "waltid/${image}@${digest}"
            echo "promoted waltid/${image}:${VERSION} (${digest}) -> stable, latest"
            echo "::endgroup::"
          done

  enterprise-image-digests:
    name: Resolve enterprise image digests
    runs-on: ubuntu-latest
    needs: [ version, retag ]
    outputs:
      api-index-digest: ${{ steps.digest.outputs.api }}
      ui-index-digest: ${{ steps.digest.outputs.ui }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve published image index digests
        id: digest
        env:
          VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail
          API_DIGEST="$(docker buildx imagetools inspect "waltid/waltid-enterprise-api:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')"
          UI_DIGEST="$(docker buildx imagetools inspect "waltid/waltid-enterprise-ui:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "api=${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ui=${UI_DIGEST}" >> "$GITHUB_OUTPUT"
  enterprise-supply-chain:
    name: Enterprise supply chain
    runs-on: ubuntu-latest
    needs: [ version, enterprise-ref, enterprise-image-digests ]
    steps:
      - name: Dispatch enterprise-supply-chain.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: enterprise-supply-chain.yml
          repo: walt-id/waltid-identity-enterprise
          ref: ${{ needs.enterprise-ref.outputs.ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: '{"api-index-digest": "${{ needs.enterprise-image-digests.outputs.api-index-digest }}", "ui-index-digest": "${{ needs.enterprise-image-digests.outputs.ui-index-digest }}", "version": "${{ needs.version.outputs.release_version }}"}'

  deploy-license:
    name: Deploy license
    runs-on: ubuntu-latest
    needs: [ version, enterprise-ref, retag ]
    steps:
      - name: Dispatch deploy-k8s.yml and wait
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: deploy-k8s.yml
          repo: walt-id/waltid-identity-enterprise-license
          ref: ${{ needs.enterprise-ref.outputs.license-ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          wait-for-completion: true
          sync-status: true
          inputs: '{"version": "${{ needs.version.outputs.release_version }}", "k8s_file": "waltid-license-server/k8s/deployment-prod.yaml"}'
  deploy:
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    needs: [ version, deploy-license ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      deployment: prod
      oss: identity-main
      enterprise: enterprise-main

  branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
  enterprise-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-identity-enterprise
  docs-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-docs
  quickstart-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-enterprise-quickstart
  unified-build-branch:
    uses: ./.github/workflows/branch.yml
    secrets: inherit
    needs: [ version, deploy ]
    if: ${{ endsWith(needs.version.outputs.release_version, '.0') }}
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-unified-build

  tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
  enterprise-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-identity-enterprise
  docs-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-docs
  quickstart-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-enterprise-quickstart
  unified-build-tag:
    uses: ./.github/workflows/tag.yml
    secrets: inherit
    needs: [ version, deploy ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      repository: walt-id/waltid-unified-build

  release:
    uses: ./.github/workflows/create-release.yml
    secrets: inherit
    needs: [ version, tag ]
    with:
      version: ${{ needs.version.outputs.release_version }}
      tag: ${{ needs.tag.outputs.tag }}
  enterprise-release:
    name: Create Enterprise Release
    runs-on: ubuntu-latest
    needs: [ enterprise-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-identity-enterprise
          tag_name: ${{ needs.enterprise-tag.outputs.tag }}
          prerelease: ${{ contains(needs.enterprise-tag.outputs.tag, 'PRE-RELEASE') }}
  docs-release:
    name: Create Docs Release
    runs-on: ubuntu-latest
    needs: [ docs-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-docs
          tag_name: ${{ needs.docs-tag.outputs.tag }}
          prerelease: ${{ contains(needs.docs-tag.outputs.tag, 'PRE-RELEASE') }}
  quickstart-release:
    name: Create Quickstart Release
    runs-on: ubuntu-latest
    needs: [ quickstart-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-enterprise-quickstart
          tag_name: ${{ needs.quickstart-tag.outputs.tag }}
          prerelease: ${{ contains(needs.quickstart-tag.outputs.tag, 'PRE-RELEASE') }}
  unified-build-release:
    name: Create Unified Build Release
    runs-on: ubuntu-latest
    needs: [ unified-build-tag ]
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: walt-id/waltid-unified-build
          tag_name: ${{ needs.unified-build-tag.outputs.tag }}
          prerelease: ${{ contains(needs.unified-build-tag.outputs.tag, 'PRE-RELEASE') }}
