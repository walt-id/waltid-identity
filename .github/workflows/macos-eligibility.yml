name: macOS eligibility

on:
  workflow_call:
    inputs:
      event-name:
        description: "Caller event name"
        required: true
        type: string
      ref:
        description: "Caller git ref"
        required: true
        type: string
      pr-number:
        description: "Pull request number, if the caller is a PR event"
        required: false
        type: string
        default: ""
      pr-head-repo:
        description: "Pull request head repository, if the caller is a PR event"
        required: false
        type: string
        default: ""
      pr-labels:
        description: "JSON array of pull request label names"
        required: false
        type: string
        default: "[]"
      pr-draft:
        description: "Whether the pull request is currently a draft"
        required: false
        type: boolean
        default: false
    outputs:
      run-ios-simulator:
        description: "Whether Kotlin iOS simulator jobs should run"
        value: ${{ jobs.decide.outputs.run-ios-simulator }}
      run-native:
        description: "Whether native WalletCore / Xcode demo jobs should run"
        value: ${{ jobs.decide.outputs.run-native }}
      run-compose:
        description: "Whether Compose iOS demo jobs should run"
        value: ${{ jobs.decide.outputs.run-compose }}
      run-enterprise:
        description: "Whether Enterprise iOS jobs should run"
        value: ${{ jobs.decide.outputs.run-enterprise }}
      run-sdk-docs:
        description: "Whether mobile SDK docs / ABI / DocC jobs should run"
        value: ${{ jobs.decide.outputs.run-sdk-docs }}
      should-run:
        description: "Whether any macOS lane should run"
        value: ${{ jobs.decide.outputs.should-run }}
      reason:
        description: "Human-readable decision reason"
        value: ${{ jobs.decide.outputs.reason }}

permissions:
  contents: read
  pull-requests: read

jobs:
  decide:
    runs-on: ubuntu-22.04
    outputs:
      run-ios-simulator: ${{ steps.decide.outputs.run-ios-simulator }}
      run-native: ${{ steps.decide.outputs.run-native }}
      run-compose: ${{ steps.decide.outputs.run-compose }}
      run-enterprise: ${{ steps.decide.outputs.run-enterprise }}
      run-sdk-docs: ${{ steps.decide.outputs.run-sdk-docs }}
      should-run: ${{ steps.decide.outputs.should-run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout macOS lane predicates
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/ci
            .github/scripts/ci

      - name: Decide macOS lanes
        id: decide
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          GH_TOKEN: ${{ github.token }}
          PR_DRAFT: ${{ inputs.pr-draft }}
          PR_HEAD_REPO: ${{ inputs.pr-head-repo }}
          PR_LABELS: ${{ inputs.pr-labels }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REF: ${{ inputs.ref }}
        shell: bash
        run: .github/scripts/ci/decide-macos-lanes.sh
