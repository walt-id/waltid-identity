name: Checkout all repos with ref fallback
description: |
  Checks out waltid-unified-build, waltid-identity, waltid-identity-enterprise, and
  waltid-identity-enterprise-license repositories using a provided ref, falling back
  to main if it doesn't exist.

inputs:
  token:
    description: 'GitHub token (optional, defaults to github.token)'
    required: false
    default: ${{ github.token }}
  ref:
    description: 'Ref to try in each repository before falling back to main'
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  checkoutUnifiedToRepoDir:
    description: 'If set to "yes", checkout waltid-unified-build to its repo name instead of "."'
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # waltid-identity tracks generated SwiftPM linkage files with paths beyond 260 characters
    # (waltid-wallet-demo-compose/iosApp/KotlinMultiplatformLinkedPackage/...), which Windows Git
    # refuses to create unless long paths are enabled.
    - name: Enable Git long paths on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: git config --global core.longpaths true

    - name: Determine refs
      id: refs
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        TOKEN: ${{ inputs.token }}
      run: |
        resolve_ref() {
          local repo="$1" needs_token="$2" key="$3"
          local url="https://github.com/${repo}.git"
          [ "$needs_token" = "true" ] && url="https://${TOKEN}@github.com/${repo}.git"
          if [ -n "$REF" ] && git ls-remote --exit-code "$url" "$REF"; then
            echo "${key}=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "${key}=main" >> "$GITHUB_OUTPUT"
          fi
        }
        resolve_ref "walt-id/waltid-unified-build" true unified
        resolve_ref "walt-id/waltid-identity" false identity
        resolve_ref "walt-id/waltid-identity-enterprise" true enterprise
        resolve_ref "walt-id/waltid-identity-enterprise-license" true enterprise_license

    - name: Checkout waltid-unified-build
      uses: actions/checkout@v4
      with:
        repository: walt-id/waltid-unified-build
        ref: ${{ steps.refs.outputs.unified }}
        token: ${{ inputs.token }}
        path: ${{ inputs.checkoutUnifiedToRepoDir == 'true' && 'waltid-unified-build' || '.' }}

    - name: Checkout waltid-identity
      uses: actions/checkout@v4
      with:
        repository: walt-id/waltid-identity
        ref: ${{ steps.refs.outputs.identity }}
        token: ${{ inputs.token }}
        path: waltid-identity

    - name: Checkout waltid-identity-enterprise
      uses: actions/checkout@v4
      with:
        repository: walt-id/waltid-identity-enterprise
        ref: ${{ steps.refs.outputs.enterprise }}
        token: ${{ inputs.token }}
        path: waltid-identity-enterprise

    - name: Checkout waltid-identity-enterprise-license
      uses: actions/checkout@v4
      with:
        repository: walt-id/waltid-identity-enterprise-license
        ref: ${{ steps.refs.outputs.enterprise_license }}
        token: ${{ inputs.token }}
        path: waltid-identity-enterprise-license
