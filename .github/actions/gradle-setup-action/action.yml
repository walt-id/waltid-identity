name: Configure gradle
description: Composite Action to setup gradle
inputs:
  location:
    description: "Relative path to the Gradle project"
    required: false
    default: "~"
  dependency-graph:
    description: "'generate-and-submit' needs contents: write access to the dependency graph. 'disabled' disables the dependency graph."
    required: false
    default: "disabled"
  cache-read-only:
    description: "Read existing Gradle cache entries without saving new ones. Defaults to setup-gradle's branch policy."
    required: false
    default: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-overwrite-existing: true
        cache-read-only: ${{ inputs.cache-read-only }}
        dependency-graph: ${{ inputs.dependency-graph }}
    - name: Gradle wrapper validation
      uses: gradle/actions/wrapper-validation@v5
