name: Configure gradle
description: Composite Action to setup gradle
inputs:
  location:
    description: "Relative path to the Gradle project"
    required: false
    default: "~"
  dependency-graph:
    description: "'generate-and-submit' needs contents: write access to the dependency graph. 'disabled' disables the dependency graph."
    required: false
    default: "disabled"

runs:
  using: "composite"
  steps:
    - name: Require the root Gradle wrapper
      shell: bash
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "::error::Root Gradle wrapper missing; check the coordinated checkout."
          exit 1
        fi
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        # setup-gradle validates every wrapper, including the nested repositories.
        validate-wrappers: true
        allow-snapshot-wrappers: false
        cache-overwrite-existing: true
        dependency-graph: ${{ inputs.dependency-graph }}
