name: gradle-ios
description: Run selected iOS build and test phases with the workflow's Xcode toolchain
inputs:
  waltid-directory:
    description: 'Path waltid-identity directory'
    required: false
    default: '.'
  simulator-destination:
    description: 'xcodebuild simulator destination for iOS app tests'
    required: true
  run-ios-simulator-tests:
    description: 'Run Gradle iosSimulatorArm64Test'
    required: false
    default: 'true'
  run-wallet-sdk-tests:
    description: 'Run real WalletCore-to-Swift package projections on iOS Simulator'
    required: false
    default: 'false'
  wallet-core-artifact:
    description: 'Restored release artifact directory to verify and reuse for WalletSDK bridge tests'
    required: false
    default: ''
  run-native-demo-tests:
    description: 'Run native iOS WalletSDK demo tests'
    required: false
    default: 'true'
  run-compose-demo-tests:
    description: 'Run Compose iOS demo tests'
    required: false
    default: 'true'
  # One flag per demo: each check builds that demo's app and extension, so it belongs in the job whose
  # build is already warm for that project.
  run-native-identity-document-provider-checks:
    description: 'Build the native demo document provider extension and verify its built configuration'
    required: false
    default: 'false'
  run-compose-identity-document-provider-checks:
    description: 'Build the Compose demo document provider extension and verify its built configuration'
    required: false
    default: 'false'
  test-report-job-name:
    description: 'Job name to associate with the published iOS JUnit report'
    required: false
    default: 'gradle'
  test-report-check-name:
    description: 'Check name for the published iOS JUnit report'
    required: false
    default: 'iOS Test Report'
  test-report-require-tests:
    description: 'Require reports containing tests for selected test suites'
    required: false
    default: 'true'
  test-result-artifact-name:
    description: 'Artifact name used when uploading failing iOS test results'
    required: false
    default: 'ios-integration-test-results'
runs:
  using: "composite"
  steps:
    - name: Configure iOS build environment
      uses: ./waltid-identity/.github/actions/ios-build-setup
      with:
        gradle-properties-path: '${{ inputs.waltid-directory }}/gradle.properties'

    - name: Compile iOS targets
      if: ${{ inputs.run-ios-simulator-tests == 'true' }}
      working-directory: ${{ inputs.waltid-directory }}
      shell: bash
      run: ./gradlew :waltid-libraries:crypto:waltid-crypto:compileKotlinIosSimulatorArm64

    - name: Cleanup simulators before tests
      if: ${{ inputs.run-ios-simulator-tests == 'true' || inputs.run-wallet-sdk-tests == 'true' || inputs.run-native-demo-tests == 'true' || inputs.run-compose-demo-tests == 'true' }}
      shell: bash
      run: |
        echo "Shutting down running simulators..."
        xcrun simctl shutdown all || true
        echo "Available simulators:"
        xcrun simctl list devices | grep "iPhone"

    - name: Execute iOS simulator tests
      if: ${{ inputs.run-ios-simulator-tests == 'true' }}
      id: ios_simulator_tests
      continue-on-error: true
      working-directory: ${{ inputs.waltid-directory }}
      shell: bash
      run: ./gradlew iosSimulatorArm64Test

    - name: Require proximity Kotlin simulator test discovery
      if: ${{ always() && inputs.run-ios-simulator-tests == 'true' }}
      working-directory: ${{ inputs.waltid-directory }}
      shell: bash
      run: python3 .github/scripts/mobile-ci/verify_proximity_suites.py --platform ios-simulator

    # A provider extension that is not embedded, or disagrees with its host about App Group, Keychain
    # group or doctypes, is invisible to iOS and fails no build - only an on-device presentation.
    - name: Verify native iOS identity document provider
      if: ${{ inputs.run-native-identity-document-provider-checks == 'true' }}
      id: native_identity_document_provider_checks
      continue-on-error: true
      shell: bash
      run: |
        exec python3 "${{ github.workspace }}/${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/run-ios-phase.py" \
          --output-dir "${{ github.workspace }}/ios-ci-logs" native-provider \
          "${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/verify-ios-identity-document-provider.sh" \
          --project-dir "${{ inputs.waltid-directory }}/waltid-applications/waltid-wallet-demo-ios/iosApp" \
          --destination "${{ inputs.simulator-destination }}" \
          --derived-data /tmp/xcode-derived \
          --app-group group.id.walt.wallet.native \
          --keychain-group-suffix id.walt.wallet.native.shared \
          --app-bundle-id id.walt.wallet.native \
          --appex-bundle-id id.walt.wallet.native.identitydocumentprovider \
          --development-team 9BB78CFW7Y \
          --build-setting OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES

    - name: Verify Compose iOS identity document provider
      if: ${{ inputs.run-compose-identity-document-provider-checks == 'true' }}
      id: compose_identity_document_provider_checks
      continue-on-error: true
      shell: bash
      run: |
        exec python3 "${{ github.workspace }}/${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/run-ios-phase.py" \
          --output-dir "${{ github.workspace }}/ios-ci-logs" compose-provider \
          "${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/verify-ios-identity-document-provider.sh" \
          --project-dir "${{ inputs.waltid-directory }}/waltid-applications/waltid-wallet-demo-compose/iosApp" \
          --destination "${{ inputs.simulator-destination }}" \
          --derived-data /tmp/xcode-derived-compose \
          --app-group group.id.walt.wallet.compose \
          --keychain-group-suffix id.walt.wallet.compose.shared \
          --app-bundle-id id.walt.wallet.compose \
          --appex-bundle-id id.walt.wallet.compose.identitydocumentprovider \
          --development-team 9BB78CFW7Y

    - name: Execute WalletSDK package bridge tests
      if: ${{ inputs.run-wallet-sdk-tests == 'true' }}
      id: wallet_sdk_tests
      continue-on-error: true
      shell: bash
      run: |
        exec python3 "${{ github.workspace }}/${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/run-ios-phase.py" \
          --output-dir "${{ github.workspace }}/ios-ci-logs" wallet-sdk-bridge \
          "${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/run-ios-wallet-sdk-tests.sh" \
          "${{ inputs.simulator-destination }}" "${{ inputs.wallet-core-artifact }}"

    - name: Upload WalletSDK bridge discovery evidence
      if: ${{ always() && inputs.run-wallet-sdk-tests == 'true' && steps.wallet_sdk_tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: wallet-sdk-bridge-${{ inputs.test-result-artifact-name }}
        path: |
          ${{ inputs.waltid-directory }}/build/proximity-tests/swift-bridge.*/*.json
          ${{ inputs.waltid-directory }}/build/proximity-tests/swift-bridge.*/*.xml
          ${{ inputs.waltid-directory }}/build/proximity-tests/swift-bridge.*/*.log
        if-no-files-found: error
        retention-days: 7

    - name: Execute iOS demo app integration tests
      if: ${{ inputs.run-native-demo-tests == 'true' }}
      id: ios_demo_app_tests
      continue-on-error: true
      working-directory: ${{ inputs.waltid-directory }}/waltid-applications/waltid-wallet-demo-ios/iosApp
      shell: bash
      run: |
        exec python3 "${{ github.workspace }}/${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/run-ios-phase.py" \
          --output-dir "${{ github.workspace }}/ios-ci-logs" native-demo \
          xcodebuild test \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -destination "${{ inputs.simulator-destination }}" \
          -only-testing:iosAppTests \
          -only-testing:iosAppUITests/MockWalletUITests/testWalletReadinessOutlivesTheSuccessBannerAcrossRestart \
          -only-testing:iosAppUITests/MockWalletUITests/testCredentialsStayLoadingUntilTheInitialReadCompletes \
          -only-testing:iosAppUITests/PublicDemoBackendE2ETests/testReceiveAndPresentAgainstPublicDemoIssuer2Verifier2 \
          -only-testing:iosAppUITests/PublicDemoBackendE2ETests/testAutomaticallyAttestsEudiIssuanceBeforeAndAfterRestart \
          -resultBundlePath TestResults \
          -derivedDataPath /tmp/xcode-derived \
          -enableCodeCoverage NO \
          -parallel-testing-enabled NO \
          OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES

    - name: Execute Compose iOS demo app tests
      if: ${{ inputs.run-compose-demo-tests == 'true' }}
      id: compose_ios_demo_app_tests
      continue-on-error: true
      working-directory: ${{ inputs.waltid-directory }}/waltid-applications/waltid-wallet-demo-compose/iosApp
      shell: bash
      run: |
        exec python3 "${{ github.workspace }}/${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/run-ios-phase.py" \
          --output-dir "${{ github.workspace }}/ios-ci-logs" compose-demo \
          bash -e -o pipefail <<'TESTS'
        # Workflow destinations specify the device-type name and an explicit iOS version.
        IFS=, read -r platform device os extra <<< "${{ inputs.simulator-destination }}"
        if [[ "$platform" != 'platform=iOS Simulator' || "$device" != name=?* || "$os" != OS=[0-9]* || -n "$extra" ]]; then
          echo "::error::Compose tests require a device-type name and explicit iOS version"
          exit 1
        fi
        simulator=$(xcrun simctl create 'Compose wallet CI' "${device#name=}" "iOS ${os#OS=}")
        cleanup() {
          test_status=$?
          xcrun simctl delete "$simulator" || {
            cleanup_status=$?
            echo "::error::Failed to remove Compose test simulator"
            (( test_status != 0 )) || test_status=$cleanup_status
          }
          exit "$test_status"
        }
        trap cleanup EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        xcrun simctl bootstatus "$simulator" -b

        xcodebuild test \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Debug \
          -destination "platform=iOS Simulator,id=$simulator" \
          -resultBundlePath TestResults \
          -derivedDataPath /tmp/xcode-derived-compose \
          -enableCodeCoverage NO \
          -parallel-testing-enabled NO
        TESTS

    - name: Collect iOS test reports
      if: ${{ always() && (inputs.run-ios-simulator-tests == 'true' || inputs.run-wallet-sdk-tests == 'true' || inputs.run-native-demo-tests == 'true' || inputs.run-compose-demo-tests == 'true') }}
      id: ios_test_report
      shell: bash
      run: |
        WALTID_DIR="${{ inputs.waltid-directory }}"
        REPORT_ROOT="$WALTID_DIR/build/ios-test-reports"
        XCODE_REPORT_DIR="$REPORT_ROOT/xcresult"
        GRADLE_REPORT_DIR="$REPORT_ROOT/gradle"

        rm -rf "$REPORT_ROOT"
        mkdir -p "$XCODE_REPORT_DIR" "$GRADLE_REPORT_DIR"

        xcode_report_count=0
        gradle_report_count=0
        xcresultparser_ready=false

        for xcode_search_root in "$WALTID_DIR" /tmp/xcode-derived/Logs/Test; do
          [[ -d "$xcode_search_root" ]] || continue

          while IFS= read -r -d '' bundle; do
            if [[ "$xcresultparser_ready" != "true" ]]; then
              if ! command -v xcresultparser >/dev/null 2>&1; then
                # See install-and-run-kdoctor: the runner image's untrusted aws/tap makes every
                # `brew install` emit a tap-trust warning. Drop it first.
                brew untap aws/tap 2>/dev/null || true
                brew install xcresultparser
              fi
              xcresultparser_ready=true
            fi

            if [[ "$bundle" == "$WALTID_DIR/"* ]]; then
              relative_bundle="${bundle#$WALTID_DIR/}"
            else
              relative_bundle="$bundle"
            fi
            safe_name=$(printf '%s' "$relative_bundle" | tr '/ ' '__' | LC_ALL=C tr -c '[:alnum:]_.-' '_')
            report_file="$XCODE_REPORT_DIR/${xcode_report_count}-${safe_name}.xml"

            if xcresultparser "$bundle" --output-format=junit > "$report_file"; then
              echo "Converted iOS xcresult bundle to JUnit: $relative_bundle"
              xcode_report_count=$((xcode_report_count + 1))
            else
              echo "::warning::Failed to convert iOS xcresult bundle at $bundle"
              rm -f "$report_file"
            fi
          done < <(find "$xcode_search_root" -name '*.xcresult' -prune -print0 2>/dev/null || true)
        done

        if (( xcode_report_count > 0 )); then
          echo "Converted $xcode_report_count iOS xcresult bundle(s)."
        fi

        while IFS= read -r -d '' gradle_report; do
          relative_report="${gradle_report#$WALTID_DIR/}"
          safe_name=$(printf '%s' "$relative_report" | tr '/ ' '__' | LC_ALL=C tr -c '[:alnum:]_.-' '_')
          cp "$gradle_report" "$GRADLE_REPORT_DIR/$safe_name"
          gradle_report_count=$((gradle_report_count + 1))
        done < <(find "$WALTID_DIR" -path '*/build/test-results/*' -name '*.xml' -type f -print0 2>/dev/null || true)

        {
          echo "## iOS Test Report Collection"
          echo "- Xcode result bundles converted: $xcode_report_count"
          echo "- Gradle XML reports collected: $gradle_report_count"
        } >> "$GITHUB_STEP_SUMMARY"

        if (( xcode_report_count == 0 && gradle_report_count == 0 )); then
          echo "has_report=false" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.test-report-require-tests }}" == "true" ]]; then
            echo "::error::Required iOS test reports are missing under $WALTID_DIR"
            exit 1
          fi
          echo "::warning::No iOS test reports found under $WALTID_DIR"
          exit 0
        fi

        echo "has_report=true" >> "$GITHUB_OUTPUT"

    - name: Require native demo consent test discovery
      if: ${{ always() && inputs.run-native-demo-tests == 'true' }}
      shell: bash
      run: |
        python3 "${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/verify_test_results.py" \
          --manifest "${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/proximity-test-suites.json" \
          --suite native-demo-consent \
          --reports "${{ inputs.waltid-directory }}/build/ios-test-reports/xcresult/*.xml"

    - name: Require native wallet readiness and restart test results
      if: ${{ always() && inputs.run-native-demo-tests == 'true' }}
      shell: bash
      run: |
        python3 "${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/verify_test_results.py" \
          --manifest "${{ inputs.waltid-directory }}/.github/scripts/mobile-ci/native-readiness-test-suite.json" \
          --suite native-demo-readiness \
          --reports "${{ inputs.waltid-directory }}/build/ios-test-reports/xcresult/*waltid-wallet-demo-ios*.xml"

    - name: Publish iOS test report
      if: always() && steps.ios_test_report.outputs.has_report == 'true'
      uses: mikepenz/action-junit-report@v6
      with:
        update_check: true
        job_name: ${{ inputs.test-report-job-name }}
        check_name: ${{ inputs.test-report-check-name }}
        report_paths: ${{ inputs.waltid-directory }}/build/ios-test-reports/**/*.xml
        detailed_summary: true
        include_passed: false
        include_skipped: false
        require_tests: ${{ inputs.test-report-require-tests }}

    - name: Cleanup simulators after tests
      if: ${{ always() && (inputs.run-ios-simulator-tests == 'true' || inputs.run-wallet-sdk-tests == 'true' || inputs.run-native-demo-tests == 'true' || inputs.run-compose-demo-tests == 'true') }}
      shell: bash
      run: |
        echo "Shutting down all simulators..."
        xcrun simctl shutdown all || true

    - name: Upload iOS test results
      if: always() && (failure() || steps.wallet_sdk_tests.outcome == 'failure' || steps.ios_simulator_tests.outcome == 'failure' || steps.ios_demo_app_tests.outcome == 'failure' || steps.compose_ios_demo_app_tests.outcome == 'failure')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.test-result-artifact-name }}
        path: |
          ${{ inputs.waltid-directory }}/build/ios-test-reports/**
          ${{ inputs.waltid-directory }}/**/*.xcresult
          /tmp/xcode-derived/Logs/Test/**/*.xcresult
          ${{ inputs.waltid-directory }}/**/build/test-results/**
        retention-days: 7

    - name: Fail if iOS tests failed
      if: ${{ always() && (inputs.run-ios-simulator-tests == 'true' || inputs.run-wallet-sdk-tests == 'true' || inputs.run-native-demo-tests == 'true' || inputs.run-compose-demo-tests == 'true' || inputs.run-native-identity-document-provider-checks == 'true' || inputs.run-compose-identity-document-provider-checks == 'true') }}
      shell: bash
      run: |
        failed=()

        if [[ "${{ inputs.run-wallet-sdk-tests }}" == "true" && "${{ steps.wallet_sdk_tests.outcome }}" != "success" ]]; then
          failed+=("WalletSDK package bridge tests")
        fi

        if [[ "${{ inputs.run-ios-simulator-tests }}" == "true" && "${{ steps.ios_simulator_tests.outcome }}" == "failure" ]]; then
          failed+=("iosSimulatorArm64Test")
        fi
        if [[ "${{ inputs.run-native-identity-document-provider-checks }}" == "true" && "${{ steps.native_identity_document_provider_checks.outcome }}" == "failure" ]]; then
          failed+=("native identity document provider configuration")
        fi
        if [[ "${{ inputs.run-compose-identity-document-provider-checks }}" == "true" && "${{ steps.compose_identity_document_provider_checks.outcome }}" == "failure" ]]; then
          failed+=("Compose identity document provider configuration")
        fi
        if [[ "${{ inputs.run-native-demo-tests }}" == "true" && "${{ steps.ios_demo_app_tests.outcome }}" == "failure" ]]; then
          failed+=("native iOS demo app tests")
        fi
        if [[ "${{ inputs.run-compose-demo-tests }}" == "true" && "${{ steps.compose_ios_demo_app_tests.outcome }}" == "failure" ]]; then
          failed+=("Compose iOS demo app tests")
        fi
        if (( ${#failed[@]} > 0 )); then
          printf '::error::iOS test step(s) failed: %s\n' "${failed[*]}"
          exit 1
        fi
