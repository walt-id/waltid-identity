name: gradle-mobile-sdk-docs
description: Generate mobile wallet SDK API docs with the workflow's Xcode toolchain
inputs:
  waltid-directory:
    description: 'Path to the waltid-identity directory'
    required: false
    default: '.'
  generate-dokka:
    description: 'Generate Dokka HTML for the mobile SDK modules'
    required: false
    default: 'true'
  check-snippets:
    description: 'Run mobile wallet documentation snippet checks'
    required: false
    default: 'true'
  skip-wallet-core-assemble:
    description: 'Skip WalletCore XCFramework assemble when a restored artifact is already present'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Configure iOS build environment
      uses: ./waltid-identity/.github/actions/ios-build-setup
      with:
        gradle-properties-path: '${{ inputs.waltid-directory }}/gradle.properties'

    - name: Check mobile wallet documentation snippets
      if: ${{ inputs.check-snippets == 'true' }}
      working-directory: ${{ inputs.waltid-directory }}
      shell: bash
      run: python3 waltid-libraries/protocols/waltid-wallet-sdk-ios/scripts/check-mobile-wallet-doc-snippets.py

    - name: Generate mobile SDK API docs
      if: ${{ inputs.generate-dokka == 'true' }}
      working-directory: ${{ inputs.waltid-directory }}
      shell: bash
      run: |
        ./gradlew \
          :waltid-libraries:protocols:waltid-openid4vc-wallet-mobile:dokkaGeneratePublicationHtml \
          :waltid-libraries:protocols:waltid-openid4vc-wallet-persistence-mobile:dokkaGeneratePublicationHtml \
          -PenableAndroidBuild=true \
          -PenableIosBuild=true \
          --no-daemon \
          --console=plain \
          --warning-mode=summary

    - name: Assemble Swift wallet SDK core XCFramework
      if: ${{ inputs.skip-wallet-core-assemble != 'true' }}
      working-directory: ${{ inputs.waltid-directory }}
      shell: bash
      run: |
        ./gradlew \
          :waltid-libraries:protocols:waltid-openid4vc-wallet-mobile:assembleWalletCoreReleaseXCFramework \
          -PenableIosBuild=true \
          --no-daemon \
          --console=plain \
          --warning-mode=summary

    - name: Generate Swift WalletSDK DocC archive
      working-directory: ${{ inputs.waltid-directory }}
      shell: bash
      run: waltid-libraries/protocols/waltid-wallet-sdk-ios/scripts/generate-docc.sh
