{
    sinks = {
        stdout = {
            renderWith = RENDER_SIMPLE
            sendTo = STDOUT
        }
        stderr = {
            renderWith = RENDER_SIMPLE
            sendTo = STDERR
        }
    }
    logging = [
        {
            levelRanges = [
                {
                    fromMinLevel = ERROR
                    toSinks = [stderr]
                }
                {
                    fromMinLevel = INFO
                    toMaxLevel = WARN
                    toSinks = [stdout]
                }
            ]
        }
    ]
}
